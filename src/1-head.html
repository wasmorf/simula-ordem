<meta name="description" content="Mesa virtual de Ordem Paranormal com as regras do livro: fichas, rolagens, cenas, tokens, escudo do mestre e homebrew.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Caveat:wght@500;700&family=Special+Elite&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/* Simula Ordem — sigilo roxo, sangue vermelho. Layout: trilho de ferramentas à esquerda, tabuleiro no centro, painel à direita; no celular, barra de baixo e painéis em tela cheia. */
:root {
  --bg: #0b090f;
  --board: #08070b;
  --panel: #141019;
  --panel2: #1c1724;
  --line: #2e2540;
  --fg: #ede7f3;
  --muted: #9b91aa;
  --purple: #8b3ff0;
  --purple-hi: #b47dff;
  --purple-soft: #24163a;
  --red: #d3283b;
  --red-hi: #ff4d5e;
  --red-soft: #3a1019;
  --ok: #5fae70;
  --warn: #e0a03c;
  --sangue: #e0303f;
  --morte: #8f8b94;
  --energia: #a35ce0;
  --conhecimento: #d6ad45;
  --f-display: "IM Fell English SC", "Times New Roman", serif;
  --f-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --rail: 64px;
  --navh: 64px;
  color-scheme: dark;
}
* {
  box-sizing: border-box;
}
html,
body {
  height: 100%;
  margin: 0;
  background: var(--bg);
  color: var(--fg);
}
body {
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
[hidden] {
  display: none !important;
}
button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}
button {
  cursor: pointer;
}
:focus-visible {
  outline: 2px solid var(--purple-hi);
  outline-offset: 2px;
}
img {
  max-width: 100%;
}
h1,
h2,
h3 {
  font-family: var(--f-display);
  font-weight: 400;
  margin: 0;
  text-wrap: balance;
}
h2 {
  font-size: 24px;
}
h3 {
  font-size: 18px;
  color: var(--purple-hi);
}
.label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--muted);
  font-weight: 600;
}
.muted {
  color: var(--muted);
}
.small {
  font-size: 13px;
}
.stack {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
}
.between {
  justify-content: space-between;
}
.btn {
  background: var(--panel2);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 8px 12px;
  font-weight: 600;
  line-height: 1.2;
}
.btn:hover {
  border-color: var(--purple);
}
.btn.primary {
  background: var(--purple);
  border-color: var(--purple);
  color: #fff;
}
.btn.primary:hover {
  background: #9a52ff;
}
.btn.danger {
  background: var(--red-soft);
  border-color: var(--red);
  color: #ffd9dd;
}
.btn.ghost {
  background: none;
}
.btn.sm {
  padding: 4px 8px;
  font-size: 13px;
}
.btn.block {
  width: 100%;
}
.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}
input[type="text"],
input[type="url"],
input[type="password"],
input[type="number"],
input[type="search"],
select,
textarea {
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 7px 9px;
  min-width: 0;
  width: 100%;
}
input[type="range"],
input[type="checkbox"] {
  accent-color: var(--purple);
}
input[type="number"] {
  font-family: var(--f-mono);
}
textarea {
  min-height: 90px;
  resize: vertical;
}
.field {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
}
.fields {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 10px;
}
.box {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 12px;
  min-width: 0;
}
.empty {
  border: 1px dashed var(--line);
  border-radius: 8px;
  padding: 18px;
  text-align: center;
  color: var(--muted);
  font-size: 14px;
}
.tag {
  display: inline-block;
  font-size: 11px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 2px 6px;
  border-radius: 4px;
  border: 1px solid var(--line);
  color: var(--muted);
}
.tag.on {
  border-color: var(--purple);
  color: var(--purple-hi);
}
.tag.red {
  border-color: var(--red);
  color: var(--red-hi);
}
.scroll-x {
  overflow-x: auto;
}
.check {
  display: flex;
  gap: 6px;
  align-items: center;
  font-size: 14px;
}

/* ---------- lobby ---------- */
#lobby {
  min-height: 100%;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background:
    radial-gradient(900px 500px at 85% -10%, var(--purple-soft), transparent 70%),
    radial-gradient(700px 400px at -10% 110%, var(--red-soft), transparent 70%), var(--bg);
}
.lwrap {
  max-width: 1100px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 22px 60px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: var(--f-display);
  font-size: 22px;
  line-height: 1;
}
.brand small {
  display: block;
  font-family: var(--f-body);
  font-size: 10px;
  letter-spacing: 0.22em;
  color: var(--muted);
  text-transform: uppercase;
  margin-top: 3px;
}
.hero {
  display: grid;
  gap: 22px;
  grid-template-columns: 1fr;
  margin-top: 34px;
}
@media (min-width: 820px) {
  .hero {
    grid-template-columns: 1.25fr 1fr;
    align-items: start;
  }
}
.hero h1 {
  font-size: clamp(38px, 7vw, 64px);
  line-height: 0.98;
}
.hero h1 em {
  font-style: normal;
  color: var(--red-hi);
}
.hero h1 b {
  font-weight: 400;
  color: var(--purple-hi);
}
.hero p {
  max-width: 58ch;
  color: var(--muted);
  font-size: 16px;
}
.feats {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.mesas {
  display: grid;
  gap: 10px;
  grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
}
.mesa-card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 14px;
  text-align: left;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.mesa-card:hover {
  border-color: var(--purple);
}
.mesa-card b {
  font-family: var(--f-display);
  font-size: 21px;
  font-weight: 400;
}
.who {
  display: flex;
  gap: 8px;
  align-items: center;
  font-size: 13px;
  color: var(--muted);
}

/* ---------- mesa virtual ---------- */
#vtt {
  position: fixed;
  inset: 0;
  display: grid;
  grid-template-columns: var(--rail) minmax(0, 1fr) auto;
  background: var(--board);
}
.rail {
  background: var(--panel);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding-top: calc(10px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  padding-left: env(safe-area-inset-left, 0px);
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-width: none;
}
.rail::-webkit-scrollbar {
  display: none;
}
.rail .logo {
  margin-bottom: 10px;
}
.tool {
  width: 48px;
  height: 48px;
  border-radius: 10px;
  border: 1px solid transparent;
  background: none;
  display: grid;
  place-items: center;
  color: var(--muted);
  position: relative;
}
.tool:hover {
  color: var(--fg);
  background: var(--panel2);
}
.tool[aria-pressed="true"] {
  color: #fff;
  background: var(--purple-soft);
  border-color: var(--purple);
}
.tool svg {
  width: 24px;
  height: 24px;
}
.tool .tip {
  position: absolute;
  left: 56px;
  top: 50%;
  transform: translateY(-50%);
  background: var(--panel2);
  border: 1px solid var(--line);
  border-radius: 5px;
  padding: 3px 8px;
  font-size: 12px;
  white-space: nowrap;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.12s;
  z-index: 30;
}
.tool:hover .tip {
  opacity: 1;
}
.rail .sep {
  width: 30px;
  height: 1px;
  background: var(--line);
  margin: 6px 0;
}
.rail .grow {
  flex: 1;
}

.board {
  position: relative;
  overflow: hidden;
  touch-action: none;
  background: radial-gradient(circle at 50% 50%, #120e18 0, #08070b 70%);
}
.viewport {
  position: absolute;
  left: 0;
  top: 0;
  transform-origin: 0 0;
  will-change: transform;
}
.viewport > img.map {
  display: block;
  max-width: none;
  user-select: none;
  -webkit-user-drag: none;
  pointer-events: none;
  box-shadow:
    0 0 0 1px var(--line),
    0 20px 60px rgba(0, 0, 0, 0.6);
}
.grid-ov {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background-image:
    linear-gradient(to right, rgba(180, 125, 255, 0.18) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(180, 125, 255, 0.18) 1px, transparent 1px);
}
.tok {
  position: absolute;
  transform: translate(-50%, -50%);
  touch-action: none;
  cursor: grab;
  display: flex;
  flex-direction: column;
  align-items: center;
  user-select: none;
}
.tok img {
  display: block;
  max-width: none;
  pointer-events: none;
  filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.6));
}
.tok .tn {
  margin-top: 2px;
  font-size: 12px;
  font-weight: 700;
  background: rgba(10, 8, 14, 0.85);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 0 6px;
  white-space: nowrap;
  opacity: 0;
  transition: opacity 0.12s;
}
.tok:hover .tn,
.tok.sel .tn {
  opacity: 1;
}
.tok.sel img {
  filter: drop-shadow(0 0 3px var(--purple-hi)) drop-shadow(0 0 10px var(--purple));
}
.tok.locked {
  cursor: default;
}
.tok .hp {
  width: 56px;
  height: 5px;
  background: rgba(0, 0, 0, 0.6);
  border-radius: 3px;
  overflow: hidden;
  margin-top: 2px;
}
.tok .hp i {
  display: block;
  height: 100%;
  background: var(--red);
}
.board-top {
  position: absolute;
  top: calc(10px + env(safe-area-inset-top, 0px));
  left: 12px;
  right: 12px;
  display: flex;
  gap: 8px;
  align-items: center;
  pointer-events: none;
  z-index: 4;
}
.board-top > * {
  pointer-events: auto;
}
.chip {
  background: rgba(20, 16, 25, 0.9);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 5px 12px;
  font-size: 13px;
  display: flex;
  gap: 8px;
  align-items: center;
}
.chip .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--purple-hi);
}
.chip.hidden-scene .dot {
  background: var(--warn);
}
.zoom {
  position: absolute;
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
  z-index: 4;
}
.zoom button {
  width: 40px;
  height: 38px;
  border: 0;
  background: var(--purple);
  color: #fff;
  font-size: 20px;
  line-height: 1;
}
.zoom span {
  min-width: 64px;
  text-align: center;
  font-family: var(--f-mono);
  font-size: 14px;
}
.zoom .fit {
  background: var(--panel2);
  color: var(--fg);
  font-size: 12px;
  width: auto;
  padding: 0 10px;
  font-family: var(--f-body);
  font-weight: 600;
}
.board-empty {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  padding: 24px;
  text-align: center;
  color: var(--muted);
}
.board-empty .in {
  max-width: 420px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  align-items: center;
}
.board-empty svg {
  opacity: 0.5;
}
.tokbar {
  position: absolute;
  right: 12px;
  bottom: calc(64px + env(safe-area-inset-bottom, 0px));
  z-index: 4;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-width: 230px;
}

.panel {
  background: var(--panel);
  border-left: 1px solid var(--line);
  width: 400px;
  display: flex;
  flex-direction: column;
  min-height: 0;
  height: 100%;
  padding-top: env(safe-area-inset-top, 0px);
  padding-right: env(safe-area-inset-right, 0px);
}
.panel.wide {
  width: min(860px, 62vw);
}
.phead {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 16px;
  border-bottom: 1px solid var(--line);
}
.phead h2 {
  font-size: 20px;
  flex: 1;
  min-width: 0;
}
.pbody {
  flex: 1;
  overflow-y: auto;
  padding: 14px 16px calc(24px + env(safe-area-inset-bottom, 0px));
  display: flex;
  flex-direction: column;
  gap: 14px;
  min-height: 0;
}
.x {
  background: none;
  border: 0;
  color: var(--muted);
  font-size: 22px;
  line-height: 1;
  padding: 4px 8px;
}
.x:hover {
  color: var(--fg);
}

.bottomnav {
  display: none;
}
@media (max-width: 760px) {
  #vtt {
    grid-template-columns: 1fr;
    grid-template-rows: minmax(0, 1fr) calc(var(--navh) + env(safe-area-inset-bottom, 0px));
  }
  .rail {
    display: none;
  }
  .panel,
  .panel.wide {
    position: fixed;
    left: 0;
    right: 0;
    top: 0;
    bottom: calc(var(--navh) + env(safe-area-inset-bottom, 0px));
    width: auto;
    z-index: 20;
    border-left: 0;
    padding-left: env(safe-area-inset-left, 0px);
  }
  .bottomnav {
    display: flex;
    background: var(--panel);
    border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-left: env(safe-area-inset-left, 0px);
    padding-right: env(safe-area-inset-right, 0px);
    overflow-x: auto;
    z-index: 21;
  }
  .bottomnav button {
    flex: 1 0 64px;
    background: none;
    border: 0;
    color: var(--muted);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    font-size: 11px;
    font-weight: 600;
    height: var(--navh);
  }
  .bottomnav button[aria-pressed="true"] {
    color: #fff;
    box-shadow: inset 0 2px 0 var(--purple);
  }
  .bottomnav svg {
    width: 24px;
    height: 24px;
  }
  .zoom {
    bottom: 12px;
  }
  .tokbar {
    bottom: 62px;
  }
}

/* ---------- listas do painel ---------- */
.cards {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.scene {
  display: grid;
  grid-template-columns: 96px minmax(0, 1fr);
  gap: 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel2);
  padding: 8px;
  align-items: center;
}
.scene.live {
  border-color: var(--purple);
  box-shadow: 0 0 0 1px var(--purple) inset;
}
.scene .th {
  width: 96px;
  height: 64px;
  border-radius: 5px;
  object-fit: cover;
  background: var(--bg);
  display: block;
}
.scene .st {
  font-size: 11px;
  color: var(--muted);
}
.scene.live .st {
  color: var(--purple-hi);
}
.scene .nm {
  font-family: var(--f-display);
  font-size: 18px;
  line-height: 1.1;
}
.tokrow {
  display: grid;
  grid-template-columns: 52px minmax(0, 1fr) auto;
  gap: 10px;
  align-items: center;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel2);
  padding: 6px 8px;
}
.tokrow img,
.avatar {
  width: 52px;
  height: 52px;
  object-fit: contain;
  border-radius: 6px;
  background: var(--bg);
  display: block;
}
.avatar.ph {
  display: grid;
  place-items: center;
  font-family: var(--f-display);
  font-size: 22px;
  color: var(--purple-hi);
}
.sub {
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 600;
  margin-top: 4px;
}
.tabs2 {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
}
.tabs2 button {
  background: none;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 4px 10px;
  font-size: 12px;
  color: var(--muted);
  font-weight: 600;
}
.tabs2 button[aria-pressed="true"] {
  border-color: var(--purple);
  color: var(--purple-hi);
  background: var(--purple-soft);
}

/* ---------- fichas ---------- */
.fcard {
  background: var(--panel2);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px;
  display: grid;
  grid-template-columns: 52px minmax(0, 1fr);
  gap: 10px;
  text-align: left;
  width: 100%;
}
.fcard:hover {
  border-color: var(--purple);
}
.fcard .nm {
  font-family: var(--f-display);
  font-size: 19px;
  line-height: 1.1;
}
.bars {
  display: grid;
  gap: 4px;
  grid-column: 1 / -1;
}
.bar {
  display: grid;
  grid-template-columns: 34px 1fr 64px;
  gap: 8px;
  align-items: center;
  font-size: 12px;
}
.bar .t {
  height: 8px;
  background: var(--bg);
  border-radius: 4px;
  overflow: hidden;
  border: 1px solid var(--line);
}
.bar .t i {
  display: block;
  height: 100%;
}
.bar .v {
  font-family: var(--f-mono);
  text-align: right;
}
.bar.pv i {
  background: var(--red);
}
.bar.san i {
  background: var(--purple);
}
.bar.pe i {
  background: var(--warn);
}
.sheet-top {
  display: grid;
  grid-template-columns: 120px minmax(0, 1fr);
  gap: 14px;
  align-items: start;
}
.photo {
  width: 120px;
  height: 160px;
  border-radius: 10px;
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
  border: 1px solid var(--line);
  background: var(--bg);
  overflow: hidden;
  position: relative;
  display: grid;
  place-items: center;
  padding: 0;
}
.photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: 50% 15%;
}
.photo span {
  font-size: 11px;
  color: var(--muted);
  padding: 6px;
  text-align: center;
}
.nmin {
  font-family: var(--f-display);
  font-size: 26px;
  background: none !important;
  border: 0 !important;
  border-bottom: 1px solid var(--line) !important;
  border-radius: 0 !important;
  padding: 2px 0 !important;
}
.sgrid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 14px;
}
.panel.wide .sgrid {
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
}
.attrs {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 6px;
}
.attr {
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 50% 50% 8px 8px;
  padding: 8px 2px 6px;
  text-align: center;
  display: flex;
  flex-direction: column;
  gap: 2px;
  align-items: center;
}
.attr .k {
  font-family: var(--f-display);
  font-size: 15px;
  color: var(--purple-hi);
}
.attr .n {
  font-family: var(--f-mono);
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
}
.attr .pm {
  display: flex;
  gap: 3px;
}
.attr .pm button {
  width: 24px;
  height: 22px;
  border-radius: 4px;
  border: 1px solid var(--line);
  background: var(--panel2);
  padding: 0;
  line-height: 1;
}
.res {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}
.resbox {
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 8px 10px;
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.resbox .big {
  font-family: var(--f-mono);
  font-size: 21px;
  font-weight: 700;
}
.resbox .big small {
  font-size: 13px;
  color: var(--muted);
  font-weight: 400;
}
.resbox .pm {
  display: flex;
  gap: 3px;
}
.resbox .pm button {
  flex: 1;
  padding: 3px 0;
  border: 1px solid var(--line);
  background: var(--panel2);
  border-radius: 4px;
  font-family: var(--f-mono);
  font-size: 12px;
}
.resbox.pv {
  border-top: 3px solid var(--red);
}
.resbox.san {
  border-top: 3px solid var(--purple);
}
.resbox.pe {
  border-top: 3px solid var(--warn);
}
.resbox.def {
  border-top: 3px solid var(--muted);
}
.per {
  display: grid;
  grid-template-columns: 20px minmax(0, 1fr) 30px 46px 58px;
  gap: 6px;
  align-items: center;
  padding: 3px 0;
  border-bottom: 1px solid var(--line);
  font-size: 14px;
}
.per .a {
  font-family: var(--f-mono);
  font-size: 11px;
  color: var(--muted);
}
.per input[type="number"] {
  padding: 3px 4px;
  font-size: 12px;
  text-align: center;
}
.per .only {
  font-size: 10px;
  color: var(--muted);
}
.per.tr .pn {
  font-weight: 600;
  color: var(--purple-hi);
}
.per:not(.tr) .pn {
  color: var(--muted);
}
.rollbtn {
  background: var(--red-soft);
  border: 1px solid var(--red);
  color: var(--fg);
  border-radius: 5px;
  padding: 3px 6px;
  font-family: var(--f-mono);
  font-size: 12px;
  white-space: nowrap;
}
.rollbtn:hover {
  background: var(--red);
}
.rollbtn:disabled {
  opacity: 0.4;
}
table.t {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
table.t th {
  text-align: left;
  font-size: 11px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 600;
  padding: 4px;
}
table.t td {
  padding: 4px;
  border-top: 1px solid var(--line);
  vertical-align: middle;
}
table.t input,
table.t select {
  padding: 4px 6px;
  font-size: 13px;
}
.ritual {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  gap: 10px;
  align-items: center;
  border: 1px solid var(--line);
  border-left: 4px solid var(--el, var(--muted));
  border-radius: 6px;
  padding: 8px 10px;
  background: var(--bg);
}
.ritual .rn {
  font-weight: 600;
}
.ritual .rd {
  font-size: 12px;
  color: var(--muted);
}
.el-Sangue {
  --el: var(--sangue);
}
.el-Morte {
  --el: var(--morte);
}
.el-Energia {
  --el: var(--energia);
}
.el-Conhecimento {
  --el: var(--conhecimento);
}
.el-Medo {
  --el: #e9e9f0;
}
.conds {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.cond {
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 3px 10px;
  font-size: 13px;
  background: var(--bg);
  color: var(--muted);
}
.cond[aria-pressed="true"] {
  border-color: var(--red);
  color: var(--red-hi);
  background: var(--red-soft);
}

/* ---------- rolagens ---------- */
.log {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.entry {
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 8px 10px;
  background: var(--panel2);
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 3px 10px;
}
.entry .wh {
  font-size: 12px;
  color: var(--muted);
}
.entry .wh b {
  color: var(--purple-hi);
  font-weight: 600;
}
.entry .wt {
  font-weight: 600;
}
.entry .tot {
  grid-row: 1 / span 3;
  grid-column: 2;
  font-family: var(--f-mono);
  font-size: 24px;
  font-weight: 700;
  align-self: center;
  text-align: right;
  min-width: 40px;
}
.entry .det {
  font-family: var(--f-mono);
  font-size: 12px;
  color: var(--muted);
  word-break: break-word;
}
.entry.crit {
  border-color: var(--purple);
}
.entry.crit .tot {
  color: var(--purple-hi);
}
.entry.fail .tot {
  color: var(--red-hi);
}
.entry.chat {
  grid-template-columns: 1fr;
}
.entry.chat .wt {
  font-weight: 400;
}
.entry.secret {
  border-style: dashed;
}
.dicebar {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
}
.dicebar button {
  font-family: var(--f-mono);
  font-size: 13px;
}

/* popup de dado (para todos) */
#dicePops {
  position: fixed;
  bottom: calc(72px + env(safe-area-inset-bottom, 0px));
  left: calc(var(--rail) + 12px + env(safe-area-inset-left, 0px));
  z-index: 40;
  display: flex;
  flex-direction: column-reverse;
  gap: 8px;
  pointer-events: none;
  width: min(320px, calc(100vw - 24px));
}
.dpop {
  pointer-events: auto;
  background: rgba(20, 16, 25, 0.97);
  border: 1px solid var(--purple);
  border-radius: 8px;
  padding: 10px 12px;
  display: grid;
  grid-template-columns: 28px minmax(0, 1fr) auto;
  gap: 10px;
  align-items: center;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
}
.dpop.crit {
  border-color: var(--purple-hi);
  box-shadow:
    0 0 0 1px var(--purple-hi),
    0 10px 30px rgba(139, 63, 240, 0.35);
}
.dpop.fail {
  border-color: var(--red);
}
.dpop .t {
  font-weight: 700;
  font-size: 14px;
}
.dpop .s {
  font-family: var(--f-mono);
  font-size: 11px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.dpop .n {
  font-family: var(--f-mono);
  font-size: 28px;
  font-weight: 700;
}
@media (prefers-reduced-motion: no-preference) {
  .dpop {
    animation: pop 0.3s ease-out;
  }
  @keyframes pop {
    from {
      transform: translateX(16px);
      opacity: 0;
    }
    to {
      transform: none;
      opacity: 1;
    }
  }
}

/* ---------- combate / escudo ---------- */
.cb {
  display: grid;
  grid-template-columns: 40px minmax(0, 1fr) auto;
  gap: 8px;
  align-items: center;
  background: var(--panel2);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 8px;
}
.cb.now {
  border-color: var(--red);
  box-shadow: inset 3px 0 0 var(--red);
}
.cb .iv {
  font-family: var(--f-mono);
  font-size: 19px;
  font-weight: 700;
  text-align: center;
}
.cb .cn {
  font-weight: 600;
}
.cb .cs {
  font-size: 12px;
  color: var(--muted);
  font-family: var(--f-mono);
}
.cb .act {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  justify-content: flex-end;
}
.cb.down {
  opacity: 0.5;
}
.cb.npc .cn {
  color: var(--red-hi);
}
.shield {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 10px;
}
.scard {
  background: var(--panel2);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.scard .top {
  display: grid;
  grid-template-columns: 52px minmax(0, 1fr);
  gap: 10px;
  align-items: center;
}
.scard .nm {
  font-family: var(--f-display);
  font-size: 18px;
  line-height: 1.1;
}
.mini {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 4px;
  text-align: center;
}
.mini div {
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 5px;
  padding: 3px 0;
}
.mini b {
  display: block;
  font-family: var(--f-mono);
  font-size: 15px;
}
.mini span {
  font-size: 10px;
  color: var(--muted);
}
.sbar {
  display: grid;
  grid-template-columns: 30px 1fr 30px;
  gap: 4px;
  align-items: center;
}
.sbar button {
  padding: 2px 0;
  border: 1px solid var(--line);
  background: var(--bg);
  border-radius: 4px;
  font-family: var(--f-mono);
  font-size: 12px;
}
.sbar .t {
  position: relative;
  height: 20px;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 4px;
  overflow: hidden;
}
.sbar .t i {
  position: absolute;
  inset: 0 auto 0 0;
}
.sbar .t span {
  position: relative;
  display: block;
  text-align: center;
  font-family: var(--f-mono);
  font-size: 12px;
  line-height: 18px;
}
.sbar.pv i {
  background: var(--red);
}
.sbar.san i {
  background: var(--purple);
}
.sbar.pe i {
  background: #a06a1c;
}
.dtref td {
  font-family: var(--f-mono);
}

/* ---------- homebrew ---------- */
.hb {
  border: 1px solid var(--line);
  border-left: 4px solid var(--el, var(--purple));
  border-radius: 8px;
  padding: 8px 10px;
  background: var(--panel2);
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.hb .hn {
  font-weight: 700;
}

/* ---------- modal / toast ---------- */
.modal-back {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.65);
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.modal {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 16px;
  max-width: 440px;
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 12px;
  max-height: 90vh;
  overflow-y: auto;
}
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(84px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  background: var(--panel2);
  border: 1px solid var(--purple);
  padding: 10px 16px;
  border-radius: 8px;
  z-index: 60;
  max-width: calc(100% - 32px);
  font-size: 14px;
}
.banner {
  border: 1px solid var(--warn);
  color: var(--warn);
  background: #291e0e;
  padding: 10px 12px;
  border-radius: 8px;
  font-size: 14px;
}

/* ---------- call ---------- */
.cavs {
  display: flex;
}
.cavs .cav {
  margin-left: -6px;
}
.cavs .cav:first-child {
  margin-left: 0;
}
.cav {
  position: relative;
  border-radius: 50%;
  background: var(--purple-soft);
  border: 2px solid var(--panel);
  display: grid;
  place-items: center;
  overflow: visible;
  flex: none;
  transition: box-shadow 0.12s;
}
.cav img {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
}
.cav b {
  font-family: var(--f-display);
  font-weight: 400;
  color: var(--purple-hi);
  font-size: 14px;
}
.cav.speak {
  box-shadow:
    0 0 0 2px var(--purple-hi),
    0 0 12px var(--purple);
}
.cav .mut {
  position: absolute;
  right: -4px;
  bottom: -4px;
  width: 15px;
  height: 15px;
  border-radius: 50%;
  background: var(--red);
  color: #fff;
  display: grid;
  place-items: center;
}
.cav .mut svg {
  width: 10px;
  height: 10px;
}
.cav .st {
  position: absolute;
  left: -2px;
  top: -2px;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--warn);
  border: 1px solid var(--panel);
}
.cbtn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--panel2);
  display: grid;
  place-items: center;
  color: var(--fg);
}
.cbtn svg {
  width: 19px;
  height: 19px;
}
.cbtn.off {
  background: var(--red-soft);
  border-color: var(--red);
  color: var(--red-hi);
}
.cbtn.live {
  background: var(--purple);
  border-color: var(--purple);
}
.cbtn.hang {
  background: var(--red);
  border-color: var(--red);
  color: #fff;
}
.scr {
  background: #000;
  border: 1px solid var(--purple);
  border-radius: 8px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.scr .sh {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  padding: 4px 6px 4px 10px;
  background: var(--panel);
  font-size: 13px;
  font-weight: 600;
}
.scr video {
  width: 100%;
  display: block;
  background: #000;
  aspect-ratio: 16/9;
  object-fit: contain;
}

/* ---------- ficha: barras, cards de arma e ritual ---------- */
.rbar {
  display: flex;
  gap: 10px;
  align-items: center;
}
.ric {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  flex: none;
  border: 2px solid rgba(255, 255, 255, 0.25);
  color: #fff;
}
.ric svg {
  width: 22px;
  height: 22px;
}
.rbar.pv .ric {
  background: radial-gradient(circle at 35% 30%, #ff5a68, #8d1220);
}
.rbar.san .ric {
  background: radial-gradient(circle at 35% 30%, #b47dff, #4a1c8a);
}
.rbar.pe .ric {
  background: radial-gradient(circle at 35% 30%, #f1b54a, #8a5a10);
}
.rtr {
  position: relative;
  display: flex;
  align-items: center;
  height: 30px;
  border-radius: 5px;
  overflow: hidden;
  background: var(--bg);
  border: 1px solid var(--line);
  margin-top: 3px;
}
.rtr i {
  position: absolute;
  inset: 0 auto 0 0;
  transition: width 0.25s;
}
.rbar.pv .rtr i {
  background: linear-gradient(90deg, #8d1220, var(--red));
}
.rbar.san .rtr i {
  background: linear-gradient(90deg, #4a1c8a, var(--purple));
}
.rbar.pe .rtr i {
  background: linear-gradient(90deg, #8a5a10, #d39a2e);
}
.rtr span {
  position: relative;
  flex: 1;
  text-align: center;
  font-family: var(--f-mono);
  font-weight: 700;
  font-size: 14px;
  text-shadow: 0 1px 2px #000;
}
.rtr button {
  position: relative;
  background: none;
  border: 0;
  color: #fff;
  width: 28px;
  height: 100%;
  font-size: 17px;
  line-height: 1;
  text-shadow: 0 1px 2px #000;
}
.rtr button:hover {
  background: rgba(255, 255, 255, 0.12);
}
.stats {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 6px;
}
.stats div {
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 6px;
  text-align: center;
}
.stats b {
  display: block;
  font-family: var(--f-mono);
  font-size: 18px;
}
.stats span {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
}
details.more summary {
  cursor: pointer;
  font-size: 13px;
  color: var(--purple-hi);
}
.condrow {
  display: grid;
  grid-template-columns: 24px minmax(0, 1fr) auto;
  gap: 8px;
  align-items: center;
  background: var(--bg);
  border: 1px solid var(--line);
  border-left: 3px solid var(--red);
  border-radius: 6px;
  padding: 6px 6px 6px 10px;
}
.wcard {
  background: linear-gradient(180deg, #19151f, #120f16);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 8px 10px;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
}
.wcard.open {
  border-color: var(--purple);
}
.wcard .wh {
  display: grid;
  grid-template-columns: 48px minmax(0, 1fr) auto auto;
  gap: 8px;
  align-items: center;
}
.wcard .wi {
  color: #d8d2e0;
  width: 48px;
  height: 20px;
}
.wcard .wi svg {
  width: 48px;
  height: 20px;
}
.wcard .wn {
  background: none;
  border: 0;
  text-align: left;
  font-weight: 600;
  font-size: 16px;
  padding: 0;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.wcard .chev {
  background: none;
  border: 0;
  color: var(--muted);
  font-size: 16px;
  padding: 2px 4px;
}
.wst {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 14px;
  margin-top: 6px;
  font-size: 10.5px;
  letter-spacing: 0.06em;
  color: var(--muted);
}
.wst b {
  color: var(--fg);
  font-family: var(--f-mono);
  font-size: 12px;
  margin-left: 2px;
}
.rcard {
  --g1: #2a2730;
  --g2: #121014;
  border-radius: 8px;
  padding: 10px;
  color: #fff;
  background:
    radial-gradient(120% 140% at 0% 0%, rgba(255, 255, 255, 0.1), transparent 55%),
    linear-gradient(120deg, var(--g1), var(--g2));
  border: 1px solid rgba(255, 255, 255, 0.12);
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
}
.rcard.el-Sangue {
  --g1: #b3202e;
  --g2: #4e0a12;
}
.rcard.el-Morte {
  --g1: #2e2b33;
  --g2: #09080b;
}
.rcard.el-Energia {
  --g1: #7a2bc0;
  --g2: #2a0e4a;
}
.rcard.el-Conhecimento {
  --g1: #a07a22;
  --g2: #3a2a08;
}
.rcard.el-Medo {
  --g1: #d9d9e6;
  --g2: #7b7b92;
  color: #121016;
}
.rcard .rh {
  display: flex;
  gap: 10px;
  align-items: flex-start;
}
.rsig {
  width: 46px;
  height: 46px;
  flex: none;
  opacity: 0.95;
}
.rsig svg {
  width: 46px;
  height: 46px;
}
.rcard .rt {
  font-family: var(--f-display);
  font-size: 19px;
  line-height: 1.1;
}
.rcard .rc {
  display: inline-block;
  font-family: var(--f-body);
  font-size: 11px;
  font-weight: 700;
  background: rgba(0, 0, 0, 0.35);
  border-radius: 3px;
  padding: 0 5px;
  margin-right: 2px;
  vertical-align: 2px;
}
.rcard .rdsc {
  font-size: 12px;
  opacity: 0.8;
  margin-top: 2px;
}
.rcard .x {
  color: inherit;
  opacity: 0.7;
}
.rforms {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
  gap: 6px;
  margin-top: 8px;
}
.rform {
  background: rgba(0, 0, 0, 0.38);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 6px;
  padding: 7px 9px;
  text-align: left;
  color: #fff;
}
.rform:hover {
  background: rgba(0, 0, 0, 0.55);
  border-color: rgba(255, 255, 255, 0.35);
}
.rform b {
  display: block;
  font-family: var(--f-mono);
  font-size: 17px;
}
.rform span {
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  opacity: 0.75;
}
.board-top .chip {
  white-space: nowrap;
}
@media (min-width: 761px) {
  .board-top {
    flex-wrap: wrap;
  }
}

.per2 {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 30px 108px 46px 58px;
  gap: 6px;
  align-items: center;
  padding: 3px 0;
  border-bottom: 1px solid var(--line);
  font-size: 14px;
}
.per2 .a {
  font-family: var(--f-mono);
  font-size: 11px;
  color: var(--muted);
}
.per2 select {
  padding: 3px 4px;
  font-size: 12px;
}
.per2 input[type="number"] {
  padding: 3px 4px;
  font-size: 12px;
  text-align: center;
}
.per2 .only {
  font-size: 10px;
  color: var(--muted);
}
.per2.tr .pn {
  font-weight: 600;
  color: var(--purple-hi);
}
.per2:not(.tr) .pn {
  color: var(--muted);
}
@media (max-width: 420px) {
  .per2 {
    grid-template-columns: minmax(0, 1fr) 92px 40px 54px;
  }
  .per2 .a {
    display: none;
  }
}
.mbars {
  display: grid;
  gap: 3px;
}
.mbar {
  position: relative;
  height: 16px;
  border-radius: 3px;
  background: var(--bg);
  border: 1px solid var(--line);
  overflow: hidden;
}
.mbar i {
  position: absolute;
  inset: 0 auto 0 0;
}
.mbar.pv i {
  background: var(--red);
}
.mbar.san i {
  background: var(--purple);
}
.mbar.pe i {
  background: #a06a1c;
}
.mbar span {
  position: relative;
  display: block;
  font-family: var(--f-mono);
  font-size: 10.5px;
  line-height: 14px;
  padding-left: 6px;
  font-weight: 700;
  text-shadow: 0 1px 2px #000;
}
.tabs2[role="tablist"] {
  position: sticky;
  top: -14px;
  z-index: 2;
  background: var(--panel);
  padding-block: 6px;
}

/* ---------- mapa: camadas, ferramentas, tokens redondos ---------- */
.viewport .layer {
  position: absolute;
  left: 0;
  top: 0;
  pointer-events: none;
  max-width: none;
}
#ovL {
  overflow: visible;
}
#ovL .rt {
  fill: #fff;
  font: 600 14px var(--f-mono);
}
#ovL text {
  fill: #fff;
  font: 700 18px var(--f-body);
  paint-order: stroke;
  stroke: #000;
  stroke-width: 4px;
}
.ping .pr {
  stroke-width: 4;
  transform-box: fill-box;
  transform-origin: center;
  animation: pingR 1.2s ease-out 2;
}
.ping .pr.d2 {
  animation-delay: 0.4s;
}
@keyframes pingR {
  from {
    transform: scale(1);
    opacity: 1;
  }
  to {
    transform: scale(7);
    opacity: 0;
  }
}
@media (prefers-reduced-motion: reduce) {
  .ping .pr {
    animation: none;
  }
}
.board[data-mode]:not([data-mode="mover"]) #toks {
  pointer-events: none;
}
.board[data-mode="regua"],
.board[data-mode="ping"],
.board[data-mode="revelar"],
.board[data-mode="esconder"] {
  cursor: crosshair;
}
.board[data-mode="desenho"] {
  cursor: crosshair;
}
.board[data-mode="borracha"] {
  cursor: cell;
}

.mtb {

.swatches {

.swatches label {

}
.swatches input {

  inset: 0;

}
.swatches span {
  display: block;
  width: 28px;
  height: 28px;
  border-radius: 50%;

}
.swatches input:checked + span {

}
.swatches input:focus-visible + span {

}
.swatches.sm {

.tokr {
  border-radius: 50%;

  border-color: var(--c);

  overflow: hidden;

  place-items: center;
  box-shadow:
    0 0 0 2px rgba(0, 0, 0, 0.6),
    0 4px 10px rgba(0, 0, 0, 0.6);
  pointer-events: none;
}
.tokr img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: 50% 18%;
  filter: none !important;
}
.tokr.q {
  border-radius: 16%;
  background: #1e1d22;
}
.tok.vez .tokr {
  box-shadow:
    0 0 0 3px var(--red-hi),
    0 0 18px var(--red);
  animation: vezq 1.3s ease-in-out infinite;
}
@keyframes vezq {
  50% {
    box-shadow:

      0 0 6px var(--red);

}
.tokr b {
  font-family: var(--f-display);
  font-weight: 400;

}
.tok.sel .tokr {
  box-shadow:

}
.tok.dim {

}
.amedot {
  width: 44px;
  height: 44px;
  border-radius: 50%;

  font-size: 20px;
  color: var(--c);
  background: #120e18;
  flex: none;
}
.tokrow > img[style*="border-radius"] {
  object-fit: cover;
}
.crop {
  position: relative;
  width: 280px;
  height: auto;
  aspect-ratio: 1;
  max-width: 100%;
  align-self: center;
  background: #000;
  border-radius: 8px;
  overflow: hidden;
  touch-action: none;
}
.crop canvas {
  display: block;
  cursor: grab;
  width: 100%;
  height: 100%;
}
.crop.round::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  box-shadow: 0 0 0 999px rgba(0, 0, 0, 0.55);
  pointer-events: none;
}

.pc-open {

/* ===== criador de mapas ===== */
body.me-open {
  overflow: hidden;
}
.mapEd {
  position: fixed;
  inset: 0;
  z-index: 45;
  background: #020203;
  display: flex;
  flex-direction: column;
  color: var(--fg);
}
.me-top {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  border-bottom: 1px solid var(--line);
  background: var(--panel);
  flex-wrap: wrap;
}
.me-top #meNome {
  max-width: 260px;
  font-family: var(--f-display);
  font-size: 18px;
  background: transparent;
  border: 1px solid transparent;
}
.me-top #meNome:hover,
.me-top #meNome:focus {
  border-color: var(--line);
  background: var(--bg);
}
.me-top select {
  width: auto;
  max-width: 210px;
}
.me-gap {
  flex: 1;
}
.me-main {
  flex: 1;
  display: grid;
  grid-template-columns: 60px minmax(0, 1fr) 330px;
  min-height: 0;
}
.mapEd.noside .me-main {
  grid-template-columns: 60px minmax(0, 1fr) 0;
}
.mapEd.noside .me-side {
  display: none;
}
.me-tools {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 8px 6px;
  border-right: 1px solid var(--line);
  background: var(--panel);
  overflow-y: auto;
}
.me-tools .tool {
  width: 46px;
  height: 46px;
}
.me-stage {
  position: relative;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  touch-action: none;
}
.me-stage canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  cursor: crosshair;
}
.me-hint {
  position: absolute;
  left: 12px;
  top: 10px;
  right: 12px;
  pointer-events: none;
  font-size: 13px;
  color: #cfc8dc;
  text-shadow: 0 1px 3px #000;
}
.me-zoom {
  position: absolute;
  right: 12px;
  bottom: 12px;
  display: flex;
  gap: 6px;
}
.me-side {
  border-left: 1px solid var(--line);
  background: var(--panel);
  overflow-y: auto;
  padding: 12px;
}
.me-side .sub {
  margin: 4px 0 0;
}
.me-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 6px;
}
.me-grid.o {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}
.me-sw {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 5px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel2);
  color: var(--fg);
  font-size: 11px;
  line-height: 1.15;
  text-align: center;
  cursor: pointer;
  min-width: 0;
}
.me-sw img {
  width: 100%;
  aspect-ratio: 1;
  object-fit: contain;
  border-radius: 5px;
  background: #5b5e5d;
}
.me-grid.o .me-sw img {
  background: #47494b;
}
.me-grid.w .me-sw img {
  aspect-ratio: auto;
  height: 40px;
  object-fit: cover;
}
.me-sw span {
  overflow: hidden;
  text-overflow: ellipsis;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  width: 100%;
}
.me-sw:hover {
  border-color: var(--purple);
}
.me-sw.on {
  border-color: var(--purple-hi);
  box-shadow: 0 0 0 2px var(--purple) inset;
  background: var(--purple-soft);
}
.me-cats {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}
.me-cats .chip {
  font-size: 12px;
  padding: 4px 10px;
  cursor: pointer;
  color: var(--fg);
}
.me-cats .chip.on {
  border-color: var(--purple);
  background: var(--purple-soft);
}
.me-cur {
  display: grid;
  grid-template-columns: 64px minmax(0, 1fr);
  gap: 10px;
  align-items: center;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 8px;
  background: var(--panel2);
}
.me-cur img {
  width: 64px;
  height: 64px;
  border-radius: 6px;
  background: #47494b;
}
.me-cor {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: 2px solid var(--line);
  cursor: pointer;
}
.me-cor.on {
  border-color: #fff;
  box-shadow: 0 0 0 2px var(--purple);
}
.me-acts {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 6px;
}
.modal.wide {
  max-width: 980px;
}
.me-models {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 10px;
}
.me-model {
  display: flex;
  flex-direction: column;
  gap: 5px;
  text-align: left;
  padding: 8px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--panel2);
  color: var(--fg);
  cursor: pointer;
}
.me-model:hover {
  border-color: var(--purple);
}
.me-model canvas {
  width: 100%;
  height: auto;
  border-radius: 6px;
  background: #040405;
}
@media (max-width: 760px) {
  .me-main {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr) 42%;
  }
  .mapEd.noside .me-main {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr) 0;
  }
  .me-tools {
    flex-direction: row;
    border-right: 0;
    border-bottom: 1px solid var(--line);
    overflow-x: auto;
    padding: 6px;
  }
  .me-tools .tool .tip {
    display: none;
  }
  .me-side {
    border-left: 0;
    border-top: 1px solid var(--line);
  }
  .me-grid,
  .me-grid.o {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
  .me-top #meNome {
    max-width: 130px;
    font-size: 15px;
  }
  .me-hint {
    display: none;
  }
}
.nomes {
  pointer-events: none;
}
.nomes span {
  position: absolute;
  transform: translate(-50%, -50%);
  white-space: nowrap;
  line-height: 1;
  text-shadow:
    0 0 3px #000,
    0 0 3px #000,
    0 0 6px #000,
    1px 1px 0 #000,
    -1px -1px 0 #000,
    1px -1px 0 #000,
    -1px 1px 0 #000;
  transition: opacity 0.2s;
}
.nomes span.off {
  opacity: 0.35;
  font-style: italic;
}
/* ===== documentos ===== */
.docp {
  position: relative;
  margin: 0 auto;
  width: 100%;
  max-width: 640px;

  content: "";
