/* sprite em cache: o objeto desenhado com sombra, no tamanho da célula atual */
const MA_SPR = new Map();
function maSprite(o, v, s, seed) {
  const key = o.id + "|" + v + "|" + s + "|" + (seed % 7);
  let c = MA_SPR.get(key);
  if (c) return c;
  const W = Math.max(2, Math.round(o.w * s)),
    H = Math.max(2, Math.round(o.h * s)),
    pad = Math.round(s * 0.35);
  c = document.createElement("canvas");
  c.width = W + pad * 2;
  c.height = H + pad * 2;
  c.pad = pad;
  if (o.invis || !o.draw) {
    MA_SPR.set(key, c);
    return c;
  }
  const t = document.createElement("canvas");
  t.width = W + pad * 2;
  t.height = H + pad * 2;
  const tg = t.getContext("2d");
  tg.translate(pad, pad);
  MA_S = s;
  try {
    o.draw(tg, W, H, maRng(seed || 1), o.cores ? o.cores[(v || 0) % o.cores.length] : undefined);
  } catch (e) {
    console.error(o.id, e);
  }
  const g = c.getContext("2d");
  if (o.z > 0) {
    g.shadowColor = "rgba(0,0,0,.6)";
    g.shadowBlur = s * 0.18;
    g.shadowOffsetX = s * 0.05;
    g.shadowOffsetY = s * 0.08;
  }
  g.drawImage(t, 0, 0);
  if (MA_SPR.size > 600) MA_SPR.clear();
  MA_SPR.set(key, c);
  return c;
}
function maDrawObjs(g, M, s, zf, { editor = false, sel = null } = {}) {
  const list = (M.objs || [])
    .filter(o => MA_OBJ[o.t] && (zf === undefined || MA_OBJ[o.t].z === zf))
    .sort((a, b) => MA_OBJ[a.t].z - MA_OBJ[b.t].z || (a.n || 0) - (b.n || 0));
  for (const o of list) {
    const T = MA_OBJ[o.t];
    if (T.invis && !editor) continue;
    const e = o.e || 1;
    g.save();
    g.translate(o.x * s, o.y * s);
    g.rotate(((o.r || 0) * Math.PI) / 180);
    g.scale((o.f ? -1 : 1) * e, e);
    if (T.invis) {
      g.beginPath();
      g.arc(0, 0, s * 0.2, 0, 7);
      g.fillStyle = maA(T.luz.c, 0.85);
      g.fill();
      g.lineWidth = 2;
      g.strokeStyle = "#000";
      g.stroke();
      g.beginPath();
      g.arc(0, 0, (T.luz.r * s) / e, 0, 7);
      g.setLineDash([6, 6]);
      g.strokeStyle = maA(T.luz.c, 0.45);
      g.lineWidth = 1.5 / e;
      g.stroke();
      g.setLineDash([]);
    } else {
      const sp = maSprite(T, o.v || 0, s, o.seed || 1);
      g.drawImage(sp, (-T.w * s) / 2 - sp.pad, (-T.h * s) / 2 - sp.pad);
    }
    if (sel && sel.has(o.id)) {
      g.strokeStyle = "#b47dff";
      g.lineWidth = 2.5 / e;
      g.setLineDash([6 / e, 4 / e]);
      g.strokeRect((-T.w * s) / 2 - 3, (-T.h * s) / 2 - 3, T.w * s + 6, T.h * s + 6);
      g.setLineDash([]);
    }
    g.restore();
  }
}

/* textos (nomes de salas) */
function maDrawTexts(g, M, s) {
  for (const t of M.textos || []) {
    g.save();
    g.translate(t.x * s, t.y * s);
    g.rotate(((t.r || 0) * Math.PI) / 180);
    g.font = `${t.b ? "700 " : ""}${Math.round((t.tam || 0.5) * s)}px ${t.fonte === "serif" ? "'IM Fell English SC',serif" : "Inter,system-ui,sans-serif"}`;
    g.textAlign = "center";
    g.textBaseline = "middle";
    g.lineWidth = Math.max(2, (t.tam || 0.5) * s * 0.16);
    g.strokeStyle = "rgba(0,0,0,.85)";
    g.strokeText(t.t, 0, 0);
    g.fillStyle = t.cor || "#e9e4d8";
    g.fillText(t.t, 0, 0);
    g.restore();
  }
}

/* iluminação: escuridão do ambiente + luzes dos objetos */
const MA_AMB = {
  dia: { nome: "Claro (sem escuridão)", a: 0, c: "#000" },
  sombrio: { nome: "Sombrio (estilo base)", a: 0.5, c: "#05040a" },
  noite: { nome: "Noite", a: 0.68, c: "#050818" },
  escuro: { nome: "Escuridão total", a: 0.92, c: "#000" },
  sangue: { nome: "Névoa vermelha", a: 0.55, c: "#1a0206" }
};
function maDrawLight(g, M, s, { max = 1 } = {}) {
  const A = MA_AMB[M.amb || "sombrio"] || MA_AMB.sombrio;
  const W = M.w * s,
    H = M.h * s;
  const lights = (M.objs || [])
    .filter(o => MA_OBJ[o.t] && MA_OBJ[o.t].luz)
    .map(o => ({
      x: o.x * s,
      y: o.y * s,
      r: MA_OBJ[o.t].luz.r * s * (o.e || 1) * (o.lr || 1),
      c: o.lc || MA_OBJ[o.t].luz.c
    }));
  if (A.a > 0) {
    const d = document.createElement("canvas");
    d.width = W;
    d.height = H;
    const dg = d.getContext("2d");
    dg.fillStyle = maA(A.c, Math.min(max, A.a));
    dg.fillRect(0, 0, W, H);
    dg.globalCompositeOperation = "destination-out";
    for (const L of lights) {
      const gr = dg.createRadialGradient(L.x, L.y, 0, L.x, L.y, L.r);
      gr.addColorStop(0, "rgba(0,0,0,1)");
      gr.addColorStop(0.55, "rgba(0,0,0,.75)");
      gr.addColorStop(1, "rgba(0,0,0,0)");
      dg.fillStyle = gr;
      dg.beginPath();
      dg.arc(L.x, L.y, L.r, 0, 7);
      dg.fill();
    }
    g.drawImage(d, 0, 0);
  }
  g.save();
  g.globalCompositeOperation = "lighter";
  for (const L of lights) {
    const gr = g.createRadialGradient(L.x, L.y, 0, L.x, L.y, L.r);
    gr.addColorStop(0, maA(L.c, 0.22));
    gr.addColorStop(0.5, maA(L.c, 0.08));
    gr.addColorStop(1, maA(L.c, 0));
    g.fillStyle = gr;
    g.beginPath();
    g.arc(L.x, L.y, L.r, 0, 7);
    g.fill();
  }
  g.restore();
}

function meKey(e) {
  if (!$("#mapEd")) return;
  if (e.target.closest("input,textarea,select") && e.key !== "Escape") return;
  const k = e.key.toLowerCase();
  if ((e.ctrlKey || e.metaKey) && k === "z") {
    e.preventDefault();
    e.shiftKey ? meRedo() : meUndo();
    return;
  }
  if ((e.ctrlKey || e.metaKey) && k === "y") {
    e.preventDefault();
    meRedo();
    return;
  }
  if ((e.ctrlKey || e.metaKey) && k === "s") {
    e.preventDefault();
    meSalvar();
    return;
  }
  if ((e.ctrlKey || e.metaKey) && k === "d") {
    e.preventDefault();
    meSelAcao("dup");
    return;
  }
  if (e.key === " ") {
    ME.space = true;
    e.preventDefault();
    return;
  }
  if (k === "delete" || k === "backspace") {
    if (ME.sel.size) {
      e.preventDefault();
      meSelAcao("del");
    }
    return;
  }
  if (k === "r") {
    if (ME.tool === "obj") {
      ME.objR = (ME.objR + (e.shiftKey ? 45 : 90)) % 360;
      meDraw();
    } else if (ME.sel.size) meSelAcao(e.shiftKey ? "r45" : "r90");
    return;
  }
  if (k === "escape") {
    ME.sel.clear();
    meSide();
    meDraw();
    return;
  }
  const t = ME_TOOLS.find(x => x[2].toLowerCase() === k);
  if (t && !e.ctrlKey && !e.metaKey) meSetTool(t[0]);
}

async function meAbrir(M, id) {
  ME.M = JSON.parse(JSON.stringify(M));
  ME.M.objs = ME.M.objs || [];
  ME.M.textos = ME.M.textos || [];
  ME.M.paredes = ME.M.paredes || [];
  ME.id = id || "m" + rid(8);
  ME.undo = [];
  ME.redo = [];
  ME.dirty = !id;
  ME.sel = new Set();
  ME.side = window.innerWidth > 760;
  meSyncEdges();
  document.body.insertAdjacentHTML("beforeend", meHTML());
  document.body.classList.add("me-open");
  $("#meClose").onclick = meFechar;
  $("#meUndo").onclick = meUndo;
  $("#meRedo").onclick = meRedo;
  $("#meSave").onclick = meSalvar;
  $("#meCena").onclick = meUsarCena;
  $("#meMais").onclick = meConfig;
  $("#meNome").oninput = () => {
    ME.M.nome = $("#meNome").value;
    ME.dirty = true;
    meTopState();
  };
  $("#meAmb").onchange = () => {
    mePush();
    ME.M.amb = $("#meAmb").value;
    meLights();
    meDraw();
  };
  $("#meZm").onclick = () => {
    const r = $("#meStage").getBoundingClientRect();
    meZoomAt(1 / 1.25, r.width / 2, r.height / 2);
  };
  $("#meZp").onclick = () => {
    const r = $("#meStage").getBoundingClientRect();
    meZoomAt(1.25, r.width / 2, r.height / 2);
  };
  $("#meFit").onclick = meFit;
  $("#meSideT").onclick = () => {
    ME.side = !ME.side;
    $("#mapEd").classList.toggle("noside", !ME.side);
    setTimeout(meDraw, 30);
  };
  $$("#meTools [data-mt]").forEach(b => (b.onclick = () => meSetTool(b.dataset.mt)));
  document.addEventListener("keydown", meKey);
  document.addEventListener("keyup", meKeyUp);
  window.addEventListener("resize", meDraw);
  meBind();
  toast("Montando o mapa…");
  await new Promise(r => setTimeout(r, 30));
  meAll();
  meFit();
  meSetTool(ME.tool);
  meTopState();
}
async function meFechar() {
  if (ME.dirty) {
    const r = await formBox(
      "Fechar o mapa?",
      `<p style="margin:0">Há mudanças não salvas.</p><label class="check"><input type="checkbox" name="salvar" checked> Salvar antes de fechar</label>`,
      "Fechar"
    );
    if (!r) return;
    if (r.salvar) {
      if (!(await meSalvar())) return;
    }
  }
  document.removeEventListener("keydown", meKey);
  document.removeEventListener("keyup", meKeyUp);
  window.removeEventListener("resize", meDraw);
  const el = $("#mapEd");
  if (el) el.remove();
  document.body.classList.remove("me-open");
  ME.M = null;
  ME.fc = ME.wc = ME.lc = null;
  if (S.tool === "cenas") renderPanel();
}
async function meSalvar() {
  if (!S.isM) return false;
  meFlushEdges();
  const M = ME.M;
  const doc = { ...M, atualizado: Date.now() };
  try {
    await S.db.set(P() + "/mapas/" + ME.id, JSON.parse(JSON.stringify(doc)));
    ME.dirty = false;
    meTopState();
    toast("Mapa salvo.");
    return true;
  } catch (e) {
    fail(e);
    return false;
  }
}
async function meConfig() {
  const M = ME.M;
  const r = await formBox(
    "Configurar o mapa",
    `<div class="row" style="flex-wrap:nowrap"><div class="field" style="flex:1"><label class="label" for="mcW">Largura (quadrados)</label><input type="number" id="mcW" name="w" min="5" max="60" value="${M.w}"></div><div class="field" style="flex:1"><label class="label" for="mcH">Altura</label><input type="number" id="mcH" name="h" min="5" max="60" value="${M.h}"></div></div>
   <p class="muted small" style="margin:0">Aumentar acrescenta espaço à direita e embaixo. Diminuir corta desses lados.</p>
   <label class="check"><input type="checkbox" name="grade" ${M.grade !== false ? "checked" : ""}> Grade desenhada no mapa</label>
   <label class="check"><input type="checkbox" name="acab" ${M.acab !== false ? "checked" : ""}> Acabamento sombrio (grão e bordas escuras)</label>
   <label class="check"><input type="checkbox" name="luz" ${ME.luzPrev ? "checked" : ""}> Mostrar a iluminação enquanto edito</label>`,
    "Aplicar"
  );
  if (!r) return;
  const w = Math.max(5, Math.min(60, +r.w || M.w)),
    h = Math.max(5, Math.min(60, +r.h || M.h));
  mePush();
  if (w !== M.w || h !== M.h) {
    let ch = "";
    for (let y = 0; y < h; y++)
      for (let x = 0; x < w; x++) ch += x < M.w && y < M.h ? M.chao[y * M.w + x] : ".";
    M.chao = ch;
    M.w = w;
    M.h = h;
    for (const k of [...ME.edges.keys()]) {
      const [o, a, b] = k.split(",");
      const x = +a,
        y = +b;
      if (o === "h" ? x >= w || y > h : y >= h || x > w) ME.edges.delete(k);
    }
    M.objs = M.objs.filter(o => o.x <= w && o.y <= h);
    M.textos = M.textos.filter(t => t.x <= w && t.y <= h);
  }
  M.grade = !!r.grade;
  M.acab = !!r.acab;
  ME.luzPrev = !!r.luz;
  meAll();
  meFit();
  ocAjustarAoTamanho(); // locais escondidos que saíram do mapa (mapa/locais)
}

/* ---------- virar cena ---------- */
async function maImagem(M) {
  let E = Math.max(28, Math.min(72, Math.floor(2600 / Math.max(M.w, M.h))));
  const LIMIT = 880000;
  for (let tries = 0; tries < 6; tries++) {
    const c = maRender(M, E);
    for (const q of [0.86, 0.76, 0.66, 0.56]) {
      let url = c.toDataURL("image/webp", q);
      if (!url.startsWith("data:image/webp")) url = c.toDataURL("image/jpeg", q);
      if (url.length <= LIMIT) return { url, w: c.width, h: c.height, tam: E };
    }
    E = Math.floor(E * 0.85);
  }
  throw new Error("grande");
}
async function meUsarCena() {
  if (!S.isM) return;
  const jaTinhaCena = !!(ME.M && ME.M.cenaId);
  meFlushEdges();
  const M = ME.M;
  const btn = $("#meCena");
  btn.disabled = true;
  btn.textContent = "Desenhando…";
  try {
    await new Promise(r => setTimeout(r, 30));
    // as portas saem da imagem e viram peças que abrem e fecham na mesa (mapa/portas)
    const pm = portasDoMapa(M);
    const img = await maImagem({ ...M, paredes: pm.paredes, textos: [] });
    const nomes = (M.textos || []).map(t => ({
      t: t.t,
      x: Math.round(t.x * img.tam),
      y: Math.round(t.y * img.tam),
      s: Math.round((t.tam || 0.5) * img.tam),
      cor: t.cor || "#e9e4d8",
      fonte: t.fonte || "",
      ...(t.r ? { r: t.r } : {})
    }));
    const thumb = await thumbOf(img.url);
    let sid = M.cenaId && S.cenas.find(c => c.id === M.cenaId) ? M.cenaId : null;
    if (sid) {
      const old = S.cenas.find(c => c.id === sid);
      await S.db.set(P() + "/cenaImg/" + sid, { url: img.url });
      if (old && old.tam && old.tam !== img.tam) {
        const k = img.tam / old.tam;
        const pos = await S.db.get(P() + "/pos/" + sid);
        if (pos && pos.tokens) {
          for (const t of Object.values(pos.tokens)) {
            t.x *= k;
            t.y *= k;
          }
          await S.db.set(P() + "/pos/" + sid, pos);
        }
      }
      const portas = portasEmPixels(pm.lista, img.tam, old && old.portas);
      const hid = new Set(((old && old.nomes) || []).filter(n => n.h).map(n => n.t));
      nomes.forEach(n => {
        if (hid.has(n.t)) n.h = true;
      });
      await S.db.merge(P() + "/cenas/" + sid, {
        nome: M.nome,
        thumb,
        w: img.w,
        h: img.h,
        tam: img.tam,
        nomes,
        portas,
        ver: Date.now()
      });
      S.sceneImg[sid] = img.url;
      toast("Cena atualizada para todos.");
    } else {
      sid = "c" + rid(8);
      await S.db.set(P() + "/cenaImg/" + sid, { url: img.url });
      await S.db.set(P() + "/cenas/" + sid, {
        nome: M.nome || "Mapa",
        thumb,
        w: img.w,
        h: img.h,
        grade: false,
        encaixe: true,
        tam: img.tam,
        nomes,
        portas: portasEmPixels(pm.lista, img.tam),
        nomesOn: true,
        mapaId: ME.id,
        ver: Date.now(),
        criada: Date.now()
      });
      S.sceneImg[sid] = img.url;
      M.cenaId = sid;
      toast("Cena criada. Abra Cenas para exibir aos jogadores.");
    }
    await meSalvar();
    $("#meCena").textContent = "Atualizar a cena";
  } catch (e) {
    if (e && e.message === "grande") toast("O mapa ficou grande demais. Diminua o tamanho em Mapa…");
    else fail(e);
  } finally {
    const b = $("#meCena");
    if (b) {
      b.disabled = false;
      if (b.textContent === "Desenhando…") b.textContent = M.cenaId ? "Atualizar a cena" : "Usar como cena";
    }
  }
  await ocSalvarNaCena(jaTinhaCena); // locais escondidos viram locais da cena (mapa/locais)
}

function mapasLista() {

function bindMapas() {
  const el = $("#mapasBox");
  if (!el) return;
  el.addEventListener("click", e => {
    const b = e.target.closest("[data-mcopy]");
    if (b) copiarMapa(b.dataset.mcopy); // documentos/no-mapa
  });
  $("#btnCriarMapa").onclick = escolherModelo;
  el.addEventListener("click", async e => {
    const b = e.target.closest("[data-medit],[data-mdup],[data-mdel]");
    if (!b) return;
    const m = (S.mapas || []).find(x => x.id === (b.dataset.medit || b.dataset.mdup || b.dataset.mdel));
    if (!m) return;
    if (b.dataset.medit) {
      const { id, ...M } = m;
      meAbrir(M, id);
    }
    if (b.dataset.mdup) {
      const { id, cenaId, ...M } = m;
      M.nome = (M.nome || "Mapa") + " (cópia)";
      meAbrir(M);
    }
    if (b.dataset.mdel) {
      if (!(await confirmBox(`Apagar o mapa "${m.nome}"?`, "A cena feita com ele continua existindo.")))
        return;
      try {
        await S.db.del(P() + "/mapas/" + m.id);
        mapasHTMLload();
      } catch (er) {
        fail(er);
      }
    }
  });
  mapasHTMLload();
}
async function escolherModelo() {
  const h = $("#modalHost");
  const L = MA_MODELOS;
  h.innerHTML = `<div class="modal-back"><div class="modal wide" role="dialog" aria-label="Novo mapa"><h3>Novo mapa</h3>
   <div class="me-models">${L.map((m, i) => `<button class="me-model" data-mod="${i}"><canvas width="440" height="280" data-mprev="${i}"></canvas><b>${esc(m.nome)}</b><span class="muted small">${esc(m.desc)}</span></button>`).join("")}</div>
   <div class="row" style="justify-content:flex-end"><button class="btn" id="mmNo">Cancelar</button></div></div></div>`;
  $("#mmNo").onclick = () => (h.innerHTML = "");
  $$("[data-mod]").forEach(
    b =>
      (b.onclick = async () => {
        const m = L[+b.dataset.mod];
        h.innerHTML = "";
        let M;
        if (m.vazio) {
          const r = await formBox(
            "Mapa em branco",
            `<div class="row" style="flex-wrap:nowrap"><div class="field" style="flex:1"><label class="label" for="nbW">Largura</label><input type="number" id="nbW" name="w" min="5" max="60" value="24"></div><div class="field" style="flex:1"><label class="label" for="nbH">Altura</label><input type="number" id="nbH" name="h" min="5" max="60" value="16"></div></div>
      <div class="field"><label class="label" for="nbP">Começar com o chão</label><select id="nbP" name="p">${MA_PISOS.map(p => `<option value="${esc(p[0])}">${esc(p[2])}</option>`).join("")}</select></div>`,
            "Criar"
          );
          if (!r) return;
          M = meNovo(
            Math.max(5, Math.min(60, +r.w || 24)),
            Math.max(5, Math.min(60, +r.h || 16)),
            r.p || "."
          );
        } else M = m.fn();
        M.nome = m.vazio ? "Novo mapa" : m.nome;
        meAbrir(M);
      })
  );
  // prévias pequenas
  setTimeout(() => {
    $$("[data-mprev]").forEach(c => {
      const m = L[+c.dataset.mprev];
      const g = c.getContext("2d");
      g.fillStyle = "#040405";
      g.fillRect(0, 0, c.width, c.height);
      if (m.vazio) {
        g.strokeStyle = "#3a3046";
        g.setLineDash([6, 6]);
        g.strokeRect(40, 40, 360, 200);
        g.fillStyle = "#8a809a";
        g.font = "28px Inter,sans-serif";
        g.textAlign = "center";
        g.fillText("Do zero", 220, 150);
        return;
      }
      if (!m._prev) {
        const M = m.fn();
        const s = Math.max(4, Math.floor(Math.min(440 / M.w, 280 / M.h)));

      }

/* Criador de mapas: mapas prontos. */
/* =====================================================================
   CRIADOR DE MAPAS — MAPAS PRONTOS (todos originais)
   ===================================================================== */
function mbNovo(w, h, piso = ".") {
  const M = meNovo(w, h, piso);
  const E = new Map();
  let n = 1;
  const B = {
    M,
    E,
    set(x, y, k) {
      if (x < 0 || y < 0 || x >= M.w || y >= M.h) return;
      const i = y * M.w + x;
      M.chao = M.chao.slice(0, i) + k + M.chao.slice(i + 1);
    },
    fill(x0, y0, x1, y1, k) {
      const a = M.chao.split("");
      for (let y = Math.max(0, y0); y <= Math.min(M.h - 1, y1); y++)
        for (let x = Math.max(0, x0); x <= Math.min(M.w - 1, x1); x++) a[y * M.w + x] = k;
      M.chao = a.join("");
    },
    edge(k, v) {
      const c = E.get(k);
      if (c && c.startsWith("a:")) return;
      E.set(k, v);
    },
    room(x0, y0, x1, y1, k, st = "ordem") {
      B.fill(x0, y0, x1, y1, k);
      for (let x = x0; x <= x1; x++) {
        B.edge(`h,${x},${y0}`, st);
        B.edge(`h,${x},${y1 + 1}`, st);
      }
      for (let y = y0; y <= y1; y++) {
        B.edge(`v,${x0},${y}`, st);
        B.edge(`v,${x1 + 1},${y}`, st);
      }
    },
    wall(o, x, y, len, st = "ordem") {
      for (let i = 0; i < len; i++) B.edge(o === "h" ? `h,${x + i},${y}` : `v,${x},${y + i}`, st);
    },
    door(o, x, y, t = "porta") {
      const k = `${o},${x},${y}`;
      const c = E.get(k);
      const st = c ? (c.startsWith("a:") ? c.split(":")[2] : c) : "ordem";
      E.set(k, `a:${t}:${st}`);
    },
    open(o, x, y) {
      E.delete(`${o},${x},${y}`);
    },
    obj(t, x, y, o = {}) {
      M.objs.push({
        id: "o" + n++,
        t,
        x,
        y,
        r: o.r || 0,
        v: o.v || 0,
        e: o.e || 1,
        seed: o.seed || n * 7 + 3,
        n: n,
        ...(o.lr ? { lr: o.lr } : {}),
        ...(o.f ? { f: true } : {})
      });
    },
    txt(t, x, y, o = {}) {
      M.textos.push({ id: "t" + n++, t, x, y, tam: o.tam || 0.42, cor: o.cor || "#d8d2c4", fonte: "serif" });
    },
    done() {
      M.paredes = [...E].map(([k, v]) => k + "," + v);
      M.nx = n + 1;
      return M;
    }
  };
  return B;
}

function mbFloresta() {
  const B = mbNovo(30, 22, "F");
  const R = maRng(17);
  for (let i = 0; i < 14; i++) {
    const x = Math.floor(R() * 30),
      y = Math.floor(R() * 22),
      r = 1.5 + R() * 2.5,
      k = R() < 0.7 ? "G" : "H";
    for (let yy = Math.floor(y - r); yy <= y + r; yy++)
      for (let xx = Math.floor(x - r); xx <= x + r; xx++)
        if (Math.hypot(xx - x, yy - y) <= r) B.set(xx, yy, k);
  }
  const trilha = [];
  for (let x = 0; x < 30; x++) {
    const y = Math.round(11 + Math.sin(x / 4) * 3);
    trilha.push([x, y]);
    B.fill(x, y, x, y + 1, "T");
  }
  B.fill(12, 8, 18, 14, "T");
  B.fill(13, 9, 17, 13, "H");
  B.fill(24, 2, 28, 5, "Q");
  B.fill(25, 3, 27, 4, "W");
  const livre = (x, y) =>
    !(x > 10 && x < 20 && y > 6 && y < 16) &&
    !trilha.some(([a, b]) => Math.abs(a - x) < 2 && Math.abs(b - y) < 3) &&
    !(x > 22 && y < 7);
  let n = 0;
  for (let i = 0; i < 400 && n < 34; i++) {
    const x = 1 + R() * 28,
      y = 1 + R() * 20;
    if (!livre(x, y)) continue;
    n++;
    const t = R();
    B.obj(t < 0.15 ? "morta" : t < 0.45 ? "pinheiro" : t < 0.6 ? "arvoreg" : "arvore", x, y, {
      v: Math.floor(R() * 3)
    });
  }
  for (let i = 0; i < 14; i++) {
    const x = 1 + R() * 28,
      y = 1 + R() * 20;
    if (livre(x, y))
      B.obj(R() < 0.5 ? "arbusto" : R() < 0.5 ? "pedra" : "juncos", x, y, { v: Math.floor(R() * 3) });

  B.obj("fogueira", 15, 11);

const TJ_MAO = ["rabisco", "rasgado", "sangue", "borrado", "queimado"];
// o primeiro de cada lista é o estilo padrão daquele modelo
const DOC_TARJAS = {
  relatorio: TJ_OFICIAL,
  policial: TJ_OFICIAL,
  laudo: TJ_OFICIAL,
  simples: ["censura", "rabisco", "corretivo", "rasgado", "sangue", "queimado", "borrado"],
  carta: TJ_MAO,
  diario: TJ_MAO,
  foto: TJ_MAO,
  bilhete: ["rasgado", "rabisco", "sangue", "borrado", "queimado"],
  jornal: ["rasgado", "censura", "borrado", "sangue", "queimado"],
  cartaz: ["rasgado", "rabisco", "borrado", "sangue", "queimado"],
  amaldicoado: ["simbolos", "sangue", "queimado"],
  celular: ["apagada", "pixel", "corrompido"],
  email: ["corrompido", "censura", "pixel"],
  audio: ["estatica", "corrompido"]
};
function tarjaEstilo(modelo, e) {
  const L = DOC_TARJAS[modelo] || DOC_TARJAS.simples;
  return L.includes(e) ? e : L[0];
}
// letras para as tarjas "corrompido" e "símbolos" (sempre as mesmas para o mesmo trecho)
function tarjaLetras(e, n, i) {
  const A = e === "simbolos" ? "ᚠᚢᚦᚨᚱᚲᚷᚹᚺᚾᛁᛃᛇᛈᛉᛊᛏᛒᛖᛗᛚᛜᛞᛟ" : "▓▒░#%&@$¤§¶╳";
  const R = maRng(n * 31 + i * 7 + 3);
  let t = "";
  for (let k = 0; k < Math.max(3, Math.min(40, n)); k++) t += A[Math.floor(R() * A.length)];
  return t;
}

/* ---------- texto com trechos escondidos ---------- */
function docPartesDe(texto) {
  const out = [];
  const re = /\[\[([\s\S]*?)\]\]/g;
  let i = 0,
    m;
  while ((m = re.exec(texto || ""))) {
    if (m.index > i) out.push({ t: texto.slice(i, m.index) });
    const em = m[1].match(/^([a-z]+):([\s\S]*)$/);
    if (em && TARJA_ESTILOS[em[1]]) out.push({ t: em[2], h: true, e: em[1] });
    else out.push({ t: m[1], h: true });
    i = re.lastIndex;
  }
  if (i < (texto || "").length) out.push({ t: texto.slice(i) });
  return out;
}
// versão que vai para o jogador: os trechos escondidos não levam o texto, só o tamanho
function docPartesEnvio(texto, revelados = []) {
  let k = 0;
  return docPartesDe(texto).map(p => {
    if (!p.h) return { t: p.t };
    const i = k++;
    return revelados.includes(i) ? { t: p.t, r: 1 } : { h: 1, n: p.t.length, i, ...(p.e ? { e: p.e } : {}) };
  });
}
function docFmt(s) {
  return esc(s)
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
    .replace(/\n/g, "<br>");
}
function docTextoHTML(partes, mestre, modelo) {
  let k = 0;
  return partes
    .map(p => {
      if (p.h && p.t !== undefined && mestre) {
        const i = k++;
        const e = tarjaEstilo(modelo, p.e);
        return `<mark class="dh" title="Trecho escondido nº ${i + 1} · ${esc(TARJA_ESTILOS[e])}">${docFmt(p.t)}<sup class="tjl">${esc(TARJA_ESTILOS[e])}</sup></mark>`;
      }
      if (p.h) {
        const i = k++;
        const e = tarjaEstilo(modelo, p.e);
        const n = Math.max(3, Math.min(400, p.n || (p.t || "").length));
        if (e === "apagada") return `<span class="tj t-apagada">⊘ mensagem apagada</span>`;
        if (e === "estatica")
          return `<span class="tj t-estatica" style="min-width:${Math.min(16, n * 0.35)}em">inaudível</span>`;
        if (e === "corrompido" || e === "simbolos")
          return `<span class="tj t-${e}">${tarjaLetras(e, n, i)}</span>`;
        const bar = w =>
          `<span class="redact t-${e}" style="width:${Math.min(30, w * 0.52)}em">&nbsp;</span>`;
        return bar(n) + (n > 58 ? bar(n - 58) : "");
      }
      return p.r ? `<span class="revealed">${docFmt(p.t)}</span>` : docFmt(p.t);
    })
    .join("");
}
function docLinhas(partes) {
  // para o celular: separa as partes em linhas (uma mensagem por linha), sem perder as tarjas
  const out = [[]];
  partes.forEach(p => {
    if (p.h) {
      out[out.length - 1].push(p);
      return;
    }
    (p.t || "").split("\n").forEach((t, j) => {
      if (j > 0) out.push([]);
      if (t) out[out.length - 1].push({ ...p, t });
    });
  });
  return out.filter(l => l.some(p => p.h || (p.t || "").trim()));
}

    partes: docPartesEnvio(d.texto, d.revelados || []),
    ...(d.img ? { img: d.img } : {}),
    ...(d.audio ? { audio: d.audio } : {}),
    titulo: d.titulo || "",
    nome: docNome(d)
  };
}
async function docEnviar(d, para) {
  const doc = docSnapshot(d);
  const body = {
    autor: S.uid,
    quem: "Mestre",
    para,
    paraNome: para === "todos" ? "todos" : nomeMembro(para),
    tipo: "doc",
    titulo: String(docNome(d)).slice(0, 200),
    det: "",
    ts: Date.now(),
    docId: d.id || null,
    doc
  };
  try {
    await S.db.add(P() + "/privado", body);
    toast("Documento entregue.");
  } catch (e) {
    fail(e);
  }
}
async function docRevelar(d) {
  const hs = docPartesDe(d.texto).filter(p => p.h);
  const rev = new Set(d.revelados || []);
  const r = await formBox(
    "Revelar trechos",
    `<p class="muted small" style="margin:0">Marque o que os jogadores passam a ler. Vale para todas as cópias já entregues deste documento.</p>
   ${hs.map((p, i) => `<label class="check"><input type="checkbox" name="r${i}" ${rev.has(i) ? "checked" : ""}> <span>${esc(p.t.length > 90 ? p.t.slice(0, 90) + "…" : p.t)}</span></label>`).join("")}`,
    "Revelar"
  );
  if (!r) return;
  const novos = hs.map((p, i) => (r["r" + i] ? i : -1)).filter(i => i >= 0);
  try {
    await S.db.merge(P() + "/docs/" + d.id, { revelados: novos });
    const partes = docPartesEnvio(d.texto, novos);
    for (const x of (S.priv || []).filter(y => y.docId === d.id && y.autor === S.uid))
      await S.db.merge(P() + "/privado/" + x.id, { doc: { ...x.doc, partes }, rev: (x.rev || 0) + 1 });
    for (const m of (S.mapDocs || []).filter(y => y.docId === d.id))
      await S.db.merge(P() + "/estado/" + m.id, { doc: { ...m.doc, partes }, rev: (m.rev || 0) + 1 });
    const mural = S.mural || (await S.db.getCol(P() + "/mural"));
    for (const m of mural.filter(y => y.tipo === "doc" && y.docId === d.id))
      await S.db.merge(P() + "/mural/" + m.id, { doc: { ...m.doc, partes } });
    toast(novos.length > (d.revelados || []).length ? "Trechos revelados para os jogadores." : "Pronto.");
  } catch (e) {
    fail(e);
  }
}

/* ---------- leitura ---------- */
function abrirDoc(e) {
  const h = $("#modalHost");
  const d = e.doc || { modelo: "simples", titulo: e.titulo, partes: [{ t: e.det || "" }], img: e.img };
  h.innerHTML = `<div class="modal-back docback"><div class="docview" role="dialog" aria-label="${esc(e.titulo)}">
   <div class="row between" style="margin-bottom:10px"><span class="label">${(e.quem || "Mestre") === "Mestre" ? "Documento do mestre" : "Documento de " + esc(e.quem)}${e.para === "todos" ? "" : " · só para você"}</span><button class="btn sm" id="dOk">Fechar</button></div>
   ${docHtml({ ...d, titulo: d.titulo || e.titulo })}</div></div>`;
  $("#dOk").onclick = () => {
    h.innerHTML = "";
    S.docAberto = null;
  };
  h.querySelector(".modal-back").onclick = ev => {
    if (ev.target.classList.contains("modal-back")) {
      h.innerHTML = "";
      S.docAberto = null;
    }
  };
  S.docAberto = e.id;
  docLeituraExtras(e); // anotações e mural (documentos/mural-notas)
}

/* ---------- editor ---------- */
async function docEditor(d0) {
  if (!S.isM) return;
  const d = JSON.parse(
    JSON.stringify(
      d0 || {
        modelo: "relatorio",
        titulo: "",
        campos: {},
        texto: "",
        idade: 1,
        sangue: false,
        queimado: false
      }
    )
  );
  DOC_MODELOS.forEach(m =>
    m.campos.forEach(([k, , def]) => {
      if (d.modelo === m.id && d.campos[k] === undefined && def) d.campos[k] = def;
    })
  );
  document.body.insertAdjacentHTML(
    "beforeend",
    `<div class="docEd" id="docEd"><div class="me-top"><button class="btn sm ghost" id="deX">✕ Fechar</button><b style="font-family:var(--f-display);font-size:18px">${d0 ? "Editar documento" : "Novo documento"}</b><span class="me-gap"></span><button class="btn sm" id="deSalvar">Salvar na biblioteca</button><button class="btn sm primary" id="deEnviar">Salvar e entregar…</button></div>
   <div class="de-main"><form class="de-form" id="deForm" onsubmit="return false"></form><div class="de-prev" id="dePrev"></div></div></div>`
  );
  document.body.classList.add("me-open");
  const form = $("#deForm"),
    prev = $("#dePrev");
  const draw = () => {
    prev.innerHTML = docHtml(d, { mestre: true });
  };
  const build = () => {
    const M = DOC_MOD[d.modelo];
    form.innerHTML = `<div class="sub" style="margin:0">Modelo</div><div class="de-mods">${DOC_MODELOS.map(m => `<button type="button" class="de-mod ${d.modelo === m.id ? "on" : ""}" data-dm="${m.id}"><span class="docico m-${m.id}"></span><b>${esc(m.nome)}</b></button>`).join("")}</div>
     <p class="muted small" style="margin:0">${esc(M.desc)}</p>
     <div class="field"><label class="label" for="deT">${M.id === "carta" || M.id === "bilhete" || M.id === "diario" ? "Primeira linha (opcional)" : "Título"}</label><input type="text" id="deT" maxlength="120" value="${esc(d.titulo || "")}" placeholder="${M.id === "jornal" ? "Manchete" : M.id === "carta" ? "Querida Ana," : ""}"></div>
     ${M.campos.map(([k, n, def]) => `<div class="field"><label class="label" for="dc_${k}">${esc(n)}</label><input type="text" id="dc_${k}" data-ck="${k}" maxlength="120" value="${esc(d.campos[k] ?? "")}" placeholder="${esc(def)}"></div>`).join("")}
     <div class="field"><div class="row between"><label class="label" for="deTx">Texto</label><span class="row" style="gap:4px"><select id="deTj" aria-label="Estilo da tarja" title="Estilo da tarja">${(DOC_TARJAS[M.id] || DOC_TARJAS.simples).map(e => `<option value="${e}">${esc(TARJA_ESTILOS[e])}</option>`).join("")}</select><button type="button" class="btn sm" id="deHide" title="Escolha um trecho do texto e toque aqui">Tarjar trecho</button><button type="button" class="btn sm" id="deBold"><b>N</b></button></span></div>
      <textarea id="deTx" rows="12" maxlength="6000" placeholder="${M.id === "celular" ? "Ana: você viu aquilo?\nEu: vi. não conta pra ninguém\nAna: [[eles estão no porão]]" : "Escreva aqui. Use [[ e ]] em volta do que deve chegar tarjado."}">${esc(d.texto || "")}</textarea></div>
     ${
       M.id === "audio"
         ? `<div class="row">${S.gravando ? `<button type="button" class="btn sm danger" id="deRecStop">■ Parar a gravação</button>` : `<button type="button" class="btn sm primary" id="deRec">● Gravar pelo microfone</button>`}<button type="button" class="btn sm" id="deAudF">Subir arquivo</button><button type="button" class="btn sm" id="deAudL">Colar link</button>${d.audio ? `<button type="button" class="btn sm ghost" id="deAudX">Tirar áudio</button>` : ""}</div>
     <p class="muted small" style="margin:0">Gravação de até 90 segundos. Arquivo de até 500 KB (um MP3 curto); para um áudio maior, suba no GitHub e cole o link.</p>`
         : ""
     }
     ${M.img || d.img ? `<div class="row"><button type="button" class="btn sm" id="deImg">${d.img ? (d.modelo === "foto" ? "Trocar a foto" : "Trocar imagem") : d.modelo === "foto" ? "Subir a foto" : "Pôr uma imagem"}</button>${d.img ? `<button type="button" class="btn sm ghost" id="deImgX">Tirar imagem</button>` : ""}</div>` : ""}
     <div class="sub" style="margin:0">Aparência</div>
     <div class="row" style="flex-wrap:nowrap"><label class="label" for="deI" style="white-space:nowrap;margin:0">Papel</label><select id="deI">${["Novo", "Usado", "Velho e manchado"].map((n, i) => `<option value="${i}" ${(+d.idade || 0) === i ? "selected" : ""}>${n}</option>`).join("")}</select></div>
     <label class="check"><input type="checkbox" id="deS" ${d.sangue ? "checked" : ""}> Manchas de sangue</label><label class="check"><input type="checkbox" id="deQ" ${d.queimado ? "checked" : ""}> Bordas queimadas</label>`;
    $$("[data-dm]", form).forEach(
      b =>
        (b.onclick = () => {
          d.modelo = b.dataset.dm;
          DOC_MOD[d.modelo].campos.forEach(([k, , def]) => {
            if (!d.campos[k] && def) d.campos[k] = def;
          });
          build();
          draw();
        })
    );
    $("#deT").oninput = e => {
      d.titulo = e.target.value;
      draw();
    };
    $$("[data-ck]", form).forEach(
      i =>
        (i.oninput = () => {
          d.campos[i.dataset.ck] = i.value;
          draw();
        })
    );
    const tx = $("#deTx");
    tx.oninput = () => {
      d.texto = tx.value;
      draw();
    };
    const wrap = (a, b) => {
      const s = tx.selectionStart,
        e = tx.selectionEnd;
      if (s === e) {
        toast("Escolha (selecione) um trecho do texto primeiro.");
        return;
      }
      tx.value = tx.value.slice(0, s) + a + tx.value.slice(s, e) + b + tx.value.slice(e);
      d.texto = tx.value;
      draw();
      tx.focus();
    };
    $("#deHide").onclick = () => {
      const e = $("#deTj").value;
      wrap(e === (DOC_TARJAS[M.id] || DOC_TARJAS.simples)[0] ? "[[" : "[[" + e + ":", "]]");
    };
    const aud = url => {
      d.audio = url;
      build();
      draw();
    };
    const rec = $("#deRec");
    if (rec)
      rec.onclick = async () => {
        try {
          const st = await navigator.mediaDevices.getUserMedia({ audio: true });
          const tipo = ["audio/webm;codecs=opus", "audio/mp4", "audio/ogg;codecs=opus"].find(
            t => window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)
          );
          const mr = new MediaRecorder(st, {
            ...(tipo ? { mimeType: tipo } : {}),
            audioBitsPerSecond: 24000
          });
          const pedacos = [];
          mr.ondataavailable = ev => ev.data.size && pedacos.push(ev.data);
          mr.onstop = () => {
            st.getTracks().forEach(t => t.stop());
            S.gravando = null;
            const fr = new FileReader();
            fr.onload = () => {
              if (fr.result.length > 700000) {
                toast("A gravação ficou grande demais. Grave um trecho mais curto.");
                build();
                return;
              }
              aud(fr.result);
            };
            fr.readAsDataURL(new Blob(pedacos, { type: mr.mimeType || tipo || "audio/webm" }));
          };
          mr.start();
          S.gravando = { mr, fim: setTimeout(() => mr.state === "recording" && mr.stop(), 90000) };
          build();
        } catch (e) {
          toast("Não consegui usar o microfone. Libere o acesso ao microfone no navegador.");
        }
      };
    const recStop = $("#deRecStop");
    if (recStop)
      recStop.onclick = () => {
        if (!S.gravando) return;
        clearTimeout(S.gravando.fim);
        S.gravando.mr.stop();
      };
    const audF = $("#deAudF");
    if (audF)
      audF.onclick = () => {
        const inp = document.createElement("input");
        inp.type = "file";
        inp.accept = "audio/*";
        inp.onchange = () => {
          const f = inp.files && inp.files[0];
          if (!f) return;
          if (f.size > 500000) {
            toast("Arquivo grande (máximo 500 KB). Grave pelo microfone ou suba no GitHub e cole o link.");
            return;
          }
          const fr = new FileReader();
          fr.onload = () => aud(fr.result);
          fr.readAsDataURL(f);
        };
        inp.click();
      };
    const audL = $("#deAudL");
    if (audL)
      audL.onclick = async () => {
        const r = await formBox(
          "Link do áudio",
          `<div class="field"><label class="label" for="daL">Link direto de um MP3 ou OGG</label><input type="url" id="daL" name="url" placeholder="https://..." required></div>`,
          "Usar"
        );
        if (!r) return;
        if (!/^https:\/\//.test(r.url.trim())) {
          toast("Use um link que comece com https://");
          return;
        }
        aud(r.url.trim());
      };
    const audX = $("#deAudX");
    if (audX)
      audX.onclick = () => {
        delete d.audio;
        build();
        draw();
      };
    $("#deBold").onclick = () => wrap("**", "**");
    const im = $("#deImg");
    if (im)
      im.onclick = async () => {
        const f = await pickImage();
        if (!f) return;
        try {
          d.img = (await compressScene(f)).url;
          if (d.img.length > 600000) {
            toast("Imagem grande: diminuí a qualidade.");
          }
          build();
          draw();
        } catch (e) {
          toast("Não consegui usar essa imagem.");
        }
      };
    const ix = $("#deImgX");
    if (ix)
      ix.onclick = () => {
        delete d.img;
        build();
        draw();
      };
    $("#deI").onchange = e => {
      d.idade = +e.target.value;
      draw();
    };
    $("#deS").onchange = e => {
      d.sangue = e.target.checked;
      draw();
    };
    $("#deQ").onchange = e => {
      d.queimado = e.target.checked;
      draw();
    };
  };
  build();
  draw();
  const fechar = () => {
    if (S.gravando) {
      clearTimeout(S.gravando.fim);
      S.gravando.mr.onstop = null;
      S.gravando.mr.stop();
      S.gravando.mr.stream.getTracks().forEach(t => t.stop());
      S.gravando = null;
    }
    const el = $("#docEd");
    if (el) el.remove();
    document.body.classList.remove("me-open");
  };
  const salvar = async () => {
    if (d.modelo === "foto" && !d.img) {
      toast("Suba a imagem da foto primeiro.");
      return null;
    }
    const { id, ...dados } = d;
    dados.criado = dados.criado || Date.now();
    dados.atualizado = Date.now();
    // se mudou o texto, os trechos revelados podem não bater mais: mantém só os que ainda existem
    const nh = docPartesDe(dados.texto).filter(p => p.h).length;
    dados.revelados = (dados.revelados || []).filter(i => i < nh);
    try {
      if (id) {
        await S.db.set(P() + "/docs/" + id, dados);
        return { id, ...dados };
      }
      const nid = await S.db.add(P() + "/docs", dados);
      return { id: nid, ...dados };
    } catch (e) {
      fail(e);
      return null;
    }
  };
  $("#deX").onclick = async () => {
    if (
      JSON.stringify(d) !==
        JSON.stringify(
          d0 || {
            modelo: "relatorio",
            titulo: "",
            campos: {},
            texto: "",
            idade: 1,
            sangue: false,
            queimado: false
          }
        ) &&
      !(await confirmBox("Fechar sem salvar?", "O que você escreveu aqui se perde.", "Fechar"))
    )
      return;
    fechar();
  };
  $("#deSalvar").onclick = async () => {
    const s = await salvar();
    if (s) {
      toast("Documento guardado na biblioteca.");
      fechar();
    }
  };
  $("#deEnviar").onclick = async () => {
    const s = await salvar();
    if (!s) return;
    fechar();
    docEntregar(s);
  };
}

/* Ficha rápida: PV, PE, SAN e Defesa são os números que o mestre digitou. */
function ajustarNpcRapido(f, D) {
  if (!f || !f.rapido) return;
  D.pvMax = Math.max(1, +f.rpv || 1);
  D.peMax = Math.max(0, +f.rpe || 0);
  D.sanMax = Math.max(0, +f.rsan || 0);
  D.def = (+f.rdef || 10) - (f.cond || []).reduce((m, c) => Math.max(m, DEF_COND[c] || 0), 0);
}

function npcDeModelo(mid) {
  const m = NPC_MODELOS.find(x => x.id === mid) || NPC_MODELOS[0];
  const f = novaFicha();
  Object.assign(f, {
    npc: true,
    visivel: false,
    dono: S.uid,
    rapido: true,
    nome: m.id === "branco" ? "Novo NPC" : m.nome,
    rtipo: m.tipo,
    rpv: m.pv,
    pv: m.pv,
    rdef: m.def,
    rdesl: m.desl,
    rpe: m.pe || 0,
    rsan: m.san || 0,
    attr: { ...m.attr },
    rper: m.per.map(([n, a, b]) => ({ n, a, b })),
    ratq: m.atq.map(([n, a, b, d, c]) => ({ n, a, b, d, c })),
    rnotas: m.notas
  });
  if (f.rpe) f.pe = f.rpe;
  if (f.rsan) f.san = f.rsan;
  return f;
}
function npcPastas() {
  return [
    ...new Set(
      Object.values(S.fichas)
        .filter(f => f.npc && f.pasta)

  ].sort();
}

  const r = await formBox(
    "Criar NPC",

      f = novaFicha();
      Object.assign(f, { npc: true, visivel: false, dono: S.uid, nome: "Novo NPC" });

    if (r.nome.trim()) f.nome = r.nome.trim();
    if (q > 1) f.nome += " " + (i + 1);
    if (r.pasta.trim()) f.pasta = r.pasta.trim();

    S.openFicha = first;
    S.sheetTab = "principal";
  }
  renderPanel();

async function npcDuplicar(id) {
  const f0 = S.fichas[id];
  if (!f0) return;
  const r = await formBox(
    `Duplicar ${f0.nome}`,
    `<div class="field"><label class="label" for="ndQ">Quantas cópias</label><input type="number" id="ndQ" name="qtd" min="1" max="12" value="1"></div>
   <label class="check"><input type="checkbox" name="cheia" checked> Cópias com a vida cheia</label>`,
    "Duplicar"
  );
  if (!r) return;
  const q = Math.max(1, Math.min(12, +r.qtd || 1));
  const base = f0.nome.replace(/\s+\d+$/, "");
  const usados = Object.values(S.fichas)
    .filter(f => f.npc && f.nome.replace(/\s+\d+$/, "") === base)
    .map(f => +(f.nome.match(/(\d+)$/) || [0, 1])[1]);
  let n = Math.max(1, ...usados);
  if (!/\d+$/.test(f0.nome)) {
    f0.nome = base + " 1";
    saveFicha(id, true);
  }
  for (let i = 0; i < q; i++) {
    const nid = "n" + rid(8);
    const f = JSON.parse(JSON.stringify(f0));
    f.nome = base + " " + ++n;
    f.criada = Date.now() + i;
    if (r.cheia) {
      delete f.pv;
      delete f.pe;
      delete f.san;
      f.morrendo = 0;
      f.cond = [];
    }
    S.fichas[nid] = f;
    saveFicha(nid, true);
    await new Promise(z => setTimeout(z, 20));
  }
  renderPanel();
  toast(q > 1 ? `${q} cópias criadas.` : "Cópia criada.");
}

function npcRolar(f, titulo, dados, bonus, extra = "") {
  const pen = penalidade(f, { tipo: "pericia", attr: "", nome: titulo });
  const r = rollTest(dados, bonus + pen.mod, pen.dados);
  logEntry({
    quem: f.nome,
    titulo,
    total: r.total,
    det: `${r.dice.length}d20[${r.dice.join(",")}] fica ${r.mode} ${r.kept}${sgn(bonus + pen.mod)}${extra}${pen.quem.length ? ` · condições: ${pen.quem.join(", ")}` : ""}`,
    flag: r.kept === 20 ? "crit" : r.kept === 1 ? "fail" : "",
    para: S.paraRolagem || ""
  });
  return r;
}
function bindNpcRapido(id, f) {
  const sv = now => saveFicha(id, now),
    rr = () => renderPanel();
  const ed = canEditFicha(f);
  $$("[data-back]").forEach(
    b =>
      (b.onclick = () => {
        S.openFicha = null;
        renderPanel();
      })
  );
  const nv = $("#npcVis");
  if (nv)
    nv.onchange = () => {
      f.visivel = nv.checked;
      sv(true);
      toast(nv.checked ? "Os jogadores agora veem esta ficha." : "Ficha escondida dos jogadores.");
      rr();
    };
  $$("[data-qroll]").forEach(
    b =>
      (b.onclick = () => {
        const p = f.rper[+b.dataset.qroll];
        npcRolar(f, p.n || "Teste", f.attr[p.a] || 0, +p.b || 0);
      })
  );
  $$("[data-qatk]").forEach(
    b =>
      (b.onclick = () => {
        const w = f.ratq[+b.dataset.qatk];
        const r = npcRolar(f, `${w.n || "Ataque"}`, f.criatura && w.dd ? +w.dd : f.attr[w.a] || 0, +w.b || 0);
        const cm = (w.c || "").match(/(\d+)\s*\/\s*x?(\d+)/i);
        const mar = cm ? +cm[1] : 20,
          mult = cm ? +cm[2] : 2;
        const crit = r.kept >= mar;
        if (w.d && /\d*d\d+/i.test(w.d)) {
          const expr = (w.d.match(/[\dd+\-\s]+/i) || [w.d])[0].replace(/\s/g, "");
          try {
            const dm = rollExpr(expr, { critMult: crit ? mult : 1 });
            logEntry({
              quem: f.nome,
              titulo: `${w.n} · dano${crit ? " (crítico!)" : ""}`,
              total: dm.total,
              det: dm.detail + (w.d.length > expr.length ? " · " + w.d : ""),
              flag: crit ? "crit" : "",
              para: S.paraRolagem || ""
            });
          } catch (e) {}
        }
      })
  );
  on2("#qIni", () => npcRolar(f, "Iniciativa", f.attr.AGI || 0, 0));
  on2("#qPres", () => {
    let det = `DT ${f.pdt || "?"} (Vontade)`;
    let tot = null;
    const ex = (f.pdano || "").match(/\d*d\d+([+-]\d+)?/i);
    if (ex) {
      try {
        const r = rollExpr(ex[0]);
        tot = r.total;
        det += ` · dano mental ${r.detail}`;
      } catch (e) {}
    }
    logEntry({
      quem: f.nome,
      titulo: "Presença Perturbadora",
      total: tot,
      det,
      flag: "",
      para: S.paraRolagem || ""
    });
  });
  on2("#qLivre", async () => {
    const r = await formBox(
      "Teste de atributo",
      `<div class="row" style="flex-wrap:nowrap"><select name="a">${NPC_ATTRS.map(a => `<option>${a}</option>`).join("")}</select><input type="number" name="b" value="0" aria-label="Bônus"></div>`,
      "Rolar"
    );
    if (r) npcRolar(f, `Teste de ${r.a}`, f.attr[r.a] || 0, +r.b || 0);
  });
  if (!ed) return;
  $$("[data-qt]").forEach(
    i =>
      (i.oninput = () => {
        f[i.dataset.qt] = i.value;
        sv();
      })
  );
  $$("[data-qs]").forEach(
    i =>
      (i.onchange = () => {
        f[i.dataset.qs] = i.value;
        sv();
        rr();
      })
  );
  $$("[data-q]").forEach(
    i =>
      (i.onchange = () => {
        const k = i.dataset.q;
        f[k] = i.value === "" ? 0 : +i.value;
        if (k === "rpv" && cur(f, "pv") > f.rpv) f.pv = f.rpv;
        sv();
        rr();
        renderBoard();
      })
  );
  $$("[data-qa]").forEach(
    i =>
      (i.onchange = () => {
        f.attr[i.dataset.qa] = Math.max(0, +i.value || 0);
        sv();
        rr();
      })
  );
  $$("[data-qr]").forEach(
    b =>
      (b.onclick = () => {
        const k = b.dataset.qr;
        const max = derivados(f)[k + "Max"];
        f[k] = Math.max(k === "pv" ? -max : 0, Math.min(max, cur(f, k) + +b.dataset.d));
        if (k === "pv" && f.pv > 0) f.morrendo = 0;
        sv();
        rr();
        renderBoard();
      })
  );
  on2("#mrMais", () => {
    f.morrendo = (+f.morrendo || 0) + 1;
    sv(true);
    rr();
  });
  on2("#mrZera", () => {
    f.morrendo = 0;
    sv(true);
    rr();
  });
  $$("[data-qp]").forEach(
    i =>
      (i.onchange = () => {
        const p = f.rper[+i.dataset.qp];
        p[i.dataset.k] = i.dataset.k === "b" ? +i.value || 0 : i.value;
        sv();
        rr();
      })
  );
  $$("[data-qw]").forEach(
    i =>
      (i.onchange = () => {
        const w = f.ratq[+i.dataset.qw];
        w[i.dataset.k] = i.dataset.k === "b" || i.dataset.k === "dd" ? +i.value || 0 : i.value;
        sv();
        rr();
      })
  );
  $$("[data-qpdel]").forEach(
    b =>
      (b.onclick = () => {
        f.rper.splice(+b.dataset.qpdel, 1);
        sv();
        rr();
      })
  );
  $$("[data-qwdel]").forEach(
    b =>
      (b.onclick = () => {
        f.ratq.splice(+b.dataset.qwdel, 1);
        sv();
        rr();
      })
  );
  on2("#qPerAdd", () => {
    (f.rper = f.rper || []).push({ n: "", a: "AGI", b: 0 });
    sv();
    rr();
  });
  on2("#qAtqAdd", () => {
    (f.ratq = f.ratq || []).push({ n: "", a: "FOR", b: 0, d: "", c: "20/x2" });
    sv();
    rr();
  });
  $$("[data-qcond]").forEach(
    b =>
      (b.onclick = () => {
        const c = b.dataset.qcond;
        f.cond = f.cond || [];
        f.cond = f.cond.includes(c) ? f.cond.filter(x => x !== c) : [...f.cond, c];
        sv();
        rr();
        renderBoard();
      })
  );
  on2("#foto", async () => {
    const file = await pickImage();
    if (!file) return;
    const url = await cropImage(file, {
      size: 300,
      ratio: 4 / 3,
      radius: 0.06,
      type: "image/jpeg",
      title: "Ajustar a arte do NPC"
    });
    if (!url) return;
    f.foto = url;
    sv(true);
    rr();
    renderBoard();
  });
  on2("#btnTokFicha", () => tokenDaFicha(id));
  on2("#qDup", () => npcDuplicar(id));
  on2("#qFull", async () => {
    if (
      !(await confirmBox(
        "Virar ficha completa?",
        "A ficha passa a ter classe, NEX, rituais e inventário como a de um agente. Vida e Defesa passam a ser calculadas pelas regras.",
        "Virar completa"
      ))
    )
      return;
    f.rapido = false;
    delete f.pv;
    sv(true);
    rr();
  });
  on2("#btnDelFicha", async () => {
    if (!(await confirmBox(`Apagar ${f.nome}?`, "Não dá para desfazer.", "Apagar"))) return;
    try {
      await S.db.del(fichaPath(id));
      delete S.fichas[id];
      S.openFicha = null;
      renderPanel();
      renderBoard();
    } catch (e) {
      fail(e);
    }
  });
}
function on2(sel, fn) {
  const e = $(sel);
  if (e) e.onclick = fn;
}

/* ganchos na ficha e na lista */
</script>
<script>
"use strict";
/* Criaturas: ficha de criatura, arte por elemento, pôr pasta inteira na cena. */
/* =====================================================================
   CRIATURAS: ficha de criatura, criar criatura nova, arte por elemento,
   token automático para NPC e "pôr a pasta inteira na cena"

function maToURL(c) {
  let u = c.toDataURL("image/webp", 0.86);
  if (!u.startsWith("data:image/webp")) u = c.toDataURL("image/png");
  return u;
}
/* silhuetas originais de criatura, vistas de cima (fundo transparente) */
function arteCriatura(el, seed = 1) {
  const N = 256,
    c = document.createElement("canvas");
  c.width = c.height = N;
  const g = c.getContext("2d");
  const R = maRng(seed || 1);
  const cx = N / 2,
    cy = N / 2;
  const oldS = MA_S;
  MA_S = 78;
  g.shadowColor = "rgba(0,0,0,.6)";
  g.shadowBlur = 14;
  g.shadowOffsetY = 6;
  const halo = (col, r) => {
    const gr = g.createRadialGradient(cx, cy, 0, cx, cy, r);
    gr.addColorStop(0, maA(col, 0.35));
    gr.addColorStop(1, maA(col, 0));
    g.save();
    g.shadowColor = "transparent";
    g.fillStyle = gr;
    g.fillRect(0, 0, N, N);
    g.restore();
  };
  const membro = (a, len, w, col, garra) => {
    const pts = [[cx, cy]];
    let x = cx,
      y = cy,
      ang = a;
    for (let i = 0; i < 4; i++) {
      ang += (R() - 0.5) * 0.6;
      x += (Math.cos(ang) * len) / 4;
      y += (Math.sin(ang) * len) / 4;
      pts.push([x, y]);
    }
    maLine(g, pts, MA_INK, w + 5);
    maLine(g, pts, col, w);
    if (garra)
      for (let k = -1; k <= 1; k++)
        maLine(
          g,
          [
            [x, y],
            [x + Math.cos(ang + k * 0.45) * w * 1.6, y + Math.sin(ang + k * 0.45) * w * 1.6]
          ],
          MA_INK,
          4
        );
  };
  if (el === "Sangue") {
    halo("#d3283b", 120);
    for (let i = 0; i < 6; i++)
      membro((i / 6) * 6.28 + R() * 0.3, 70 + R() * 30, 10 + R() * 6, "#6a1520", true);
    maBlob(g, cx, cy, 58, R, "#5a0f18", { n: 14, j: 0.35, k: 0.2 });
    for (let i = 0; i < 9; i++)
      maBlob(g, cx + (R() - 0.5) * 70, cy + (R() - 0.5) * 70, 8 + R() * 12, R, maTone("#8a1a26", R() * 0.2), {
        n: 8,
        ink: false
      });
    g.shadowColor = "transparent";
    for (let i = 0; i < 5; i++) {
      g.strokeStyle = "rgba(20,0,4,.7)";
      g.lineWidth = 3;
      g.beginPath();
      g.moveTo(cx, cy);
      g.quadraticCurveTo(
        cx + (R() - 0.5) * 90,
        cy + (R() - 0.5) * 90,
        cx + (R() - 0.5) * 100,
        cy + (R() - 0.5) * 100
      );
      g.stroke();
    }
    maEll(g, cx, cy - 18, 22, 12, "#1a0205");
    g.fillStyle = "#e8d8c8";
    for (let i = 0; i < 7; i++) {
      g.beginPath();
      g.moveTo(cx - 18 + i * 6, cy - 24);
      g.lineTo(cx - 15 + i * 6, cy - 14);
      g.lineTo(cx - 12 + i * 6, cy - 24);
      g.fill();
    }
  } else if (el === "Morte") {
    halo("#3a3640", 125);
    g.save();
    g.shadowColor = "transparent";
    for (let i = 0; i < 14; i++) {
      const a = R() * 6.28,
        d = 50 + R() * 55;
      g.fillStyle = `rgba(20,18,24,${0.25 + R() * 0.3})`;
      g.beginPath();
      g.ellipse(cx + Math.cos(a) * d, cy + Math.sin(a) * d, 22 + R() * 20, 10 + R() * 8, a, 0, 7);
      g.fill();
    }
    g.restore();
    for (let i = 0; i < 4; i++) membro((i / 4) * 6.28 + 0.78, 62 + R() * 20, 7, "#3d3a40", true);
    maEll(g, cx, cy + 6, 42, 54, "#2a282d", { k: 0.2 });
    g.save();
    g.shadowColor = "transparent";
    g.strokeStyle = "rgba(190,190,200,.6)";
    g.lineWidth = 3;
    g.beginPath();
    for (let t = 0; t < 14; t += 0.15) {
      const r = 2.6 * t;
      g.lineTo(cx + Math.cos(t) * r, cy + 10 + Math.sin(t) * r);
    }
    g.stroke();
    g.restore();
    maCirc(g, cx, cy - 44, 20, "#cfcac0", { k: 0.25 });
    g.fillStyle = "#111";
    g.beginPath();
    g.arc(cx - 7, cy - 46, 5, 0, 7);
    g.arc(cx + 7, cy - 46, 5, 0, 7);
    g.fill();
  } else if (el === "Conhecimento") {
    halo("#e0b84a", 125);
    g.save();
    g.shadowColor = "#e0b84a";
    g.shadowBlur = 12;
    g.strokeStyle = "#e8c35a";
    for (let k = 0; k < 3; k++) {
      g.lineWidth = 3 - k * 0.6;
      g.beginPath();
      g.arc(cx, cy, 64 + k * 22, R() * 6, R() * 6 + 4.5);
      g.stroke();
    }
    for (let i = 0; i < 14; i++) {
      const a = (i / 14) * 6.28,
        d = 86;

  } else if (el === "Energia") {

    g.shadowColor = "#c88aff";
    g.shadowBlur = 16;
    for (let i = 0; i < 9; i++) {
      let x = cx,

      g.beginPath();
      g.moveTo(x, y);
      for (let k = 0; k < 6; k++) {
        a += (R() - 0.5) * 1.4;
        x += Math.cos(a) * 16;
        y += Math.sin(a) * 16;
        g.lineTo(x, y);
      }
      g.strokeStyle = R() < 0.5 ? "#d9b0ff" : "#9a4aff";
      g.lineWidth = 2 + R() * 3;
      g.stroke();
    }
    g.restore();
    for (let i = 0; i < 7; i++) {
      g.save();
      g.translate(cx + (R() - 0.5) * 80, cy + (R() - 0.5) * 80);
      g.rotate(R() * 6);
      g.beginPath();
      g.moveTo(0, -24);
      g.lineTo(10, 0);
      g.lineTo(0, 10);
      g.lineTo(-10, 0);
      g.closePath();
      g.fillStyle = maGrad(g, -10, -24, 20, 34, "#7a2ad8", 0.35);
      g.fill();
      g.lineWidth = 3;
      g.strokeStyle = MA_INK;
      g.stroke();
      g.restore();
    }
    maBlob(g, cx, cy, 30, R, "#2a0a4a", { n: 9, j: 0.5 });
    maCirc(g, cx, cy, 14, "#f0dcff", { k: 0.1 });
  } else if (el === "Medo") {
    halo("#e8f0ff", 130);
    g.save();
    g.shadowColor = "transparent";
    for (let i = 0; i < 10; i++) {
      const a = R() * 6.28,
        d = 40 + R() * 60;
      g.fillStyle = `rgba(230,236,250,${0.06 + R() * 0.08})`;
      g.beginPath();
      g.ellipse(cx + Math.cos(a) * d, cy + Math.sin(a) * d, 30, 14, a, 0, 7);
      g.fill();
    }
    g.restore();
    for (let i = 0; i < 4; i++) membro([0.6, 2.5, 3.8, 5.6][i] + (R() - 0.5) * 0.3, 95, 5, "#d8dce6", true);
    maEll(g, cx, cy + 12, 22, 46, "#c9ced8", { k: 0.25 });
    maCirc(g, cx, cy - 40, 24, "#e6e9f0", { k: 0.2 });
    g.shadowColor = "transparent";
    g.fillStyle = "#0a0a10";
    for (let i = 0; i < 7; i++) {

    }
  } else {
    halo("#5aa8ff", 110);
    for (let i = 0; i < 4; i++) membro((i / 4) * 6.28 + 0.78 + R() * 0.4, 70, 9, "#2c2a33", true);

  }
  MA_S = oldS;

}
/* retrato genérico para NPC sem arte (busto, sem rosto definido) */
function artePessoa(seed = 1) {
  const N = 256,
    c = document.createElement("canvas");
  c.width = c.height = N;
  const g = c.getContext("2d");
  const R = maRng(seed || 1);
  const oldS = MA_S;
  MA_S = 80;
  const bg = g.createRadialGradient(N * 0.5, N * 0.35, 10, N * 0.5, N * 0.5, N * 0.75);
  bg.addColorStop(0, "#3a3442");
  bg.addColorStop(1, "#0d0b10");
  g.fillStyle = bg;
  g.fillRect(0, 0, N, N);
  const roupa = maPick(["#2b2b33", "#3a2a22", "#1f3550", "#4a1c24", "#2f4a3a", "#55504a", "#1d1e23"], R),
    pele = maPick(["#e2b48f", "#c8946a", "#a06a45", "#7a4a2e", "#5a3622", "#f0c8a8"], R),
    cab = maPick(["#1a1410", "#3a2416", "#6a4a2a", "#2a2a2a", "#8a8a8a", "#b48a4a"], R);
  g.beginPath();
  g.moveTo(10, N);
  g.bezierCurveTo(14, 178, 70, 160, 128, 160);
  g.bezierCurveTo(186, 160, 242, 178, 246, N);
  g.closePath();
  g.fillStyle = maGrad(g, 0, 150, N, 110, roupa, 0.18);
  g.fill();
  g.lineWidth = 4;
  g.strokeStyle = MA_INK;
  g.stroke();
  g.beginPath();
  g.moveTo(104, 162);
  g.lineTo(128, 206);
  g.lineTo(152, 162);
  g.fillStyle = maTone(roupa, 0.35);
  g.fill();
  g.stroke();
  g.fillStyle = maTone(pele, -0.15);
  g.fillRect(112, 128, 32, 38);
  g.strokeRect(112, 128, 32, 38);
  maEll(g, 128, 104, 40, 50, pele, { k: 0.18 });
  const h = Math.floor(R() * 4);
  g.fillStyle = cab;
  g.beginPath();
  if (h === 0) {
    g.ellipse(128, 76, 44, 30, 0, Math.PI, 0);
    g.fill();
  } else if (h === 1) {
    g.ellipse(128, 82, 46, 38, 0, Math.PI * 1.05, -0.05);
    g.lineTo(172, 140);
    g.lineTo(162, 96);
    g.lineTo(94, 96);
    g.lineTo(84, 140);
    g.fill();
  } else if (h === 2) {
    g.ellipse(128, 70, 38, 18, 0, Math.PI, 0);
    g.fill();
  } else {
    g.ellipse(128, 90, 54, 62, 0, Math.PI * 1.08, -0.08);
    g.lineTo(182, 170);
    g.lineTo(166, 110);
    g.lineTo(90, 110);
    g.lineTo(74, 170);
    g.closePath();
    g.fillStyle = maTone(roupa, -0.1);
    g.fill();
  }
  g.fillStyle = "rgba(10,8,12,.55)";
  g.fillRect(104, 102, 16, 6);
  g.fillRect(136, 102, 16, 6);
  MA_S = oldS;
  return maToURL(c);
}

/* ---------- ficha de criatura ---------- */
function criaturaDe(b) {
  const f = novaFicha();
  const at = (b && b.at) || [1, 1, 1, 1, 1];
  Object.assign(f, {
    npc: true,
    criatura: true,
    rapido: true,
    visivel: false,
    dono: S.uid,
    nome: b ? b.n : "Nova criatura",
    base: b ? b.n : "",

    rtipo: b ? `Criatura${b.el ? " de " + b.el : ""} · VD ${b.vd}` : "Criatura",
    rpv: b ? +b.pv || 10 : 20,
    rdef: b ? +b.def || 10 : 12,
    rdesl: 9,
    attr: { AGI: at[0] ?? 1, FOR: at[1] ?? 1, INT: at[2] ?? 1, PRE: at[3] ?? 1, VIG: at[4] ?? 1 },
    rper: [
      { n: "Fortitude", a: "VIG", b: 0 },
      { n: "Reflexos", a: "AGI", b: 0 },
      { n: "Vontade", a: "PRE", b: 0 }
    ],
    ratq:
      b && b.atk
        ? [{ n: b.atk[0], dd: +b.atk[1] || 1, a: "FOR", b: +b.atk[2] || 0, d: b.atk[3] || "", c: "20/x2" }]
        : [],
    rnotas: ""
  });
  const pm = b && String(b.pres || "").match(/DT\s*(\d+)\s*·?\s*(.*)/i);
  if (pm) {
    f.pdt = +pm[1];
    f.pdano = pm[2].trim();
  }
  f.pv = f.rpv;
  return f;
}
async function novaCriatura() {
  const B = allBest();
  const r = await formBox(
    "Criar criatura",
    `<div class="field"><label class="label" for="ncB">Começar de</label><select id="ncB" name="base"><option value="">Criatura nova (em branco)</option>${B.map((b, i) => `<option value="${i}">${esc(b.n)}${b.el ? " · " + esc(b.el) : ""} · VD ${b.vd}${b.hb ? " (homebrew)" : ""}</option>`).join("")}</select></div>
   <div class="row" style="flex-wrap:nowrap"><div class="field" style="flex:2"><label class="label" for="ncN">Nome</label><input type="text" id="ncN" name="nome" maxlength="40" placeholder="Deixe vazio para usar o da base"></div><div class="field" style="flex:1"><label class="label" for="ncQ">Quantas</label><input type="number" id="ncQ" name="qtd" min="1" max="12" value="1"></div></div>
   <div class="field"><label class="label" for="ncE">Elemento (para criatura nova)</label><select id="ncE" name="el">${["Sangue", "Morte", "Conhecimento", "Energia", "Medo", ""].map(e => `<option value="${e}">${e || "Nenhum"}</option>`).join("")}</select></div>
   <div class="field"><label class="label" for="ncP">Pasta</label><input type="text" id="ncP" name="pasta" maxlength="40" list="ncPastas" placeholder="Ex.: Missão do hospital"><datalist id="ncPastas">${npcPastas()
     .map(p => `<option value="${esc(p)}">`)
     .join("")}</datalist></div>
   <label class="check"><input type="checkbox" name="arte"> Escolher uma arte minha agora (senão usa a silhueta do elemento)</label>`,
    "Criar"
  );
  if (!r) return;
  const b = r.base === "" ? null : B[+r.base];
  const q = Math.max(1, Math.min(12, +r.qtd || 1));
  let foto = null;
  if (r.arte) {
    const file = await pickImage();
    if (file) {
      foto = await cropImage(file, {
        size: 300,
        ratio: 4 / 3,
        radius: 0.06,
        type: "image/webp",
        title: "Ajustar a arte da criatura"
      });
    }
  }
  let first = null;
  for (let i = 0; i < q; i++) {
    const id = "n" + rid(8);
    const f = criaturaDe(b);
    if (!b) {
      f.rel = r.el || "";
      f.rtipo = "Criatura" + (f.rel ? " de " + f.rel : "");
    }
    if (r.nome.trim()) f.nome = r.nome.trim();
    if (q > 1) f.nome += " " + (i + 1);
    if (r.pasta.trim()) f.pasta = r.pasta.trim();
    if (foto) f.foto = foto;
    f.criada = Date.now() + i;
    S.fichas[id] = f;
    saveFicha(id, true);
    first = first || id;
    await new Promise(z => setTimeout(z, 20));
  }
  if (q === 1) {
    S.openFicha = first;
    S.sheetTab = "principal";
  }
  renderPanel();
  toast(q > 1 ? `${q} criaturas criadas.` : "Criatura criada.");
}

/* Avatar no card de NPC/criatura: foto; criatura sem foto usa a arte do bestiário ou a gerada. */
function npcAvatar(f) {
  if (f.foto || !f.criatura) return avatar(f);
  const url =
    arteDaBase(f.base) ||
    arteCriatura(f.rel || "", maH((f.nome || "").length, (f.base || f.nome || "x").charCodeAt(0), 5));
  return `<img class="avatar" src="${url}" alt="" style="width:52px;height:52px;object-fit:contain;background:#0d0b10">`;
}
async function porGrupoEmCena(pasta, kind) {
  if (!S.viewSid) {
    toast("Abra uma cena primeiro.");
    return;
  }
  const ids = Object.keys(S.fichas).filter(id => {
    const f = S.fichas[id];
    return f.npc && (kind === "cri" ? f.criatura : !f.criatura) && (f.pasta || "") === pasta;
  });
  if (!ids.length) return;
  const r = await formBox(
    `Pôr ${ids.length} na cena`,
    `<p class="muted small" style="margin:0">${ids.map(id => esc(S.fichas[id].nome)).join(", ")}</p>
   <label class="check"><input type="checkbox" name="oculto" checked> Começam ocultos (só você vê até revelar)</label><label class="check"><input type="checkbox" name="comb" ${kind === "cri" ? "checked" : ""}> Já entram no combate</label>`,
    "Pôr na cena"
  );
  if (!r) return;
  const base = tokenBase();
  const rr = board.getBoundingClientRect();
  const cx = (rr.width / 2 - V.x) / V.z,
    cy = (rr.height / 2 - V.y) / V.z;
  const cols = Math.min(5, ids.length);
  let k = 0;
  const c = r.comb ? combBase() : null;
  for (const id of ids) {
    const f = S.fichas[id];
    let t = S.tokens.find(x => x.fichaId === id);
    if (!t) {
      const url = f.foto
        ? ""
        : f.criatura
          ? arteCriatura(f.rel || "", maH((f.nome || "").length, (f.base || f.nome || "x").charCodeAt(0), 5))
          : artePessoa(maH((f.nome || "").length, (f.rtipo || f.nome || "x").charCodeAt(0), 9));
      const doc = {
        nome: f.nome,
        url,
        fichaId: id,
        forma: f.criatura ? "livre" : "quadrado",
        cor: "#4a4a52",
        usaFoto: true,
        oculto: !!r.oculto
      };
      const tid = await criarToken(doc, false);
      if (!tid) continue;
      t = { id: tid, ...doc, dono: S.uid };
      S.tokens.push(t);
    } else if (!!t.oculto !== !!r.oculto) {
      t.oculto = !!r.oculto;
      S.db.merge(P() + "/tokens/" + t.id, { oculto: t.oculto }).catch(() => {});
    }
    if (!S.pos[t.id]) {
      let spot = null;
      for (let ring = 0; ring < 12 && !spot; ring++)
        for (let dy = -ring; dy <= ring && !spot; dy++)
          for (let dx = -ring; dx <= ring && !spot; dx++) {
            if (Math.max(Math.abs(dx), Math.abs(dy)) !== ring) continue;
            const x = cx + dx * base * 1.15,
              y = cy + dy * base * 1.15;
            if (x < 0 || y < 0 || x > V.w || y > V.h) continue;
            if (!Object.values(S.pos).some(p => Math.hypot(p.x - x, p.y - y) < base * 0.9)) spot = { x, y };
          }
      porEmCena(t.id, spot || { x: cx, y: cy });
    }
    k++;
    if (c && !c.lista.some(x => x.fichaId === id))
      c.lista.push({ id: rid(5), tipo: "npcf", fichaId: id, nome: f.nome, ini: null });
  }
  if (c) saveCombate(c);
  renderBoard();
  toast(`${ids.length} na cena${r.oculto ? " (ocultos)" : ""}${c ? " e no combate" : ""}.`);
}

/* Põe uma ameaça do bestiário na cena: cria a ficha de criatura, o token e (se marcado) entra no combate. */
async function ameacaEmCena(b) {
  if (!b || !S.viewSid) return;
  const n = Object.values(S.fichas).filter(f => f.criatura && f.base === b.n).length;
  const id = "n" + rid(8);
  const f = criaturaDe(b);
  f.nome = b.n + (n ? " " + (n + 1) : "");
  f.criada = Date.now();
  S.fichas[id] = f;
  saveFicha(id, true);
  await criarToken(
    {
      nome: f.nome,
      url: arteCriatura(b.el, maH(f.nome.length, b.n.charCodeAt(0), 5)),
      fichaId: id,
      ameaca: b.n,
      forma: "livre",
      usaFoto: true,
      oculto: !!S.ameOculto
    },
    true
  );
  if (S.ameCombate !== false) {
    const c = combBase();
    c.lista.push({ id: rid(5), tipo: "npcf", fichaId: id, nome: f.nome, ini: null });
    saveCombate(c);
  }
  toast(
    `${f.nome} entrou em cena${S.ameCombate !== false ? " e no combate" : ""}. A ficha dela está em Agentes → Criaturas.`
  );
}

<script>

async function arteBestEscolher(n) {

<script>
"use strict";
/* Meus personagens: fichas fora de mesa, levar e trazer de mesas. */
/* =====================================================================
   PERSONAGENS SEM MESA
   Ficam em usuarios/<uid>/personagens. Dá para criar, editar, rolar
   (só na sua tela) e depois levar para qualquer mesa.
   ===================================================================== */
function subscribeSolos() {
  if (S.solosUnsub || !S.uid) return;
  S.solos = [];
  S.solosUnsub = S.db.listenCol(
    "usuarios/" + S.uid + "/personagens",
    null,
    l => {
      S.solos = l.sort((a, b) => (b.atualizada || b.criada || 0) - (a.atualizada || a.criada || 0));
      S.loaded.solos = true;
      if (!S.mesaId && !S.solo) showLobby();
      if (S.mesaId && S.tool === "agentes" && !S.openFicha) renderPanel();
    },
    () => {
      S.loaded.solos = true;
    }
  );
}

const nomeIgual = (a, b) => {
  a = (a || "").trim().toLowerCase();
  return !!a && a === (b || "").trim().toLowerCase();
};
/* fichas desta conta que já são esse personagem (mesmo vínculo ou mesmo nome) */
const jaNaMesa = (lista, c) =>
  lista.filter(
    x => (x.npc ? S.isM : x.dono === S.uid) && (x.origemSolo === c.id || nomeIgual(x.nome, c.nome))
  );
function soloCardsHTML() {
  const L = S.solos || [];
  // botão para apagar cópias repetidas (gruposRepetidos fica em mestre/gestao)
  const n = gruposRepetidos(L, c => (c.nome || "").trim().toLowerCase()).reduce(
    (t, a) => t + a.length - 1,
    0
  );
  const rep = n
    ? `<div class="row" style="justify-content:flex-start"><button class="btn sm ghost" id="btnJuntarSolos" style="border-color:var(--red)">Apagar cópias repetidas (${n})</button></div>`
    : "";
  if (!L.length) return rep;
  return (
    rep +
    `<div class="mesas" style="grid-template-columns:repeat(auto-fill,minmax(260px,1fr))">${L.map(
      c => `<div class="mesa-card pchar"><button class="pc-open" data-solo="${esc(c.id)}">${c.foto ? `<img class="avatar" src="${c.foto}" alt="" style="width:52px;height:69px;object-fit:cover;object-position:50% 15%">` : `<div class="avatar ph" style="width:52px;height:52px">${esc((c.nome || "?").charAt(0).toUpperCase())}</div>`}<div style="min-width:0;text-align:left"><b>${esc(c.nome || "Sem nome")}</b><div class="muted small">${esc(c.classe || "")}${c.trilha ? " · " + esc(c.trilha) : ""} · NEX ${c.nex || 5}%</div><div class="muted small">Sem mesa (guardado na sua conta)</div></div></button>
    <div class="row" style="gap:6px"><button class="btn sm" data-sololevar="${esc(c.id)}">Levar para uma mesa</button><button class="btn sm ghost" data-solobx="${esc(c.id)}" title="Baixar um arquivo com este personagem para guardar ou mandar a um amigo">Baixar</button><button class="btn sm ghost" data-solodel="${esc(c.id)}" aria-label="Apagar personagem">✕</button></div></div>`
    ).join("")}</div>`
  );
}
function bindSoloCards() {
  {
    const im = $("#btnImpSolo");
    if (im) im.onclick = importarSolo;
  }
  $$("[data-solobx]").forEach(
    b =>
      (b.onclick = () => {
        const c = (S.solos || []).find(x => x.id === b.dataset.solobx);
        if (c) baixarPersonagem(c);
      })
  );
  const nv = $("#btnNovoSolo");
  if (nv)
    nv.onclick = () => {
      const id = "p" + rid(8);
      const f = novaFicha();
      f.dono = S.uid;
      f.criada = Date.now();
      soloAbrir(id, f, true);
    };
  $$("[data-solo]").forEach(
    b =>
      (b.onclick = () => {
        const c = (S.solos || []).find(x => x.id === b.dataset.solo);
        if (c) {
          const { id, ...f } = c;
          soloAbrir(id, f);
        }
      })
  );
  $$("[data-sololevar]").forEach(
    b => (b.onclick = () => soloLevar((S.solos || []).find(x => x.id === b.dataset.sololevar)))
  );
  $$("[data-solodel]").forEach(
    b =>
      (b.onclick = async () => {
        const c = (S.solos || []).find(x => x.id === b.dataset.solodel);
        if (!c) return;
        if (
          !(await confirmBox(
            `Apagar ${c.nome || "este personagem"}?`,
            "Some da sua conta. As cópias que você já levou para mesas continuam lá.",
            "Apagar"
          ))
        )
          return;
        try {
          await S.db.del("usuarios/" + S.uid + "/personagens/" + c.id);
        } catch (e) {
          fail(e);
        }
      })
  );
  const b = $("#btnJuntarSolos");
  if (b) b.onclick = juntarSolos;
  setTimeout(() => {
    const f = $("#fNova");
    if (f && f.onsubmit && !f._u) {
      const o = f.onsubmit;
      f.onsubmit = ev => {
        ev.preventDefault();
        if (f._b) return;
        f._b = 1;
        setTimeout(() => (f._b = 0), 2500);
        return o(ev);
      };
      f._u = 1;
    }
  }, 0);
}
/* Backup de personagem: o mesmo arquivo das mesas ("Baixar ficha"), então serve para guardar
   e para mandar a um amigo, que importa em Meus personagens ou direto numa mesa. */
const CAMPOS_DA_MESA = [
  "id",
  "dono",
  "npc",
  "visivel",
  "pasta",
  "donoAntes",
  "solo",
  "origemSolo",
  "atualizada"
];
function limparPersonagem(f) {
  const c = JSON.parse(JSON.stringify(f || {}));
  CAMPOS_DA_MESA.forEach(k => delete c[k]);
  return c;
}
function baixarPersonagem(c) {
  baixar(`personagem-${slug(c.nome)}.json`, {
    tipo: "simula-ordem-ficha",
    v: 1,
    exportada: Date.now(),
    ficha: limparPersonagem(c)
  });
  toast(`${c.nome || "Personagem"} baixado. Mande o arquivo para quem quiser.`);
}
async function importarSolo() {
  if (toqueDuplo("importarSolo")) return; // evita rodar duas vezes num toque duplo
  if (!S.uid) {
    toast("Espere carregar e tente de novo.");
    return;
  }
  const d = await lerJSON();
  if (!d) return;
  const lista =
    d.tipo === "simula-ordem-ficha" && d.ficha
      ? [d.ficha]
      : d.tipo === "simula-ordem-mesa"
        ? (d.fichas || []).filter(f => !f.npc)
        : null;
  if (!lista || !lista.length) {
    toast("Esse arquivo não é um personagem do Simula Ordem.");
    return;
  }
  let escolhidos = lista;
  if (lista.length > 1) {
    const r = await formBox(
      "Quais personagens importar?",
      `<p class="muted small" style="margin:0">Esse arquivo é o backup de uma mesa. Escolha os agentes que vão para Meus personagens.</p>${lista.map((f, i) => `<label class="check"><input type="checkbox" name="p${i}" checked> ${esc(f.nome || "Sem nome")}</label>`).join("")}`,
      "Importar"
    );
    if (!r) return;
    escolhidos = lista.filter((f, i) => r["p" + i]);
    if (!escolhidos.length) return;
  }
  try {
    for (const f0 of escolhidos) {
      const f = migrar({ ...limparPersonagem(f0), dono: S.uid, criada: Date.now(), atualizada: Date.now() });
      const ja = (S.solos || []).some(x => nomeIgual(x.nome, f.nome));
      if (ja) f.nome = (f.nome || "Personagem") + " (cópia)";
      await S.db.set("usuarios/" + S.uid + "/personagens/p" + rid(8), f);
    }
    toast(
      escolhidos.length > 1
        ? `${escolhidos.length} personagens importados.`
        : `${escolhidos[0].nome || "Personagem"} está em Meus personagens.`
    );
  } catch (e) {
    fail(e);
  }
}

/* abre a ficha numa tela própria, usando o mesmo editor das mesas */
function soloAbrir(id, f, novo) {
  if (toqueDuplo("soloAbrir")) return; // evita rodar duas vezes num toque duplo
  const pb = $("#pbody");
  if (!pb) return;
  S.soloBack = {
    isM: S.isM,
    tool: S.tool,
    open: S.openFicha,
    parent: pb.parentElement,
    next: pb.nextSibling
  };
  S.solo = id;
  S.isM = false;
  S.tool = "agentes";
  S.openFicha = id;
  S.sheetTab = "principal";
  S.fichas[id] = { ...f, solo: true, dono: S.uid };
  document.body.insertAdjacentHTML(
    "beforeend",
    `<div class="soloEd" id="soloEd"><div class="me-top"><button class="btn sm ghost" id="soloX">← Voltar</button><b style="font-family:var(--f-display);font-size:18px">Personagem sem mesa</b><span class="me-gap"></span><span class="muted small">Salva sozinho na sua conta</span></div><div class="solo-in" id="soloIn"></div></div>`
  );
  $("#soloIn").appendChild(pb);
  document.body.classList.add("me-open");
  $("#soloX").onclick = soloFechar;
  if (novo) saveFicha(id, true);
  renderPanel();
}
function soloFechar() {
  const id = S.solo;
  if (!id) return;
  if (S.dirty[id]) saveFicha(id, true);
  const B = S.soloBack || {};
  const pb = $("#pbody");
  if (pb && B.parent) B.parent.insertBefore(pb, B.next || null);
  pb.innerHTML = "";
  const el = $("#soloEd");
  if (el) el.remove();
  document.body.classList.remove("me-open");
  delete S.fichas[id];
  S.solo = null;
  S.isM = !!B.isM;
  S.tool = B.tool || null;
  S.openFicha = B.open || null;
  showLobby();
}
async function soloLevar(c) {
  if (toqueDuplo("soloLevar")) return; // evita rodar duas vezes num toque duplo
  if (!c) return;
  const r = await formBox(
    `Levar ${c.nome || "personagem"} para uma mesa`,
    `<p class="muted small" style="margin:0">Uma cópia vai para a mesa. A ficha guardada na sua conta continua aqui para levar a outras mesas.</p>
   <div class="field"><label class="label" for="slCod">Código da mesa</label><input type="text" id="slCod" name="cod" maxlength="10" placeholder="Ex.: K7RQ2M" style="text-transform:uppercase" required></div>
   <p class="muted small" style="margin:0">Se ainda não entrou nessa mesa, entre uma vez pelo link do mestre e depois volte aqui (ou use "Trazer um personagem meu" dentro da mesa).</p>`,
    "Levar"
  );
  if (!r) return;
  const cod = r.cod.trim().toUpperCase();
  if (!/^[A-Z0-9]{4,10}$/.test(cod)) {
    toast("Código inválido.");
    return;
  }
  try {
    const m = await S.db.get("portas/" + cod);
    if (!m) {
      toast("Não achei uma mesa com esse código.");
      return;
    }
    let ja = [];
    try {
      ja = await S.db.getCol("mesas/" + cod + "/fichas");
    } catch (e) {}
    const dup = jaNaMesa(ja, c);
    if (
      dup.length &&
      !(await confirmBox(
        `${c.nome} já está nessa mesa`,
        "Ele já aparece em Agentes nessa mesa. Levar mais uma cópia mesmo assim?",
        "Levar outra cópia"
      ))
    ) {
      S.abrirFicha = dup[0].id;
      location.hash = "mesa-" + cod;
      return;
    }
    const { id: _i, solo, ...f } = c;
    const nid = "f" + rid(8);
    try {
      await S.db.set("mesas/" + cod + "/fichas/" + nid, {
        ...f,
        origemSolo: c.id,
        dono: S.uid,
        criada: Date.now(),
        pv: null,
        pe: null,
        san: null,
        cond: [],
        morrendo: 0
      });
    } catch (e) {
      if (e && e.code === "permission-denied") {
        toast("Entre nessa mesa primeiro (pelo link ou código) e depois leve o personagem.");
        return;
      }
      throw e;
    }
    toast(`${c.nome} foi para a mesa ${m.nome}.`);
    S.abrirFicha = nid;
    location.hash = "mesa-" + cod;
  } catch (e) {
    fail(e);
  }
}
/* dentro de uma mesa: trazer um personagem guardado */
async function soloTrazer() {
  if (toqueDuplo("soloTrazer")) return; // evita rodar duas vezes num toque duplo
  const L = S.solos || [];
  if (!L.length) {
    toast("Você ainda não tem personagens guardados na conta.");
    return;
  }
  const r = await formBox(
    "Trazer um personagem meu",
    `<div class="field"><label class="label" for="stSel">Personagem</label><select id="stSel" name="id">${L.map(c => `<option value="${esc(c.id)}">${esc(c.nome || "Sem nome")} · ${esc(c.classe || "")} NEX ${c.nex || 5}%</option>`).join("")}</select></div>
   <p class="muted small" style="margin:0">Uma cópia entra nesta mesa. A ficha da sua conta continua guardada.</p>`,
    "Trazer"
  );
  if (!r) return;
  const c = L.find(x => x.id === r.id);
  if (!c) return;
  const ja = jaNaMesa(
    Object.entries(S.fichas).map(([id, x]) => ({ ...x, id })),
    c
  );
  if (ja.length) {
    const q = await formBox(
      `${c.nome} já está nesta mesa`,
      `<p class="muted small" style="margin:0">Ele já aparece em Agentes${ja[0].npc ? " (como NPC)" : ""}. Para continuar jogando com ele, é só abrir a ficha que já está aqui.</p>
     <label class="check"><input type="radio" name="o" value="abrir" checked> Abrir a ficha que já está na mesa</label><label class="check"><input type="radio" name="o" value="copia"> Trazer outra cópia mesmo assim</label>`,
      "Continuar"
    );
    if (!q) return;
    if (q.o !== "copia") {
      S.openFicha = ja[0].id;
      S.sheetTab = "principal";
      renderPanel();
      return;
    }
  }
  const { id: _i, solo, ...f } = c;
  const nid = "f" + rid(8);
  S.fichas[nid] = {
    ...f,
    origemSolo: c.id,
    dono: S.uid,
    criada: Date.now(),
    pv: null,
    pe: null,
    san: null,
    cond: [],
    morrendo: 0
  };
  saveFicha(nid, true);
  S.openFicha = nid;
  S.sheetTab = "principal";
  renderPanel();
  toast(`${c.nome} entrou na mesa.`);
}
async function soloGuardarCopia(id, semVinculo) {
  if (toqueDuplo("soloGuardarCopia")) return; // evita rodar duas vezes num toque duplo
  const f = S.fichas[id];
  if (!f) return;
  const { npc, visivel, pasta, origemSolo, solo, ...dados } = JSON.parse(JSON.stringify(f));
  const L = S.solos || [];
  const alvo = L.find(c => c.id === f.origemSolo) || L.find(c => nomeIgual(c.nome, f.nome));
  const pid = alvo ? alvo.id : "p" + rid(8);
  try {
    await S.db.set("usuarios/" + S.uid + "/personagens/" + pid, {
      ...dados,
      dono: S.uid,
      criada: (alvo && alvo.criada) || Date.now(),
      atualizada: Date.now()
    });
    if (!semVinculo && f.origemSolo !== pid) {
      f.origemSolo = pid;
      saveFicha(id, true);
    }
    toast(alvo ? `${f.nome} atualizado em Meus personagens.` : `${f.nome} guardado em Meus personagens.`);
  } catch (e) {
    fail(e);
  }
}

/* Botão "Trazer um personagem meu" na lista de Agentes (personagens da conta, fora de mesa). */
function soloTrazerBotaoHTML() {
  return (S.solos || []).length
    ? `<button class="btn block" id="btnTrazerSolo" style="margin-top:6px">Trazer um personagem meu (${S.solos.length})</button>`
    : "";
}
