<script>
"use strict";
/* Gestão: apagar mesa, retirar ficha, virar NPC, dar ficha a um jogador, repetidas. */
/* =====================================================================
   GESTÃO: apagar mesa, retirar personagem da mesa, transformar em NPC
   ===================================================================== */
const MESA_SUBCOLS = [
  "log",
  "privado",
  "pings",
  "desenhos",
  "pos",
  "nevoa",
  "cenaImg",
  "cenas",
  "tokens",
  "fichas",
  "npcs",
  "homebrew",
  "estado",
  "mestre",
  "docs",
  "mapas",
  "arteBest",
  "pedidos",
  "entrada",
  "bloqueados",
  "segredo",
  "membros"
];
async function apagarMesa(id, nome) {
  if (toqueDuplo("apagarMesa")) return; // evita rodar duas vezes num toque duplo
  const r = await formBox(
    `Apagar a mesa "${nome || id}"?`,
    `<p style="margin:0">Some tudo para todos: fichas da mesa, NPCs, cenas, mapas, documentos, rolagens. <b>Não dá para desfazer.</b></p>
   <p class="muted small" style="margin:0">Se quiser guardar, baixe antes o backup no Escudo do mestre. Personagens guardados em "Meus personagens" não são apagados.</p>
   <div class="field"><label class="label" for="dmC">Para confirmar, escreva o código da mesa: <b>${esc(id)}</b></label><input type="text" id="dmC" name="cod" maxlength="10" autocomplete="off" style="text-transform:uppercase" required></div>`,
    "Apagar para sempre"
  );
  if (!r) return;
  if (r.cod.trim().toUpperCase() !== id) {
    toast("O código não confere. Nada foi apagado.");
    return;
  }
  toast("Apagando a mesa…");
  const p = "mesas/" + id;
  try {
    if (S.mesaId === id) {
      location.hash = "";
      await new Promise(z => setTimeout(z, 300));
    }
    for (const col of MESA_SUBCOLS) {
      let docs = [];
      try {
        docs = await S.db.getCol(p + "/" + col);
      } catch (e) {}
      for (const d of docs) {
        try {
          await S.db.del(p + "/" + col + "/" + d.id);
        } catch (e) {}
      }
    }
    try {
      await S.db.del("portas/" + id);
    } catch (e) {}
    await S.db.del(p);
    try {
      await S.db.del("usuarios/" + S.uid + "/mesas/" + id);
    } catch (e) {}
    try {
      const L = lsGet("ms_visitadas", []);
      if (Array.isArray(L))
        lsSet(
          "ms_visitadas",
          L.filter(x => x !== id)
        );
    } catch (e) {}
    toast("Mesa apagada.");
    if (!S.mesaId) showLobby();
  } catch (e) {
    fail(e);
  }
}
async function retirarFicha(id) {
  if (toqueDuplo("retirarFicha")) return; // evita rodar duas vezes num toque duplo
  const f = S.fichas[id];
  if (!f) return;
  const meu = f.dono === S.uid && !f.rapido;
  const r = await formBox(
    `Retirar ${f.nome} da mesa?`,
    `<p style="margin:0">A ficha sai desta mesa${f.npc ? " (é um NPC)" : meu ? "" : " (é de outro jogador)"}.</p>
   ${meu ? `<label class="check"><input type="checkbox" name="guardar" checked> Salvar em Meus personagens antes (atualiza o que já está lá)</label>` : ""}
   <label class="check"><input type="checkbox" name="tok" checked> Tirar também os tokens dela</label>`,
    "Retirar"
  );
  if (!r) return;
  try {
    if (r.guardar) await soloGuardarCopia(id, true);
    if (r.tok)
      for (const t of S.tokens.filter(t => t.fichaId === id)) {
        try {
          await S.db.del(P() + "/tokens/" + t.id);
        } catch (e) {}
      }
    await S.db.del(fichaPath(id));
    delete S.fichas[id];
    S.openFicha = null;
    renderPanel();
    renderBoard();
    toast(`${f.nome} saiu da mesa.`);
  } catch (e) {
    fail(e);
  }
}
async function virarNpc(id) {
  if (toqueDuplo("virarNpc")) return; // evita rodar duas vezes num toque duplo
  const f = S.fichas[id];
  if (!f || !S.isM || f.npc) return;
  const r = await formBox(
    `Transformar ${f.nome} em NPC?`,
    `<p style="margin:0">A ficha passa a ser sua, como NPC, e sai da lista de agentes${f.dono !== S.uid ? " do jogador" : ""}. Os tokens continuam ligados a ela.</p>
   <label class="check"><input type="checkbox" name="vis"> Deixar a ficha visível para os jogadores</label>
   <div class="field"><label class="label" for="vnP">Pasta (opcional)</label><input type="text" id="vnP" name="pasta" maxlength="40" list="vnPastas"><datalist id="vnPastas">${npcPastas()
     .map(p => `<option value="${esc(p)}">`)
     .join("")}</datalist></div>`,
    "Transformar"
  );
  if (!r) return;
  const dados = JSON.parse(JSON.stringify(f));
  Object.assign(dados, { npc: true, visivel: !!r.vis, dono: S.uid, donoAntes: f.dono || S.uid });
  if (r.pasta.trim()) dados.pasta = r.pasta.trim();
  delete dados.solo;
  try {
    await S.db.set(P() + "/npcs/" + id, dados);

    S.fichas[id] = dados;
    tokensDono(id, S.uid);
    S.openFicha = id;
    renderPanel();
    renderBoard();
    toast(`${f.nome} agora é um NPC.`);
  } catch (e) {
    fail(e);
  }
}

async function virarAgente(id) {
  if (toqueDuplo("virarAgente")) return; // evita rodar duas vezes num toque duplo
  const f = S.fichas[id];
  if (!f || !S.isM || !f.npc) return;
  if (
    !(await confirmBox(
      `${f.nome} volta a ser agente?`,
      "A ficha sai dos NPCs e volta para a lista de agentes" +
        (f.donoAntes && f.donoAntes !== S.uid ? ", de novo com o jogador dono dela." : "."),
      "Voltar a ser agente"
    ))
  )
    return;
  const { npc, visivel, pasta, donoAntes, ...dados } = JSON.parse(JSON.stringify(f));
  dados.dono = donoAntes || S.uid;
  try {
    await S.db.set(P() + "/fichas/" + id, dados);
    await S.db.del(P() + "/npcs/" + id);
    S.fichas[id] = dados;
    tokensDono(id, dados.dono);
    S.openFicha = id;
    renderPanel();
    renderBoard();
    toast(`${f.nome} voltou a ser agente.`);
  } catch (e) {
    fail(e);
  }
}
function tokensDono(id, uid) {
  (S.tokens || [])
    .filter(t => t.fichaId === id && t.dono !== uid)
    .forEach(t => {
      t.dono = uid;
      S.db.merge(P() + "/tokens/" + t.id, { dono: uid }).catch(() => {});
    });
}
/* Dar o personagem para um jogador ou tirar dele (volta a ser NPC do mestre). Os tokens acompanham. */
async function darFicha(id) {
  if (toqueDuplo("darFicha")) return; // evita rodar duas vezes num toque duplo
  const f = S.fichas[id];
  if (!f || !S.isM) return;
  const mestre = S.mesa && S.mesa.mestre;
  const atual = f.npc ? "" : f.dono === mestre ? "" : f.dono;
  const ops = opcoesJogadores([]);
  const r = await formBox(
    `Com quem fica ${f.nome}?`,
    `<p class="muted small" style="margin:0">Quem recebe passa a ver a ficha nos agentes dele, editar e mover o token. Ao tirar, a ficha volta a ser um NPC seu, escondido, e o jogador perde o token.</p>
   <div class="field"><label class="label" for="dfQ">Fica com</label><select id="dfQ" name="quem"><option value="">Ninguém: volta a ser NPC do mestre</option>${ops.map(([u, n]) => `<option value="${esc(u)}" ${u === atual ? "selected" : ""}>${esc(n)}</option>`).join("")}</select></div>
   ${ops.length ? "" : `<p class="muted small" style="margin:0">Nenhum jogador entrou na mesa ainda.</p>`}`,
    "Confirmar"
  );
  if (!r) return;
  const uid = r.quem || "";
  try {
    if (!uid) {
      // tirar do jogador
      if (f.npc) {
        tokensDono(id, S.uid);
        toast(`${f.nome} já está com você.`);
        return;
      }
      const dados = JSON.parse(JSON.stringify(f));
      Object.assign(dados, { npc: true, visivel: false, dono: S.uid, donoAntes: f.dono || S.uid });
      delete dados.solo;
      await S.db.set(P() + "/npcs/" + id, dados);
      await S.db.del(P() + "/fichas/" + id);
      S.fichas[id] = dados;
      tokensDono(id, S.uid);
      toast(`${f.nome} saiu do jogador e voltou a ser NPC (escondido).`);
    } else if (f.npc) {
      const { npc, visivel, pasta, donoAntes, ...dados } = JSON.parse(JSON.stringify(f));
      dados.dono = uid;
      await S.db.set(P() + "/fichas/" + id, dados);
      await S.db.del(P() + "/npcs/" + id);
      S.fichas[id] = dados;
      tokensDono(id, uid);
      toast(`${f.nome} agora está com ${nomeMembro(uid)}.`);
    } else {
      f.dono = uid;
      await S.db.merge(P() + "/fichas/" + id, { dono: uid });
      tokensDono(id, uid);
      toast(`${f.nome} agora está com ${nomeMembro(uid)}.`);
    }
    S.openFicha = id;
    renderPanel();
    renderBoard();
  } catch (e) {
    fail(e);
  }
}
/* Menu "Opções" no topo da ficha: duplicar, dar a um jogador, retirar da mesa,
   virar NPC / voltar a ser agente. Desenhado por sheetHTML e npcRapidoHTML. */
function fichaAcoes(f) {
  if (!f || S.solo) return [];
  const L = []; // [id do botão, texto, ação]
  if (f.npc && S.isM && !f.rapido) L.push(["qDupFull", "Duplicar NPC", npcDuplicar]);

      "btnDarFicha",
      f.npc || f.dono === (S.mesa && S.mesa.mestre) ? "Dar a um jogador" : "Dar / tirar do jogador",
      darFicha
    ]);
  if (f.npc) {
    if (!S.isM) return [];
    L.push(["btnRetirar", "Retirar da mesa", retirarFicha]);
    if (!f.rapido) L.push(["btnVirarAg", "Voltar a ser agente", virarAgente]);
  } else {
    if (f.rapido) return [];
    if (canEditFicha(f)) L.push(["btnRetirar", "Retirar da mesa", retirarFicha]);
    if (S.isM) L.push(["btnVirarNpc", "Transformar em NPC", virarNpc]);
  }
  return L;
}

/* ---------- limpar repetidos ---------- */
function gruposRepetidos(lista, chave) {
  const g = {};
  lista.forEach(x => {
    const k = chave(x);
    if (k) (g[k] = g[k] || []).push(x);
  });
  return Object.values(g).filter(a => a.length > 1);
}
async function juntarSolos() {
  if (toqueDuplo("juntarSolos")) return; // evita rodar duas vezes num toque duplo
  const G = gruposRepetidos(S.solos || [], c => (c.nome || "").trim().toLowerCase());
  const n = G.reduce((t, a) => t + a.length - 1, 0);
  if (!n) return;
  if (
    !(await confirmBox(
      `Apagar ${n} cópia(s) repetida(s)?`,
      `Fica só a versão mais recente de cada personagem (${G.map(a => a[0].nome).join(", ")}). As fichas que já estão em mesas não mudam.`,
      "Apagar repetidos"
    ))
  )
    return;
  try {
    for (const a of G) {
      a.sort((x, y) => (y.atualizada || y.criada || 0) - (x.atualizada || x.criada || 0));
      for (const c of a.slice(1)) await S.db.del("usuarios/" + S.uid + "/personagens/" + c.id);
    }
    toast("Pronto, sem repetidos.");
  } catch (e) {
    fail(e);
  }
}
function repetidosMesa() {
  const L = Object.entries(S.fichas)
    .map(([id, f]) => ({ ...f, id }))
    .filter(f => !f.npc && !f.solo && (S.isM || f.dono === S.uid));
  return gruposRepetidos(L, f => (f.nome && f.nome.trim() ? f.dono + "|" + f.nome.trim().toLowerCase() : ""));
}
async function tirarRepetidosMesa() {
  if (toqueDuplo("tirarRepetidosMesa")) return; // evita rodar duas vezes num toque duplo
  const G = repetidosMesa();
  const n = G.reduce((t, a) => t + a.length - 1, 0);
  if (!n) return;
  if (
    !(await confirmBox(
      `Tirar ${n} ficha(s) repetida(s) da mesa?`,
      `Fica uma ficha de cada (${G.map(a => a[0].nome).join(", ")}): a que já tem token no mapa ou, se nenhuma tiver, a mais antiga.`,
      "Tirar repetidos"
    ))
  )
    return;
  try {
    for (const a of G) {
      const tk = f => (S.tokens.some(t => t.fichaId === f.id) ? 1 : 0);
      a.sort((x, y) => tk(y) - tk(x) || (x.criada || 0) - (y.criada || 0));
      for (const f of a.slice(1)) {
        await S.db.del(fichaPath(f.id));
        delete S.fichas[f.id];
      }
    }
    S.openFicha = null;
    renderPanel();
    renderBoard();
    toast("Pronto, sem fichas repetidas.");
  } catch (e) {
    fail(e);
  }
}
/* Botão "Tirar fichas repetidas" na lista de Agentes (só aparece se houver repetidas). */
function repetidosBotaoHTML() {
  const n = repetidosMesa().reduce((t, a) => t + a.length - 1, 0);
  return n
    ? `<button class="btn block ghost" id="btnRepMesa" style="margin-top:6px;border-color:var(--red)">Tirar fichas repetidas (${n})</button>`
    : "";
}
</script>
<script>
"use strict";
/* Locais escondidos do mapa (salas pretas até o mestre revelar). */
/* =====================================================================
   LOCAIS ESCONDIDOS
   No criador de mapas o mestre marca salas/áreas. Na cena elas ficam
   pretas para os jogadores até o mestre revelar (painel "Locais").
   Mapa: M.ocultos=[{id,nome,r:[x,y,w,h,...]}]  (em quadrados)
   Cena: sc.locais=[{id,nome,aberto,r:[x,y,w,h,...]}] (em pixels)
   (listas planas: o Firestore não aceita lista dentro de lista)
   ===================================================================== */
const OC_ICO =
  "M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6 0 10 7 10 7a17 17 0 0 1-3.2 3.9M6.6 6.6A17 17 0 0 0 2 12s4 7 10 7a9.6 9.6 0 0 0 5.4-1.6";
{
  const i = ME_TOOLS.findIndex(t => t[0] === "borr");
  ME_TOOLS.splice(i < 0 ? ME_TOOLS.length : i, 0, ["ocultar", "Esconder local", "X", OC_ICO]);
}

/* ---------- geometria ---------- */
function ocRects(r) {
  const L = [];
  for (let i = 0; i + 3 < (r || []).length; i += 4) L.push([r[i], r[i + 1], r[i + 2], r[i + 3]]);
  return L;
}
function ocCells(a) {
  const s = new Set();
  ocRects(a.r).forEach(([x, y, w, h]) => {
    for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) s.add(i + "," + j);
  });
  return s;
}
function ocDeCells(set) {
  // junta as células em retângulos (faixas por linha, depois empilha as iguais)
  const rows = {};
  set.forEach(k => {
    const [x, y] = k.split(",").map(Number);
    (rows[y] = rows[y] || []).push(x);
  });
  const runs = [];
  Object.keys(rows)
    .map(Number)
    .sort((a, b) => a - b)
    .forEach(y => {
      const xs = rows[y].sort((a, b) => a - b);
      let s = xs[0],
        p = xs[0];
      for (let i = 1; i <= xs.length; i++) {
        if (i < xs.length && xs[i] === p + 1) {
          p = xs[i];
          continue;
        }
        runs.push({ x: s, y, w: p - s + 1, h: 1 });
        if (i < xs.length) {
          s = p = xs[i];
        }
      }
    });
  const out = [];
  runs.forEach(r => {
    const up = out.find(o => o.x === r.x && o.w === r.w && o.y + o.h === r.y);
    if (up) up.h++;
    else out.push({ ...r });
  });
  return out.flatMap(o => [o.x, o.y, o.w, o.h]);
}
function ocAreaEm(cx, cy) {
  return (ME.M.ocultos || []).find(a => ocCells(a).has(cx + "," + cy));
}
function ocFlood(x, y) {
  const M = ME.M;
  if (x < 0 || y < 0 || x >= M.w || y >= M.h || M.chao[y * M.w + x] === ".") return null;
  meFlushEdges();
  const vis = new Set(),
    st = [[x, y]];
  while (st.length && vis.size < 4000) {
    const [cx, cy] = st.pop();
    const k = cx + "," + cy;
    if (vis.has(k) || cx < 0 || cy < 0 || cx >= M.w || cy >= M.h) continue;
    if (M.chao[cy * M.w + cx] === ".") continue;
    vis.add(k);
    if (!ME.edges.has(`v,${cx + 1},${cy}`)) st.push([cx + 1, cy]);
    if (!ME.edges.has(`v,${cx},${cy}`)) st.push([cx - 1, cy]);
    if (!ME.edges.has(`h,${cx},${cy + 1}`)) st.push([cx, cy + 1]);
    if (!ME.edges.has(`h,${cx},${cy}`)) st.push([cx, cy - 1]);
  }
  return vis;
}
function ocNomeDe(set) {
  const t = (ME.M.textos || []).find(
    t =>
      set.has(Math.floor(t.x) + "," + Math.floor(t.y)) ||
      set.has(Math.floor(t.x - 0.01) + "," + Math.floor(t.y - 0.01))
  );
  return t ? t.t : "Local " + ((ME.M.ocultos || []).length + 1);
}
function ocAdd(set, nome) {
  if (!set || !set.size) return;
  mePush();
  const M = ME.M;
  M.ocultos = M.ocultos || [];
  // uma célula só pertence a um local: tira das áreas antigas
  M.ocultos.forEach(a => {
    const c = ocCells(a);
    let mud = false;
    set.forEach(k => {
      if (c.delete(k)) mud = true;
    });
    if (mud) a.r = ocDeCells(c);
  });
  M.ocultos = M.ocultos.filter(a => a.r.length);
  M.ocultos.push({ id: "l" + rid(6), nome: nome || ocNomeDe(set), r: ocDeCells(set) });
  meSide();
  meDraw();
}
function ocTodasComNome() {
  const M = ME.M;
  const floor = [...M.chao].filter(c => c !== ".").length;
  let n = 0,
    pul = [];
  const ja = new Set();
  (M.ocultos || []).forEach(a => ocCells(a).forEach(k => ja.add(k)));
  const novos = [];
  for (const t of M.textos || []) {
    const set =
      ocFlood(Math.floor(t.x), Math.floor(t.y)) || ocFlood(Math.floor(t.x - 0.01), Math.floor(t.y - 0.01));
    if (!set || [...set].some(k => ja.has(k))) continue;
    if (set.size > floor * 0.6) {
      pul.push(t.t);
      continue;
    }
    set.forEach(k => ja.add(k));
    novos.push({ id: "l" + rid(6), nome: t.t, r: ocDeCells(set) });
    n++;
  }
  if (!novos.length) {
    toast(
      pul.length
        ? "As salas com nome não têm paredes fechando. Marque arrastando um retângulo."
        : "Nenhuma sala com nome nova para esconder."
    );
    return;
  }
  mePush();
  M.ocultos = [...(M.ocultos || []), ...novos];
  meSide();
  meDraw();
  toast(
    `${n} sala(s) marcada(s) para ficar escondida(s).` +
      (pul.length ? ` Não deu em: ${pul.join(", ")} (sem parede fechando).` : "")
  );
}
async function ocEditar(a) {
  const r = await formBox(
    "Local escondido",
    `<div class="field"><label class="label" for="ocN">Nome (só o mestre vê)</label><input type="text" id="ocN" name="nome" maxlength="40" value="${esc(a.nome)}"></div>
  <label class="check"><input type="checkbox" name="tirar"> Não esconder mais este local</label>`,
    "Salvar"
  );
  if (!r) return;
  mePush();
  if (r.tirar) ME.M.ocultos = ME.M.ocultos.filter(x => x !== a);
  else a.nome = r.nome.trim() || a.nome;
  meSide();
  meDraw();
}

/* ---------- editor: desenho, entrada, painel ---------- */
/* Editor de mapa: desenha os locais escondidos por cima do mapa. */
function ocDesenharNoEditor() {
  const cv = $("#meCv");
  if (!cv || !ME.M) return;
  const L = ME.M.ocultos || [];
  const D = ME.drag;
  if (!L.length && !(D && D.kind === "ocultar")) return;
  const g = cv.getContext("2d"),
    dpr = window.devicePixelRatio || 1;
  g.save();
  g.setTransform(dpr * ME.z, 0, 0, dpr * ME.z, dpr * ME.ox, dpr * ME.oy);
  const on = ME.tool === "ocultar";
  L.forEach(a => {
    const R = ocRects(a.r);
    g.fillStyle = on ? "rgba(6,4,10,.72)" : "rgba(6,4,10,.38)";
    R.forEach(([x, y, w, h]) => g.fillRect(x * ES, y * ES, w * ES, h * ES));
    if (on) {
      g.strokeStyle = "rgba(211,40,59,.9)";
      g.lineWidth = 2 / ME.z;
      g.setLineDash([8 / ME.z, 5 / ME.z]);
      R.forEach(([x, y, w, h]) => g.strokeRect(x * ES, y * ES, w * ES, h * ES));
      g.setLineDash([]);
    }
    const b = R.reduce((m, [x, y, w, h]) => (w * h > m[2] * m[3] ? [x, y, w, h] : m), [0, 0, 0, 0]);
    const fs = Math.max(11, Math.min(22, ES * 0.42));
    g.font = `700 ${fs}px Inter,sans-serif`;
    g.textAlign = "center";
    g.textBaseline = "middle";
    const tx = (b[0] + b[2] / 2) * ES,
      ty = (b[1] + b[3] / 2) * ES;
    g.fillStyle = "rgba(0,0,0,.6)";
    const tw = g.measureText("◼ " + a.nome).width + 14;
    g.fillRect(tx - tw / 2, ty - fs * 0.8, tw, fs * 1.6);
    g.fillStyle = on ? "#ff8090" : "rgba(255,255,255,.75)";
    g.fillText("◼ " + a.nome, tx, ty);
  });
  if (D && D.kind === "ocultar") {
    const [x0, y0, x1, y1] = meRect(D);
    g.fillStyle = "rgba(211,40,59,.22)";
    g.fillRect(x0 * ES, y0 * ES, (x1 - x0 + 1) * ES, (y1 - y0 + 1) * ES);
    g.strokeStyle = "#d3283b";
    g.lineWidth = 3 / ME.z;
    g.strokeRect(x0 * ES, y0 * ES, (x1 - x0 + 1) * ES, (y1 - y0 + 1) * ES);
  } else if (on && ME.hover) {
    const x = Math.floor(ME.hover.x),
      y = Math.floor(ME.hover.y);
    g.strokeStyle = "#d3283b";
    g.lineWidth = 2 / ME.z;
    g.strokeRect(x * ES, y * ES, ES, ES);
  }
  g.restore();
}
/* Editor de mapa: ferramenta "Esconder local" (clique numa sala ou arraste um retângulo). */
function ocApertar(e) {
  if (ME.tool === "ocultar" && !ME.drag && e.button === 0 && e.isPrimary && !ME.space) {
    const m = meMap(e);
    const cx = Math.floor(m.x),
      cy = Math.floor(m.y);
    ME.drag = { kind: "ocultar", cx0: cx, cy0: cy, cx1: cx, cy1: cy };
    meDraw();
  }
}
function ocMover(e) {
  const D = ME.drag;
  if (D && D.kind === "ocultar") {
    const m = meMap(e);
    D.cx1 = Math.max(0, Math.min(ME.M.w - 1, Math.floor(m.x)));
    D.cy1 = Math.max(0, Math.min(ME.M.h - 1, Math.floor(m.y)));
    meDraw();
  }
}
function ocSoltar(e, D) {
  if (!D || D.kind !== "ocultar" || e.type === "pointercancel") return;
  const [x0, y0, x1, y1] = meRect(D);
  if (x0 === x1 && y0 === y1) {
    const a = ocAreaEm(x0, y0);
    if (a) {
      ocEditar(a);
      return;
    }
    const set = ocFlood(x0, y0);
    if (!set) {
      toast("Clique dentro de uma sala (num quadrado com piso) ou arraste um retângulo.");
      return;
    }
    const floor = [...ME.M.chao].filter(c => c !== ".").length;
    if (set.size > floor * 0.6 && floor > 40) {
      toast(
        "Essa sala não tem parede fechando e pegaria o mapa quase todo. Arraste um retângulo em volta dela."
      );
      return;
    }
    ocAdd(set);
    return;
  }
  const set = new Set();
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) set.add(x + "," + y);
  ocAdd(set, ocNomeDe(set));
}
/* Painel lateral do editor quando a ferramenta é "Esconder local". */
function ocSide() {
  const el = $("#meSide");
  if (!el) return;
  const L = ME.M.ocultos || [];
  el.innerHTML = `<div class="stack" style="gap:8px"><p class="muted small" style="margin:0">Locais marcados aqui ficam <b>pretos para os jogadores</b> quando o mapa vira cena. Na mesa, você revela cada um pelo botão <b>Locais</b> da barrinha do mapa.</p>
 <button class="btn sm" id="ocTodas">Esconder todas as salas com nome</button>
 <div class="sub">Locais escondidos (${L.length})</div>
 ${L.length ? L.map((a, i) => `<div class="row" style="gap:6px;flex-wrap:nowrap"><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">◼ ${esc(a.nome)}</span><button class="btn sm ghost" data-ocren="${i}">Renomear</button><button class="btn sm ghost" data-ocdel="${i}" aria-label="Não esconder ${esc(a.nome)}">✕</button></div>`).join("") : `<p class="muted small" style="margin:0">Nenhum ainda.</p>`}
 ${L.length ? `<button class="btn sm ghost" id="ocLimpar">Não esconder nenhum</button>` : ""}</div>`;
  $("#ocTodas").onclick = ocTodasComNome;
  const lp = $("#ocLimpar");
  if (lp)
    lp.onclick = () => {
      mePush();
      ME.M.ocultos = [];
      meSide();
      meDraw();
    };
  $$("[data-ocren]", el).forEach(b => (b.onclick = () => ocEditar(L[+b.dataset.ocren])));
  $$("[data-ocdel]", el).forEach(
    b =>
      (b.onclick = () => {
        mePush();
        ME.M.ocultos = L.filter((_, i) => i !== +b.dataset.ocdel);
        meSide();
        meDraw();
      })
  );
}
/* Depois de mudar o tamanho do mapa: corta os locais escondidos que ficaram de fora. */
function ocAjustarAoTamanho() {
  const M = ME.M;
  if (!M.ocultos) return;
  M.ocultos.forEach(a => {
    const c = new Set(
      [...ocCells(a)].filter(k => {
        const [x, y] = k.split(",").map(Number);
        return x < M.w && y < M.h;
      })
    );
    a.r = ocDeCells(c);
  });
  M.ocultos = M.ocultos.filter(a => a.r.length);
  meDraw();
}

/* ---------- virar cena: leva os locais em pixels ---------- */
/* Ao usar o mapa como cena: os locais escondidos do editor viram locais da cena. */
async function ocSalvarNaCena(antes) {
  const M = ME.M;
  if (!M || !M.cenaId) return;
  const sid = M.cenaId;
  try {
    const sc = await S.db.get(P() + "/cenas/" + sid);
    if (!sc || !sc.tam) return;
    const k = sc.tam;
    const velhos = {};
    (sc.locais || []).forEach(l => (velhos[l.id] = l));
    const locais = (M.ocultos || []).map(a => ({
      id: a.id,
      nome: a.nome,
      aberto: velhos[a.id] ? !!velhos[a.id].aberto : false,
      r: a.r.map(v => Math.round(v * k))
    }));
    if (!locais.length && !(sc.locais || []).length) return;
    await S.db.merge(P() + "/cenas/" + sid, { locais });
    const c = S.cenas.find(x => x.id === sid);
    if (c) c.locais = locais;
    if (locais.length && !antes)
      toast(`Cena criada com ${locais.length} local(is) escondido(s). Revele pelo botão Locais no mapa.`);
  } catch (e) {
    fail(e);
  }
}

/* ---------- na mesa ---------- */
function locaisFechados() {
  const sc = curScene();
  return ((sc && sc.locais) || []).filter(l => !l.aberto);
}
function localFechadoEm(x, y) {
  return locaisFechados().some(l =>
    ocRects(l.r).some(([a, b, w, h]) => x >= a && x <= a + w && y >= b && y <= b + h)
  );
}
/* Mesa: pinta de preto os locais escondidos (o mestre vê meio transparente, com o nome). */
function fogLocais() {
  const c = $("#fogC");
  if (!c) return;
  const L = locaisFechados();
  if (!L.length) return;
  const g = c.getContext("2d");
  if (c.hidden) {
    g.clearRect(0, 0, c.width, c.height);
    c.hidden = false;
  }
  c.style.opacity = S.isM ? 0.55 : 1;
  g.globalCompositeOperation = "source-over";
  L.forEach(l => {
    const R = ocRects(l.r);
    g.fillStyle = "#07050a";
    R.forEach(([x, y, w, h]) => g.fillRect(x, y, w, h));
    if (S.isM) {
      const b = R.reduce((m, r) => (r[2] * r[3] > m[2] * m[3] ? r : m), [0, 0, 0, 0]);
      const fs = Math.max(14, Math.min(34, b[3] / 6));
      g.font = `700 ${fs}px Inter,sans-serif`;
      g.textAlign = "center";
      g.textBaseline = "middle";
      g.fillStyle = "#ff8090";
      g.fillText("◼ " + l.nome + " (escondido)", b[0] + b[2] / 2, b[1] + b[3] / 2);
    }
  });
}

<script>

/* Capa da mesa (lobby e tela de entrada). */
/* =====================================================================
   CAPA DA MESA: o mestre sobe uma imagem; ela aparece no cartão da mesa

   (todo mundo logado lê a porta).

S.capas = S.capas || {};
async function comprimirCapa(file) {
  const im = await loadImg(file);
  let w = 1280;
  for (let t = 0; t < 6; t++) {
    const k = Math.min(1, w / im.naturalWidth);
    const c = drawTo(im, im.naturalWidth * k, im.naturalHeight * k);
    for (const q of [0.8, 0.7, 0.6, 0.5]) {
      const u = c.toDataURL("image/jpeg", q);
      if (u.length <= 230000) return u;
    }
    w = Math.round(w * 0.8);
  }
  throw new Error("grande");
}
async function capaAtual(id, forcar) {
  if (!forcar && id in S.capas) return S.capas[id];
  try {
    const p = await S.db.get("portas/" + id);

/* nome da ferramenta ao passar o mouse na barra lateral */
(() => {
  const tip = document.createElement("div");
  tip.id = "railTip";
  tip.setAttribute("aria-hidden", "true");
  document.body.appendChild(tip);
  const show = b => {
    const n = b.getAttribute("aria-label") || b.title;

    tip.textContent = n;
    tip.style.left = r.right + 8 + "px";
    tip.style.top = r.top + r.height / 2 + "px";
    tip.classList.add("on");

<script>
"use strict";
/* Versão do site e aviso de versão nova. */
// prettier-ignore
// (sem espaços de propósito: versões antigas do site procuram exatamente este formato)
const VERSAO_SITE="12/11 20h4120";
/* Avisa quando sai uma versão nova do site (o navegador às vezes guarda a antiga) */
(() => {
  let avisou = false;
  async function checar() {
    if (avisou || location.protocol === "file:") return;
    try {
      const r = await fetch(location.pathname + "?v=" + Date.now(), { cache: "no-store" });
      if (!r.ok) return;
      const t = await r.text();
      const m = t.match(/const VERSAO_SITE\s*=\s*"([^"]+)"/);
      if (!m || m[1] === VERSAO_SITE) return;
      avisou = true;
      const b = document.createElement("div");
      b.id = "novaVersao";
      b.setAttribute("role", "status");
      b.innerHTML = `<span>Saiu uma versão nova do site.</span><button class="btn sm primary" id="nvRec">Atualizar agora</button><button class="btn sm ghost" id="nvX" aria-label="Fechar">✕</button>`;
      document.body.appendChild(b);
      $("#nvRec").onclick = () => {
        for (const id in S.dirty)
          if (S.dirty[id])
            try {
              saveFicha(id, true);
            } catch (e) {}
        setTimeout(() => location.replace(location.pathname + "?v=" + Date.now() + location.hash), 600);
      };
      $("#nvX").onclick = () => b.remove();
    } catch (e) {}
  }
  setTimeout(checar, 4000);
  setInterval(checar, 3 * 60 * 1000);
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) checar();
  });
})();
</script>

<script>
"use strict";
/* Documentos postos no mapa. */
/* =====================================================================
   DOCUMENTOS NO MAPA: o mestre prende um documento na cena; quem vê a
   cena toca nele e lê (só a versão com tarjas, nunca o original).
   Fica em estado/<id> com tipo "mapdoc" (todos da mesa leem, só o mestre escreve).
   ===================================================================== */
S.mapDocs = [];
function subscribeMapDocs() {
  if (S.mapDocsUnsub) return;
  S.mapDocsUnsub = S.db.listenCol(
    P() + "/estado",
    { where: ["tipo", "mapdoc"] },
    l => {
      const antes = S.mapDocRev || {};
      l.forEach(m => {
        if (antes[m.id] !== undefined && antes[m.id] !== (m.rev || 0) && S.docAberto === m.id) abrirMapDoc(m);
      });
      S.mapDocRev = Object.fromEntries(l.map(m => [m.id, m.rev || 0]));
      S.mapDocs = l;
      renderNomes();
      if (S.tool === "documentos" && S.isM && !isEditing()) renderPanel();
    },
    () => {}
  );
}
function pararMapDocs() {
  if (S.mapDocsUnsub) {
    try {
      S.mapDocsUnsub();
    } catch (e) {}
    S.mapDocsUnsub = null;
  }
  S.mapDocs = [];
}
function abrirMapDoc(m) {
  abrirDoc({ id: m.id, titulo: m.nome, doc: m.doc, quem: "Mestre", para: "todos" });
  if (S.isM) {
    const top = $(".docview .row.between");
    if (top && !$("#mdTirar"))
      top.insertAdjacentHTML("beforeend", `<button class="btn sm ghost" id="mdTirar">Tirar do mapa</button>`);
    const b = $("#mdTirar");
    if (b)
      b.onclick = () => {
        $("#modalHost").innerHTML = "";
        S.docAberto = null;
        tirarMapDoc(m);
      };
  }
}
async function tirarMapDoc(m) {
  try {
    await S.db.del(P() + "/estado/" + m.id);
    toast(`"${m.nome}" saiu do mapa.`);
  } catch (e) {
    fail(e);
  }
}
async function porNoMapa(d) {
  if (toqueDuplo("porNoMapa")) return; // evita rodar duas vezes num toque duplo
  if (!d) return;
  const sc = curScene();
  if (!sc || !S.viewSid) {
    toast("Abra uma cena no mapa primeiro: o documento vai para a cena que está na tela.");
    return;
  }
  const r = board.getBoundingClientRect();
  const x = Math.round((r.width / 2 - V.x) / V.z),
    y = Math.round((r.height / 2 - V.y) / V.z);
  const doc = docSnapshot(d);
  try {
    await S.db.set(P() + "/estado/md" + rid(8), {

  } catch (e) {
    fail(e);
  }
}

/* Documentos postos no mapa: ícone clicável (o mestre arrasta para mudar de lugar). */
function renderMapDocs(el) {
  const L = (S.mapDocs || []).filter(m => m.cena === S.viewSid && (S.isM || !hiddenAt(m.x, m.y)));
  el.insertAdjacentHTML(
    "beforeend",
    L.map(
      m =>
        `<button class="mdoc ${S.isM && hiddenAt(m.x, m.y) ? "dim" : ""}" data-mdoc="${esc(m.id)}" style="left:${m.x}px;top:${m.y}px" aria-label="Ler documento: ${esc(m.nome)}" title="${esc(m.nome)}"><span class="mdi"></span><span class="mdn">${esc(m.nome)}</span></button>`
    ).join("")
  );
  $$("[data-mdoc]", el).forEach(b => {
    const m = (S.mapDocs || []).find(x => x.id === b.dataset.mdoc);
    if (!m) return;
    b.onpointerdown = e => {
      e.stopPropagation();
      if (!S.isM) return;
      e.preventDefault();
      const st = { x: e.clientX, y: e.clientY, mx: m.x, my: m.y };
      let moved = false;
      try {
        b.setPointerCapture(e.pointerId);
      } catch (_) {}
      b.onpointermove = ev => {
        const dx = (ev.clientX - st.x) / V.z,
          dy = (ev.clientY - st.y) / V.z;
        if (!moved && Math.hypot(dx, dy) * V.z < 5) return;
        moved = true;
        m.x = Math.round(st.mx + dx);
        m.y = Math.round(st.my + dy);
        b.style.left = m.x + "px";
        b.style.top = m.y + "px";
      };
      b.onpointerup = async () => {
        b.onpointermove = null;
        b.onpointerup = null;
        if (moved) {
          try {
            await S.db.merge(P() + "/estado/" + m.id, { x: m.x, y: m.y });
          } catch (err) {
            fail(err);
          }
        } else abrirMapDoc(m);
      };
    };
    b.onclick = e => {
      e.stopPropagation();
      if (!S.isM) abrirMapDoc(m);
    };
    b.onkeydown = e => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        abrirMapDoc(m);
      }
    };
  });
}

/* Texto do botão "Pôr no mapa" de um documento da biblioteca. */
function docNoMapaRotulo(docId) {
  const n = (S.mapDocs || []).filter(x => x.docId === docId).length;
  return n ? `No mapa (${n}) · pôr outro` : "Pôr no mapa";
}
/* Mestre: lista dos documentos que estão no mapa, para tirar. */
function docsNoMapaHTML() {
  const L = S.mapDocs || [];
  if (!L.length) return "";
  const nomeCena = c => {
    const s = (S.cenas || []).find(x => x.id === c);

  };
  return `<div class="sub" style="margin-top:14px">Documentos no mapa (${L.length})</div><p class="muted small" style="margin:0">Quem vê a cena toca no documento e lê. Arraste no mapa para mudar de lugar.</p>
 <div class="stack" style="gap:6px">${L.map(m => `<div class="row" style="gap:6px;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;padding:8px 10px"><div style="flex:1;min-width:160px"><b>${esc(m.nome)}</b><div class="muted small">Na cena: ${esc(nomeCena(m.cena))}</div></div><button class="btn sm ghost" data-mdtir="${esc(m.id)}">Tirar do mapa</button></div>`).join("")}</div>`;
}
function bindDocsMapa() {
  $$("[data-dmapa]").forEach(
    b => (b.onclick = () => porNoMapa((S.docs || []).find(d => d.id === b.dataset.dmapa)))
  );
  $$("[data-mdtir]").forEach(
    b =>
      (b.onclick = () => {
        const m = (S.mapDocs || []).find(x => x.id === b.dataset.mdtir);
        if (m) tirarMapDoc(m);
      })
  );
}

<script>
"use strict";
/* Tokens: não redesenhar durante o arrasto e foto de NPC no token. */
/* Enquanto alguém arrasta um token, nada redesenha o mapa por baixo do dedo (isso fazia o arrastar
   "falhar" no celular quando chegava alguma atualização da mesa); redesenha logo que solta. */
window.addEventListener(
  "pointerup",
  () => {
    if (S.dragging) {
      S.dragging = false;
      setTimeout(() => {
        if (S.boardPend) renderBoard();
      }, 0);
    }
  },
  true
);
window.addEventListener(
  "pointercancel",
  () => {
    if (S.dragging) {
      S.dragging = false;
      setTimeout(() => renderBoard(), 0);
    }
  },
  true
);
/* Foto de NPC no token: os jogadores não leem a ficha de um NPC escondido, então o token guarda
   uma cópia da foto (fotoNpc). Só o mestre grava; todos usam quando não conseguem ler a ficha. */
function syncFotoNpc() {
  if (!S.isM || !S.mesaId) return;
  for (const t of S.tokens || []) {
    if (!t.fichaId) continue;
    const f = S.fichas[t.fichaId];
    if (!f || !f.npc) continue;
    if (t.dono !== S.uid) {
      t.dono = S.uid;
      S.db.merge(P() + "/tokens/" + t.id, { dono: S.uid }).catch(() => {});
    }
    let foto = tokUrlMestre(t) || null;
    if (foto === (t.url || null)) foto = null; // se é a imagem do próprio token, todos já veem
    if ((t.fotoNpc || null) === foto) continue;
    if (foto && foto.length > 900000) continue; // grande demais para caber no token
    t.fotoNpc = foto;
    S.db.merge(P() + "/tokens/" + t.id, { fotoNpc: foto }).catch(() => {});
  }
}
let syncFotoNpcTm = null;
function agendarSyncFotoNpc() {
  clearTimeout(syncFotoNpcTm);
  syncFotoNpcTm = setTimeout(syncFotoNpc, 900);
}

<script>
"use strict";
/* Portas que abrem, portas trancadas e passagens entre cenas. */
/* =====================================================================
   PORTAS QUE ABREM E ANDARES LIGADOS
   Portas: ao virar cena, as portas do criador de mapas saem da imagem e
   viram peças na mesa. O mestre toca para abrir/fechar; abrir revela os
   locais escondidos dos dois lados.
     cena.portas = [{id,o,x,y,len,th,t,cor,aberta,trancada,locais:[ids]}]  (pixels)
   Porta trancada: o mestre segura o dedo (ou clica com o botão direito)
   numa porta fechada para trancar; ao tocar numa trancada, destranca.
   A "Porta trancada" do criador de mapas já entra trancada.
   Andares: o mestre põe passagens (escada, elevador...) que levam o grupo
   para outra cena, com os tokens dos agentes.
     cena.passagens = [{id,x,y,alvo,nome}]  (pixels)
   ===================================================================== */
const PORTA_TIPOS = ["porta", "portat", "portam", "portad", "portaf", "portao", "secreta"];

/* ---------- do mapa para a cena ---------- */
// Tira as portas da imagem e devolve a lista delas (em quadrados), juntando portas duplas e portões largos.
function portasDoMapa(M) {
  const ficam = [];
  const achadas = [];
  (M.paredes || []).forEach(s => {
    const [o, x, y, ...resto] = s.split(",");
    const v = resto.join(",");
    const m = v.match(/^a:([^:]+):(.*)$/);
    if (m && PORTA_TIPOS.includes(m[1])) achadas.push({ o, x: +x, y: +y, t: m[1], st: m[2] || "ordem" });
    else ficam.push(s);
  });
  achadas.sort(
    (a, b) =>
      (a.o + (a.o === "h" ? a.y : a.x)).localeCompare(b.o + (b.o === "h" ? b.y : b.x)) ||
      (a.o === "h" ? a.x - b.x : a.y - b.y)
  );
  const lista = [];
  achadas.forEach(p => {
    const u = lista[lista.length - 1];
    const ao = p.o === "h" ? p.x : p.y;
    if (
      u &&
      u.o === p.o &&
      u.t === p.t &&
      (p.o === "h" ? u.y === p.y : u.x === p.x) &&
      (p.o === "h" ? u.x : u.y) + u.n === ao
    )
      u.n++;
    else lista.push({ ...p, n: 1 });
  });
  // locais escondidos dos dois lados de cada porta
  const locais = (M.ocultos || []).map(a => ({ id: a.id, cel: ocCells(a) }));
  lista.forEach(p => {
    const lados = [];
    for (let i = 0; i < p.n; i++) {
      if (p.o === "h") lados.push([p.x + i, p.y - 1], [p.x + i, p.y]);
      else lados.push([p.x - 1, p.y + i], [p.x, p.y + i]);
    }
    p.locais = locais.filter(l => lados.some(([cx, cy]) => l.cel.has(cx + "," + cy))).map(l => l.id);
  });
  return { paredes: ficam, lista };
}
function portasEmPixels(lista, k, velhas) {
  const ab = {};
  (velhas || []).forEach(p => (ab[p.id] = p));
  return lista.map(p => {
    const P = (typeof MA_PAREDES !== "undefined" && MA_PAREDES.find(w => w.id === p.st)) || {
      t: 0.3,
      cor: "#151518"
    };
    const id = `${p.o},${p.x},${p.y}`;
    return {
      id,
      o: p.o,
      x: Math.round(p.x * k),
      y: Math.round(p.y * k),
      len: Math.round(p.n * k),
      th: Math.max(6, Math.round((P.t || 0.3) * k)),
      t: p.t === "portat" ? "porta" : p.t,
      cor: P.cor || "#151518",
      aberta: !!(ab[id] && ab[id].aberta),
      trancada: ab[id] ? !!ab[id].trancada : p.t === "portat",
      locais: p.locais
    };
  });
}

/* ---------- na mesa: portas ---------- */
function portaEscondida(p) {
  if (S.isM) return false;
  const k = p.th;
  const mx = p.o === "h" ? p.x + p.len / 2 : p.x;
  const my = p.o === "h" ? p.y : p.y + p.len / 2;
  const a = p.o === "h" ? [mx, my - k] : [mx - k, my];
  const b = p.o === "h" ? [mx, my + k] : [mx + k, my];
  return hiddenAt(a[0], a[1]) && hiddenAt(b[0], b[1]);
}
const CADEADO_ICO =
  '<svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M7 10V7a5 5 0 0 1 10 0v3h1a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1zm2 0h6V7a3 3 0 0 0-6 0z"/></svg>';
function renderPortas() {
  const el = $("#portasL");
  if (!el) return;
  const sc = curScene();
  const L = (sc && sc.portas) || [];
  el.innerHTML = L.map((p, i) => {
    if (portaEscondida(p)) return "";
    if (p.t === "secreta" && !S.isM && !p.aberta) return ""; // os jogadores só veem parede
    const box =
      p.o === "h"
        ? `left:${p.x}px;top:${p.y - p.th / 2}px;width:${p.len}px;height:${p.th}px`
        : `left:${p.x - p.th / 2}px;top:${p.y}px;width:${p.th}px;height:${p.len}px`;
    const dupla = p.t === "portad" || (p.t !== "portao" && p.len > p.th * 4.2);
    const folhas = dupla ? `<i class="folha f1"></i><i class="folha f2"></i>` : `<i class="folha"></i>`;
    const tranc = p.trancada && !p.aberta;
    const dica = !S.isM
      ? tranc
        ? "Trancada"
        : ""
      : tranc
        ? "Trancada: toque para destrancar"
        : p.aberta
          ? "Fechar a porta"
          : "Abrir a porta (segure para trancar)";
    return `<div class="porta ${p.o} t-${p.t} ${p.aberta ? "aberta" : ""} ${dupla ? "dupla" : ""} ${tranc ? "trancada" : ""}" data-porta="${i}" style="${box};--cor:${p.cor}" title="${dica}">${folhas}${tranc ? `<b class="cadeado">${CADEADO_ICO}</b>` : ""}</div>`;
  }).join("");
  el.classList.toggle("mestre", !!S.isM);
  $$("#portasL [data-porta]").forEach(d => {
    const i = +d.dataset.porta;
    let segurou = false,
      tm = 0;
    d.onpointerdown = e => {
      e.stopPropagation();
      segurou = false;
      clearTimeout(tm);
      if (S.isM && e.button === 0)
        tm = setTimeout(() => {
          segurou = true;
          trancarPorta(i);
        }, 550);
    };
    d.onpointerup = d.onpointerleave = d.onpointercancel = () => clearTimeout(tm);
    d.oncontextmenu = e => {
      e.preventDefault();
      e.stopPropagation();
      clearTimeout(tm);
      if (S.isM && !segurou) trancarPorta(i);
      segurou = true;
    };
    d.onclick = e => {
      e.stopPropagation();
      if (segurou) {
        segurou = false;
        return;
      }
      const p = (curScene().portas || [])[i];
      if (!S.isM) {
        toast(
          p && p.trancada && !p.aberta
            ? "Esta porta está trancada. Fale com o mestre: talvez um teste de Crime ou Força abra."
            : "Só o mestre abre e fecha as portas."
        );
        return;
      }
      if (p && p.trancada && !p.aberta) destrancarPorta(i);
      else alternarPorta(i);
    };
  });
}
// Tranca uma porta fechada (ou destranca). Trancar uma porta aberta também fecha.
async function trancarPorta(i) {
  const sc = curScene();
  if (!sc || !sc.portas || !sc.portas[i]) return;
  const portas = JSON.parse(JSON.stringify(sc.portas));
  const p = portas[i];
  if (p.t === "portao" || p.t === "secreta") {
    if (!p.trancada) {
      toast("Este tipo de passagem não tranca.");
      return;
    }
  }
  p.trancada = !p.trancada;
  if (p.trancada) p.aberta = false;
  sc.portas = portas;
  renderPortas();
  toast(p.trancada ? "Porta trancada. Toque nela para destrancar." : "Porta destrancada.");
  try {
    await S.db.merge(P() + "/cenas/" + sc.id, { portas });
  } catch (e) {
    fail(e);
  }
}
async function destrancarPorta(i) {
  const r = await formBox(
    "Porta trancada",
    `<p class="muted small" style="margin:0">Os jogadores veem um cadeado. Destranque quando alguém passar no teste (Crime para abrir a fechadura, Força para arrombar) ou achar a chave.</p>
     <label class="check"><input type="checkbox" name="abrir" checked> Abrir a porta também</label>`,
    "Destrancar"
  );
  if (!r) return;
  const sc = curScene();
  if (!sc || !sc.portas || !sc.portas[i]) return;
  sc.portas = JSON.parse(JSON.stringify(sc.portas));
  sc.portas[i].trancada = false;
  if (r.abrir) await alternarPorta(i);
  else {
    renderPortas();
    try {
      await S.db.merge(P() + "/cenas/" + sc.id, { portas: sc.portas });
    } catch (e) {
      fail(e);
    }
  }
}
async function alternarPorta(i) {
  const sc = curScene();
  if (!sc || !sc.portas || !sc.portas[i]) return;
  const portas = JSON.parse(JSON.stringify(sc.portas));
  const p = portas[i];
  p.aberta = !p.aberta;
  const up = { portas };
  if (
    p.aberta &&
    (p.locais || []).length &&
    (sc.locais || []).some(l => p.locais.includes(l.id) && !l.aberto)
  )
    up.locais = sc.locais.map(l => (p.locais.includes(l.id) ? { ...l, aberto: true } : l));
  Object.assign(sc, up);
  renderPortas();
  if (up.locais) {
    renderFog();
    renderNomes();
  }
  try {
    await S.db.merge(P() + "/cenas/" + sc.id, up);
  } catch (e) {
    fail(e);
  }
}

/* ---------- na mesa: passagens entre cenas ---------- */
const PASS_ICO =
  '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h5v-5h5v-5h5V5h3"/></svg>';
function nomeCenaId(id) {
  const c = (S.cenas || []).find(x => x.id === id);
  return c ? c.nome : "cena apagada";
}
function renderPassagens() {
  const el = $("#passL");
  if (!el) return;
  const sc = curScene();
  const L = (sc && sc.passagens) || [];
  el.innerHTML = L.map((p, i) =>
    !S.isM && hiddenAt(p.x, p.y)
      ? ""
      : `<button class="passagem" data-pass="${i}" style="left:${p.x}px;top:${p.y}px" title="${esc(p.nome || "Passagem")}">${PASS_ICO}<span>${esc(p.nome || "Passagem")} → ${esc(nomeCenaId(p.alvo))}</span></button>`
  ).join("");
  $$("#passL [data-pass]").forEach(b => {
    const i = +b.dataset.pass;
    b.onpointerdown = e => {
      e.stopPropagation();
      if (!S.isM) return;
      const p = L[i];
      const st = { x: e.clientX, y: e.clientY, px: p.x, py: p.y };
      let moved = false;
      try {
        b.setPointerCapture(e.pointerId);
      } catch (_) {}
      b.onpointermove = ev => {
        const dx = (ev.clientX - st.x) / V.z,
          dy = (ev.clientY - st.y) / V.z;
        if (!moved && Math.hypot(dx, dy) * V.z < 5) return;
        moved = true;
        p.x = Math.round(st.px + dx);
        p.y = Math.round(st.py + dy);
        b.style.left = p.x + "px";
        b.style.top = p.y + "px";
      };
      b.onpointerup = () => {
        b.onpointermove = b.onpointerup = null;
        if (moved) S.db.merge(P() + "/cenas/" + sc.id, { passagens: L }).catch(fail);
        else usarPassagem(i);
      };
    };
    b.onclick = e => {
      e.stopPropagation();
      if (!S.isM) toast("Só o mestre leva o grupo para outra cena.");
    };
  });
}
async function usarPassagem(i) {
  if (toqueDuplo("usarPassagem")) return; // evita rodar duas vezes num toque duplo
  const sc = curScene();
  const p = sc && (sc.passagens || [])[i];
  if (!p) return;
  const alvo = (S.cenas || []).find(c => c.id === p.alvo);
  if (!alvo) {
    toast("A cena de destino foi apagada. Escolha outra em Cenas → Passagens.");
    return;
  }
  const r = await formBox(
    `${p.nome || "Passagem"} → ${alvo.nome}`,
    `<p class="muted small" style="margin:0">Todos vão para a cena <b>${esc(alvo.nome)}</b>.</p>
     <label class="check"><input type="checkbox" name="toks" checked> Levar os tokens dos agentes junto</label>`,
    "Levar o grupo"
  );
  if (!r) return;
  try {
    if (r.toks) await levarTokens(sc, alvo);
    await exibir(alvo.id);
    viewScene(alvo.id);
  } catch (e) {
    fail(e);
  }
}
// Leva os tokens dos agentes (fichas de jogadores) para perto da passagem que volta, ou para o meio da outra cena.
async function levarTokens(de, para) {
  const posDe = (await S.db.get(P() + "/pos/" + de.id)) || {};
  const tokens = (posDe && posDe.tokens) || {};
  const ag = Object.keys(tokens).filter(tid => {
    const t = (S.tokens || []).find(x => x.id === tid);
    const f = t && t.fichaId && S.fichas[t.fichaId];
    return f && !f.npc;
  });
  if (!ag.length) return;
  const volta = (para.passagens || []).find(q => q.alvo === de.id);
  const base = (para.tam || 50) * 1;
  const cx = volta ? volta.x : (para.w || 1000) / 2,
    cy = volta ? volta.y + base * 1.2 : (para.h || 800) / 2;
  for (let n = 0; n < ag.length; n++) {
    const a = (n / Math.max(1, ag.length)) * Math.PI * 2;
    const d = ag.length > 1 ? base * 0.9 : 0;
    const pos = {
      ...tokens[ag[n]],
      x: Math.round(cx + Math.cos(a) * d),
      y: Math.round(cy + Math.sin(a) * d)
    };
    await S.db.setKey(P() + "/pos/" + para.id, "tokens", ag[n], pos, { ult: ag[n] });
    await S.db.setKey(P() + "/pos/" + de.id, "tokens", ag[n], DEL, { ult: ag[n] });
  }
}

/* ---------- painel Cenas: gerenciar passagens ---------- */
async function passagensModal(sid) {
  const sc = (S.cenas || []).find(c => c.id === sid);
  if (!sc) return;
  const outras = (S.cenas || []).filter(c => c.id !== sid);
  if (!outras.length) {
    toast("Crie outra cena primeiro: a passagem leva de uma cena para outra.");
    return;
  }
  const L = sc.passagens || [];
  const r = await formBox(
    `Passagens em "${sc.nome}"`,
    `<p class="muted small" style="margin:0">Uma passagem (escada, elevador, porta para fora) aparece no mapa. Quando você toca nela, o grupo vai para a outra cena, com os tokens dos agentes. Ela entra no meio do mapa que está na tela; arraste para o lugar certo.</p>
     ${L.length ? `<div class="stack" style="gap:4px">${L.map((p, i) => `<label class="check"><input type="checkbox" name="del${i}"> Tirar "${esc(p.nome || "Passagem")}" → ${esc(nomeCenaId(p.alvo))}</label>`).join("")}</div>` : ""}
     <div class="sub" style="margin:6px 0 0">Nova passagem</div>
     <div class="field"><label class="label" for="psN">Nome</label><input type="text" id="psN" name="nome" maxlength="30" placeholder="Ex.: Escada, Elevador, Saída"></div>
     <div class="field"><label class="label" for="psA">Leva para</label><select id="psA" name="alvo"><option value="">(nenhuma)</option>${outras.map(c => `<option value="${esc(c.id)}">${esc(c.nome)}</option>`).join("")}</select></div>
     <label class="check"><input type="checkbox" name="volta" checked> Criar também a passagem de volta na outra cena</label>`,
    "Salvar"
  );
  if (!r) return;
  try {
    let nova = L.filter((p, i) => !r["del" + i]);
    if (r.alvo) {
      const vendo = S.viewSid === sid && V.w;
      const rr = board.getBoundingClientRect();
      const x = vendo ? Math.round((rr.width / 2 - V.x) / V.z) : Math.round((sc.w || 1000) / 2);
      const y = vendo ? Math.round((rr.height / 2 - V.y) / V.z) : Math.round((sc.h || 800) / 2);
      nova = nova.concat({ id: "p" + rid(6), x, y, alvo: r.alvo, nome: (r.nome || "").trim() || "Passagem" });
      if (r.volta) {
        const o = (S.cenas || []).find(c => c.id === r.alvo);
        if (o && !(o.passagens || []).some(q => q.alvo === sid)) {
          const vol = (o.passagens || []).concat({
            id: "p" + rid(6),
            x: Math.round((o.w || 1000) / 2),
            y: Math.round((o.h || 800) / 2),
            alvo: sid,
            nome: (r.nome || "").trim() || "Passagem"
          });
          await S.db.merge(P() + "/cenas/" + o.id, { passagens: vol });
        }
      }
    }
    await S.db.merge(P() + "/cenas/" + sid, { passagens: nova });
    toast(r.alvo ? "Passagem criada. Arraste no mapa para o lugar certo." : "Pronto.");
  } catch (e) {
    fail(e);
  }
}
</script>
<script>
"use strict";
/* Anotações e grifos do jogador e o mural de pistas. */
/* =====================================================================
   ANOTAÇÕES E MURAL DE PISTAS
   Anotações: cada jogador grifa trechos e escreve observações nos documentos
   que recebeu. Ficam só para ele, em usuarios/<uid>/notasDoc/<mesa>__<id>.
   Mural: quadro da mesa onde todos pregam documentos e bilhetes e ligam uns
   aos outros com barbante. Fica em mesas/<código>/mural/<id>, com tipo
   "doc", "nota" ou "fio" (o barbante, de a até b).
   ===================================================================== */
const MU_W = 2400,
  MU_H = 1500;
const MU_LARG = { doc: 170, nota: 150 };

/* ---------- anotações do jogador ---------- */
function notaPath(privId) {
  return "usuarios/" + S.uid + "/notasDoc/" + S.mesaId + "__" + privId;
}
function subscribeNotasDoc() {
  if (S.isM || S.notasDocUnsub || !S.uid || !S.mesaId) return;
  S.notasDocUnsub = S.db.listenCol(
    "usuarios/" + S.uid + "/notasDoc",
    { where: ["mesa", S.mesaId] },
    l => {
      S.notasDoc = Object.fromEntries(l.map(n => [n.privId, n]));
      if (S.tool === "documentos" && !isEditing()) renderPanel();
    },
    () => {}
  );
}
function temNota(privId) {
  const n = (S.notasDoc || {})[privId];
  return !!(n && ((n.texto || "").trim() || (n.grifos || []).length));
}
async function salvarNota(privId, n) {
  S.notasDoc = { ...(S.notasDoc || {}), [privId]: n };
  try {
    await S.db.set(notaPath(privId), { ...n, mesa: S.mesaId, privId, ts: Date.now() });
  } catch (e) {
    fail(e);
  }
}
// Pinta os grifos no documento aberto. Devolve quantos achou.
function aplicarGrifos(root, grifos) {
  let achou = 0;
  (grifos || []).forEach((g, gi) => {
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode: n =>
        n.parentElement.closest(".redact,.tj,mark.grifo,audio")
          ? NodeFilter.FILTER_REJECT
          : NodeFilter.FILTER_ACCEPT
    });
    let n;
    while ((n = w.nextNode())) {
      const i = n.data.indexOf(g);
      if (i < 0) continue;
      const fim = n.splitText(i);
      fim.splitText(g.length);
      const m = document.createElement("mark");
      m.className = "grifo";
      m.dataset.g = gi;
      m.textContent = g;
      fim.replaceWith(m);
      achou++;
      break;
    }
  });
  return achou;
}
// Guarda o último trecho escolhido dentro do documento aberto (no celular o toque no botão apaga a seleção).
document.addEventListener("selectionchange", () => {
  const sel = window.getSelection();
  const box = $(".docview .docp");
  if (!sel || sel.isCollapsed || !box) return;
  if (box.contains(sel.anchorNode) && box.contains(sel.focusNode))
    S.selDoc = sel.toString().replace(/\s+/g, " ").trim();
});

/* Ações embaixo do documento aberto: anotações (quem recebeu) e mural. Chamado no fim de abrirDoc. */
function docLeituraExtras(e) {
  const view = $(".docview");
  if (!view) return;
  const recebido = !S.isM && e.tipo === "doc" && e.autor !== S.uid;
  if (e.mural) {
    if (e.mural.autor === S.uid || S.isM)
      view.insertAdjacentHTML(
        "beforeend",
        `<div class="row" style="margin-top:12px"><button class="btn sm ghost" id="muTirarDoc">Tirar do mural</button></div>`
      );
    const t = $("#muTirarDoc");
    if (t)
      t.onclick = async () => {
        $("#modalHost").innerHTML = "";
        S.docAberto = null;
        await tirarDoMural(e.mural);
      };
    return;
  }
  if (!recebido) return;
  const n = (S.notasDoc || {})[e.id] || { grifos: [], texto: "" };
  view.insertAdjacentHTML(
    "beforeend",
    `<div class="doc-notas stack">
      <div class="row"><button class="btn sm" id="dnGrifar">Grifar trecho</button><button class="btn sm" id="dnMural">Pôr no mural</button>${(n.grifos || []).length ? `<span class="muted small">Toque num grifo para tirar.</span>` : ""}</div>
      <label class="label" for="dnTx">Minhas anotações (só você vê)</label>
      <textarea id="dnTx" rows="3" maxlength="2000" placeholder="O que você percebeu neste documento?">${esc(n.texto || "")}</textarea>
    </div>`
  );
  const box = $(".docview .docp");
  const pintar = () => {
    aplicarGrifos(box, n.grifos);
    $$("mark.grifo", box).forEach(
      m =>
        (m.onclick = async () => {
          if (!(await confirmBox("Tirar este grifo?", m.textContent, "Tirar"))) return;
          n.grifos = n.grifos.filter((g, i) => i !== +m.dataset.g);
          await salvarNota(e.id, n);
          abrirDoc(e);
        })
    );
  };
  pintar();
  S.selDoc = "";
  $("#dnGrifar").onclick = async () => {
    const g = (S.selDoc || "").slice(0, 300);
    if (!g) {
      toast("Selecione um trecho do documento (arraste o dedo ou o mouse por cima) e toque em Grifar.");
      return;
    }
    if ((n.grifos || []).includes(g)) return;
    const teste = box.cloneNode(true);
    if (!aplicarGrifos(teste, [g])) {
      toast("Grife um trecho de uma linha só, sem passar por cima de tarjas.");
      return;
    }
    n.grifos = [...(n.grifos || []), g];
    await salvarNota(e.id, n);
    abrirDoc(e);
  };
  let tm = 0;
  $("#dnTx").oninput = ev => {
    n.texto = ev.target.value;
    clearTimeout(tm);
    tm = setTimeout(() => salvarNota(e.id, n), 700);
  };
  $("#dnMural").onclick = async () => {
    if (
      e.para !== "todos" &&
      !(await confirmBox(
        "Pôr no mural?",
        "Todos da mesa vão poder ler este documento no mural, com as mesmas tarjas que você vê.",
        "Pôr no mural"
      ))
    )
      return;
    await porNoMural({ titulo: e.titulo, doc: e.doc, docId: e.docId || null, privId: e.id });
  };
}

/* ---------- mural de pistas ---------- */
function subscribeMural() {
  if (S.muralUnsub || !S.mesaId) return;
  S.muralUnsub = S.db.listenCol(
    P() + "/mural",
    {},
    l => {
      S.mural = l;
      if ($("#muralEd")) {
        if (S.muDrag) S.muPend = true;
        else renderMural();
      }
      if (S.tool === "documentos" && !isEditing()) renderPanel();
    },
    () => {}
  );
}
function muralBotaoHTML() {
  subscribeMural();
  const n = (S.mural || []).filter(x => x.tipo !== "fio").length;
  return `<button class="btn block" id="muralAbrir">📌 Mural de pistas${n ? ` (${n})` : ""}</button>`;
}
function bindMural() {
  const b = $("#muralAbrir");
  if (b) b.onclick = abrirMural;
  $$("[data-dmural]").forEach(
    x =>
      (x.onclick = () => {
        const d = (S.docs || []).find(y => y.id === x.dataset.dmural);
        if (d) porNoMural({ titulo: docNome(d), doc: docSnapshot(d), docId: d.id });
      })
  );
}
async function porNoMural(it) {
  if (toqueDuplo("porNoMural")) return; // evita rodar duas vezes num toque duplo
  const L = S.mural || (await S.db.getCol(P() + "/mural"));
  if (
    L.some(
      x =>
        x.tipo === "doc" &&
        ((it.privId && x.privId === it.privId) || (S.isM && it.docId && x.docId === it.docId && !x.privId))
    )
  ) {
    toast("Esse documento já está no mural.");
    return;
  }
  const R = maRng(Date.now() % 9973);
  try {
    await S.db.add(P() + "/mural", {
      tipo: "doc",
      titulo: String(it.titulo || "Documento").slice(0, 120),
      doc: it.doc,
      docId: it.docId || null,
      privId: it.privId || null,
      autor: S.uid,
      autorNome: S.isM ? "Mestre" : nomeMembro(S.uid),
      x: Math.round(700 + R() * 900),
      y: Math.round(380 + R() * 600),
      ts: Date.now()
    });
    toast("Está no mural de pistas.");
  } catch (e) {
    fail(e);
  }
}
async function tirarDoMural(it) {
  try {
    const fios = (S.mural || []).filter(f => f.tipo === "fio" && (f.a === it.id || f.b === it.id));
    for (const f of fios) await S.db.del(P() + "/mural/" + f.id);
    await S.db.del(P() + "/mural/" + it.id);
    toast("Saiu do mural.");
  } catch (e) {
    fail(e);
  }
}
async function notaMural(it) {
  const meu = !it || it.autor === S.uid || S.isM;
  if (!meu) return;
  const cores = ["Amarelo", "Rosa", "Azul", "Verde"];
  const r = await formBox(
    it ? "Bilhete" : "Novo bilhete",
    `<div class="field"><label class="label" for="muTx">O que vai escrito</label><textarea id="muTx" name="texto" rows="4" maxlength="200" required placeholder="Ex.: A Bia sabia do sangue?">${esc((it && it.texto) || "")}</textarea></div>
     <div class="field"><label class="label" for="muCor">Cor</label><select id="muCor" name="cor">${cores.map((c, i) => `<option value="${i}" ${((it && it.cor) || 0) === i ? "selected" : ""}>${c}</option>`).join("")}</select></div>
     ${it ? `<label class="check"><input type="checkbox" name="tirar"> Tirar do mural</label>` : ""}`,
    it ? "Salvar" : "Pregar no mural"
  );
  if (!r) return;
  try {
    if (it && r.tirar) return tirarDoMural(it);
    const texto = (r.texto || "").trim();
    if (!texto) return;
    if (it) await S.db.merge(P() + "/mural/" + it.id, { texto, cor: +r.cor || 0 });
    else {
      const vp = $("#muVp");
      const z = S.muZ || 0.5;
      await S.db.add(P() + "/mural", {
        tipo: "nota",
        texto,
        cor: +r.cor || 0,
        autor: S.uid,
        autorNome: S.isM ? "Mestre" : nomeMembro(S.uid),
        x: Math.round(Math.min(MU_W - 160, (vp ? vp.scrollLeft + vp.clientWidth / 2 : 1200 * z) / z - 75)),
        y: Math.round(Math.min(MU_H - 140, (vp ? vp.scrollTop + vp.clientHeight / 2 : 750 * z) / z - 60)),
        ts: Date.now()
      });
    }
  } catch (e) {
    fail(e);
  }
}
function abrirMural() {
  if ($("#muralEd")) return;
  subscribeMural();
  S.muLigar = false;
  S.muSel = null;
  S.muZ = S.muZ || (innerWidth < 700 ? 0.38 : 0.55);
  document.body.insertAdjacentHTML(
    "beforeend",
    `<div class="docEd muralEd" id="muralEd"><div class="me-top"><button class="btn sm ghost" id="muX">✕ Fechar</button><b style="font-family:var(--f-display);font-size:18px">Mural de pistas</b><span class="me-gap"></span>
      <button class="btn sm" id="muLig">🧵 Ligar com barbante</button><button class="btn sm" id="muNota">+ Bilhete</button>
      <span class="row" style="gap:2px;flex-wrap:nowrap"><button class="btn sm" id="muMenos" aria-label="Diminuir">−</button><button class="btn sm" id="muMais" aria-label="Aumentar">+</button></span></div>
      <div class="mu-dica muted small" id="muDica"></div>
      <div class="mu-vp" id="muVp"><div class="mu-scale" id="muScale"><div class="mu-board" id="muBoard"></div></div></div></div>`
  );
  document.body.classList.add("me-open");
  $("#muX").onclick = () => {
    $("#muralEd").remove();
    document.body.classList.remove("me-open");
  };
  $("#muLig").onclick = () => {
    S.muLigar = !S.muLigar;
    S.muSel = null;
    renderMural();
  };
  $("#muNota").onclick = () => notaMural(null);
  const zoom = f => {
    const vp = $("#muVp");
    const cx = (vp.scrollLeft + vp.clientWidth / 2) / S.muZ,
      cy = (vp.scrollTop + vp.clientHeight / 2) / S.muZ;
    S.muZ = Math.max(0.25, Math.min(1.2, +(S.muZ * f).toFixed(3)));
    renderMural();
    vp.scrollLeft = cx * S.muZ - vp.clientWidth / 2;
    vp.scrollTop = cy * S.muZ - vp.clientHeight / 2;
  };
  $("#muMenos").onclick = () => zoom(1 / 1.25);
  $("#muMais").onclick = () => zoom(1.25);
  renderMural();
  const vp = $("#muVp");
  vp.scrollLeft = (MU_W * S.muZ - vp.clientWidth) / 2;
  vp.scrollTop = (MU_H * S.muZ - vp.clientHeight) / 2;
}
function muCentro(it) {
  return { x: it.x + (MU_LARG[it.tipo] || 160) / 2, y: it.y + 8 };
}
function fiosSVG() {
  const L = S.mural || [];
  const por = Object.fromEntries(L.map(x => [x.id, x]));
  const fios = L.filter(f => f.tipo === "fio" && por[f.a] && por[f.b]);
  return `<svg class="mu-fios" width="${MU_W}" height="${MU_H}" viewBox="0 0 ${MU_W} ${MU_H}">${fios
    .map(f => {
      const a = muCentro(por[f.a]),
        b = muCentro(por[f.b]);
      const d = Math.hypot(b.x - a.x, b.y - a.y);
      const path = `M${a.x} ${a.y} Q${(a.x + b.x) / 2} ${Math.max(a.y, b.y) + Math.min(140, d * 0.18)} ${b.x} ${b.y}`;
      return `<path d="${path}" class="mu-f"/><path d="${path}" class="mu-fh" data-fio="${esc(f.id)}"><title>Cortar o barbante</title></path>`;
    })
    .join("")}</svg>`;
}
function renderMural() {
  const bd = $("#muBoard");
  if (!bd) return;
  const z = S.muZ;
  $("#muScale").style.cssText = `width:${MU_W * z}px;height:${MU_H * z}px`;
  bd.style.transform = `scale(${z})`;
  $("#muLig").classList.toggle("primary", !!S.muLigar);
  $("#muDica").textContent = S.muLigar
    ? S.muSel
      ? "Agora toque na pista que você quer ligar a essa."
      : "Toque em duas pistas para ligar uma à outra. Toque num barbante para cortar."
    : "Arraste as pistas para organizar. Toque numa pista para ler.";
  const L = (S.mural || []).filter(x => x.tipo !== "fio");
  bd.innerHTML =
    fiosSVG() +
    L.map(it => {
      const R = maRng(maH((it.id || "x").length, (it.id || "x").charCodeAt(1) || 7, 5));
      const rot = ((R() - 0.5) * 6).toFixed(1);
      const cls = `mu-it mu-${it.tipo} ${S.muSel === it.id ? "sel" : ""} ${it.tipo === "nota" ? "c" + (it.cor || 0) : ""}`;
      const corpo =
        it.tipo === "doc"
          ? `<div class="mu-th">${docHtml(it.doc || {})}</div><div class="mu-nm">${esc(it.titulo)}</div>`
          : `<div class="mu-tx">${esc(it.texto)}</div>`;
      return `<div class="${cls}" data-mu="${esc(it.id)}" style="left:${it.x}px;top:${it.y}px;--r:${rot}deg"><i class="mu-pin"></i>${corpo}<div class="mu-por">${esc(it.autorNome || "")}</div></div>`;
    }).join("");
  bindMuralBoard();
}
function bindMuralBoard() {
  const L = S.mural || [];
  $$("#muBoard [data-mu]").forEach(el => {
    const it = L.find(x => x.id === el.dataset.mu);
    if (!it) return;
    el.onpointerdown = e => {
      e.preventDefault();
      const st = { x: e.clientX, y: e.clientY, ix: it.x, iy: it.y };
      let moved = false;
      try {
        el.setPointerCapture(e.pointerId);
      } catch (_) {}
      el.onpointermove = ev => {
        const dx = (ev.clientX - st.x) / S.muZ,
          dy = (ev.clientY - st.y) / S.muZ;
        if (!moved && Math.hypot(dx, dy) * S.muZ < 5) return;
        moved = true;
        S.muDrag = true;
        it.x = Math.round(Math.max(0, Math.min(MU_W - 170, st.ix + dx)));
        it.y = Math.round(Math.max(0, Math.min(MU_H - 200, st.iy + dy)));
        el.style.left = it.x + "px";
        el.style.top = it.y + "px";
        const svg = $("#muBoard .mu-fios");
        if (svg) svg.outerHTML = fiosSVG();
      };
      el.onpointerup = el.onpointercancel = async () => {
        el.onpointermove = el.onpointerup = el.onpointercancel = null;
        S.muDrag = false;
        if (moved) {
          try {
            await S.db.merge(P() + "/mural/" + it.id, { x: it.x, y: it.y });
          } catch (er) {
            fail(er);
          }
          if (S.muPend) {
            S.muPend = false;
            renderMural();
          } else bindMuralBoard();
          return;
        }
        clicarNoMural(it);
      };
    };
  });
  $$("#muBoard [data-fio]").forEach(
    p =>
      (p.onclick = async () => {
        if (!(await confirmBox("Cortar este barbante?", "As duas pistas continuam no mural.", "Cortar")))
          return;
        try {
          await S.db.del(P() + "/mural/" + p.dataset.fio);
        } catch (e) {
          fail(e);
        }
      })
  );
}
async function clicarNoMural(it) {
  if (S.muLigar) {
    if (!S.muSel || S.muSel === it.id) {
      S.muSel = S.muSel === it.id ? null : it.id;
      renderMural();
      return;
    }
    const a = S.muSel,
      b = it.id;
    S.muSel = null;
    renderMural();
    if (
      (S.mural || []).some(f => f.tipo === "fio" && ((f.a === a && f.b === b) || (f.a === b && f.b === a)))
    ) {
      toast("Essas duas já estão ligadas.");
      return;
    }
    try {
      await S.db.add(P() + "/mural", { tipo: "fio", a, b, autor: S.uid, ts: Date.now() });
    } catch (e) {
      fail(e);
    }
    return;
  }
  if (it.tipo === "doc")
    abrirDoc({ id: it.id, titulo: it.titulo, doc: it.doc, quem: it.autorNome, para: "todos", mural: it });
  else if (it.autor === S.uid || S.isM) notaMural(it);
}
</script>

"use strict";

boot();
</script>
