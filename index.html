  s.querySelectorAll(".live").forEach(n => n.remove());
  const k = 1 / V.z;
  let h = "";
  if (S.regua) {
    const { a, b } = S.regua;
    const d = Math.hypot(b.x - a.x, b.y - a.y);
    const { cas, m } = metros(d);
    h += `<g class="live"><line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#fff" stroke-width="${4 * k}" stroke-dasharray="${10 * k} ${6 * k}"/><circle cx="${a.x}" cy="${a.y}" r="${6 * k}" fill="#b47dff"/><circle cx="${b.x}" cy="${b.y}" r="${6 * k}" fill="#b47dff"/>
      <g transform="translate(${b.x} ${b.y}) scale(${k})"><rect x="12" y="-34" width="${m >= 100 ? 132 : 118}" height="28" rx="6" fill="rgba(20,16,25,.92)" stroke="#8b3ff0"/><text x="22" y="-15" class="rt">${m.toLocaleString("pt-BR")} m · ${cas.toFixed(1).replace(".", ",")} q</text></g></g>`;
  }
  if (S.live && S.live.pts) {

  }

}

/* ---------- ferramentas ---------- */
function toolDown(tool, p, e) {
  if (tool === "regua") {
    S.regua = { a: p, b: p };
    renderOverlay();
    return {
      move: q => {
        S.regua.b = q;
        renderOverlay();
      },
      up: () => {
        clearTimeout(S.reguaT);
        S.reguaT = setTimeout(() => {
          S.regua = null;
          renderOverlay();
        }, 4000);
      }
    };
  }
  if (tool === "ping") {
    const doc = {
      sid: S.viewSid,
      x: Math.round(p.x),
      y: Math.round(p.y),
      cor: S.drawCor || corDe(S.uid),
      quem: myName(),
      autor: S.uid,
      ts: Date.now()
    };
    S.db
      .add(P() + "/pings", doc)
      .then(id => {
        S.pingSeen.add(id);
      })
      .catch(fail);
    showPing(doc);
    (S.pings || [])
      .filter(x => x.autor === S.uid && Date.now() - (x.ts || 0) > 60000)
      .forEach(x => S.db.del(P() + "/pings/" + x.id).catch(() => {}));
    return { move() {}, up() {} };
  }
  if (tool === "desenho") {
    const cor = S.drawCor || corDe(S.uid);
    const w = Math.max(2, Math.round((S.drawW || 4) / Math.max(0.25, V.z)));
    S.live = { pts: [Math.round(p.x), Math.round(p.y)], cor, w };
    renderOverlay();
    return {
      move: q => {
        const L = S.live.pts;
        const lx = L[L.length - 2],
          ly = L[L.length - 1];
        if (Math.hypot(q.x - lx, q.y - ly) < 2 / V.z) return;
        L.push(Math.round(q.x), Math.round(q.y));
        renderOverlay();
      },
      up: () => {
        const L = S.live.pts;
        S.live = null;
        renderOverlay();
        let pts = L.length > 4 ? simplificar(L, 1 / V.z) : L;
        if (pts.length > 1000) pts = simplificar(L, 3 / V.z).slice(0, 1000);
        const doc = { sid: S.viewSid, autor: S.uid, cor, w, pts, ts: Date.now() };
        S.draws = [...(S.draws || []), { id: "tmp", ...doc }];
        renderDraws();
        S.db.add(P() + "/desenhos", doc).catch(fail);
      }
    };
  }
  if (tool === "borracha") {
    apagarPerto(p);
    return { move: q => apagarPerto(q), up() {} };
  }
  if ((tool === "revelar" || tool === "esconder") && S.isM) {
    const t = tool === "revelar" ? "r" : "h";
    S.live = { rect: { x: p.x, y: p.y, w: 0, h: 0 }, t, a: p };
    return {
      move: q => {
        const a = S.live.a;
        S.live.rect = {
          x: Math.min(a.x, q.x),
          y: Math.min(a.y, q.y),
          w: Math.abs(q.x - a.x),
          h: Math.abs(q.y - a.y)
        };
        renderOverlay();
      },
      up: () => {
        const r = S.live.rect;
        S.live = null;
        renderOverlay();
        if (r.w > 4 && r.h > 4) fogOp(t, r);
      }
    };
  }
  return null;
}
function apagarPerto(p) {
  const tol = 14 / V.z;
  (S.draws || []).forEach(d => {
    if (d.id === "tmp" || !(S.isM || d.autor === S.uid) || (S.apagando && S.apagando.has(d.id))) return;
    const P2 = d.pts || [];
    for (let i = 0; i < P2.length; i += 2) {
      if (Math.hypot(P2[i] - p.x, P2[i + 1] - p.y) < tol + (d.w || 4) / 2) {
        (S.apagando = S.apagando || new Set()).add(d.id);
        S.draws = S.draws.filter(x => x.id !== d.id);
        renderDraws();
        S.db.del(P() + "/desenhos/" + d.id).catch(fail);
        break;
      }
    }
  });
}

function tokVisivel(t, p) {

      return `<div class="tok ${S.sel === tid ? "sel" : ""} ${canMove(t) ? "" : "locked"} ${dim ? "dim" : ""} ${tokenDaVez(t) ? "vez" : ""}" data-tok="${esc(tid)}" style="left:${p.x}px;top:${p.y}px">${img}${hpb}<span class="tn">${esc(tokNome(t))}${t.oculto && S.isM ? " (oculto)" : ""}</span></div>`;

function bindTokens_board() {
  $$(".tok").forEach(el => {
    const tid = el.dataset.tok;
    const t = S.tokens.find(x => x.id === tid);
    el.onpointerdown = e => {
      if ((S.mode || "mover") !== "mover") return;
      e.stopPropagation();
      e.preventDefault();
      const p = S.pos[tid];
      if (!p) return;
      const start = { x: e.clientX, y: e.clientY, px: p.x, py: p.y };
      let moved = false;
      const mv = canMove(t);
      try {
        el.setPointerCapture(e.pointerId);
      } catch (_) {}
      if (mv) S.dragging = true;
      let avisou = false;
      el.onpointermove = ev => {
        if (!mv) {
          if (!avisou && Math.abs(ev.clientX - start.x) + Math.abs(ev.clientY - start.y) > 12) {
            avisou = true;
            toast("Você só pode mover o seu personagem.");
          }
          return;
        }
        const dx = (ev.clientX - start.x) / V.z,
          dy = (ev.clientY - start.y) / V.z;
        if (Math.abs(dx) + Math.abs(dy) > 3 / V.z) moved = true;
        if (moved) {
          el.style.left = start.px + dx + "px";
          el.style.top = start.py + dy + "px";
        }
      };
      el.onpointerup = el.onpointercancel = ev => {
        el.onpointermove = null;
        el.onpointerup = null;
        el.onpointercancel = null;
        S.dragging = false;
        if (moved) {
          let nx = Math.round(start.px + (ev.clientX - start.x) / V.z),
            ny = Math.round(start.py + (ev.clientY - start.y) / V.z);
          const sc = curScene();
          if (sc && sc.grade && sc.encaixe) {
            const b = tokenBase();
            nx = Math.floor(nx / b) * b + b / 2;
            ny = Math.floor(ny / b) * b + b / 2;
          }
          nx = Math.max(0, Math.min(V.w, nx));
          ny = Math.max(0, Math.min(V.h, ny));
          S.pos[tid] = { ...S.pos[tid], x: nx, y: ny };
          S.db.setKey(P() + "/pos/" + S.viewSid, "tokens", tid, S.pos[tid], { ult: tid }).catch(fail);
          renderBoard();
        } else {
          S.sel = S.sel === tid ? null : tid;
          renderBoard();
        }
      };
    };
  });
}

  const oc = $("#tbOc");
  if (oc)
    oc.onchange = () => {
      t.oculto = oc.checked;
      renderBoard();
      S.db.merge(P() + "/tokens/" + t.id, { oculto: t.oculto }).catch(fail);
    };
  const dpv = k => {
    const c = combBase();
    const x = c.lista.find(y => y.id === t.combId);
    if (!x) {
      toast("Essa ameaça não está mais no combate.");
      return;
    }
    x.pv = Math.max(0, Math.min(x.pvMax, x.pv + k));
    saveCombate(c);
    renderBoard();
  };
  if ($("#tbDm")) {
    $("#tbDm").onclick = () => dpv(-5);
    $("#tbCu").onclick = () => dpv(5);

function renderBoardTop() {

<script>
"use strict";
/* Catálogos da ficha (rituais, armas, itens) somando o homebrew da mesa. */
/* ===================== CATÁLOGOS + HOMEBREW ===================== */
const hbOf = t => S.homebrew.filter(h => h.tipo === t);
const ROMAN = ["", "I", "II", "III", "IV"];
const CAT_N = { 0: 0, I: 1, II: 2, III: 3, IV: 4, "—": -1 };
function catPlus(c, k) {
  const v = Math.max(0, (CAT_N[c] ?? 0) + k);
  return ["0", "I", "II", "III", "IV", "V", "VI"][v] || String(v);
}
// Ritual normalizado: {n, el, c, ex, al, alvo, du, res, tipo, formas:[{k, dado, custo, req}], hb}
function allRituais() {
  const base = RITUAIS_LIVRO.map(([n, el, c, ex, al, alvo, du, res, dado, D, V, tipo]) => {
    const custo = CUSTO_CIRCULO[c];
    const formas = [{ k: "Normal", dado, custo, req: "" }];
    if (D) formas.push({ k: "Discente", dado: D[1], custo: custo + D[0], req: D[2] });
    if (V) formas.push({ k: "Verdadeiro", dado: V[1], custo: custo + V[0], req: V[2] });
    return { n, el, c, ex, al, alvo, du, res, tipo, formas };
  });
  const hb = hbOf("ritual").map(h => {
    const c = +h.circulo || 1;
    const custo = +h.custo || CUSTO_CIRCULO[c];
    const formas = [{ k: "Normal", dado: h.dado || "", custo, req: "" }];
    if (h.dadoD || +h.custoD)
      formas.push({ k: "Discente", dado: h.dadoD || "", custo: +h.custoD || custo + 2, req: "" });
    if (h.dadoV || +h.custoV)
      formas.push({ k: "Verdadeiro", dado: h.dadoV || "", custo: +h.custoV || custo + 5, req: "" });
    return {
      n: h.nome,
      el: h.el || "Medo",
      c,
      ex: "",
      al: "",
      alvo: "",
      du: "",
      res: "",
      tipo: (h.efeito || "").toLowerCase(),
      formas,
      hb: true,
      desc: h.desc || ""
    };
  });
  return base.concat(hb);
}
function armaInfo(nome) {
  const a = ARMAS_LIVRO.find(x => x[0] === nome);
  return a
    ? {
        nome: a[0],
        grupo: a[1],
        emp: a[2],
        cat: a[3],
        dano: a[4],
        crit: a[5],
        alc: a[6],
        tipo: a[7],
        esp: a[8],
        agil: !!a[9]
      }
    : null;
}
function allArmas() {
  return ARMAS_LIVRO.map(a => armaInfo(a[0])).concat(
    hbOf("arma").map(h => ({
      nome: h.nome,
      grupo: h.grupo || "táticas",
      emp: h.pericia === "Pontaria" ? "Fogo · uma mão" : "Corpo a corpo · uma mão",
      cat: h.cat || "I",
      dano: h.dado || "1d6",
      crit:
        (+h.margem < 20 ? h.margem : "") +
        ((+h.mult || 2) > 2 || +h.margem >= 20 ? (+h.margem < 20 ? "/" : "") + "x" + (+h.mult || 2) : ""),
      alc: "—",
      tipo: "",
      esp: 1,
      agil: false,
      hb: true
    }))
  );
}
function allBest() {
  return AMEACAS.map(([n, el, vd, def, pv, pres, atk, at]) => ({ n, el, vd, def, pv, pres, atk, at })).concat(
    hbOf("criatura").map(h => ({
      n: h.nome,
      el: h.el || "",
      vd: +h.vd || 0,
      def: +h.def || 10,
      pv: +h.pv || 10,
      pres: h.desc || "",
      atk: ["Ataque", Math.max(1, +h.atkD || 2), +h.atk || 0, h.dado || "1d6"],
      at: [1, 1, 1, 1, 1],
      hb: true
    }))
  );
}
function parseCrit(s) {
  s = String(s || "x2");
  const m = s.match(/^(\d+)?\/?x?(\d+)?$/);
  let marg = 20,
    mult = 2;
  if (/^\d+$/.test(s)) {
    marg = +s;
  } else if (/^x\d+$/.test(s)) {
    mult = +s.slice(1);
  } else {
    const p = s.split("/");
    marg = +p[0] || 20;
    mult = +(p[1] || "x2").replace("x", "") || 2;
  }
  return { marg, mult };
}
</script>

<script>

function novaFicha() {

      {
        nome: "Ataque desarmado",

// Fichas da versão anterior (treinada sim/não) viram graus
function migrar(f) {
  if (f.v === 2) return f;
  for (const p in f.per) {
    const v = f.per[p] || {};
    if (v.g == null) f.per[p] = { g: v.t ? 5 : 0, b: +v.b || 0 };
  }
  PERICIAS.forEach(([p]) => {
    if (!f.per[p]) f.per[p] = { g: 0, b: 0 };
  });

  f.itens = f.itens || [];
  f.poderes = f.poderes || [];
  f.paranormais = f.paranormais || [];
  f.pp = f.pp || 0;
  f.trilha = f.trilha || "";

const nexN = nex => (+nex >= 99 ? 20 : Math.max(1, Math.round((+nex || 5) / 5)));

}
function derivados(f) {
  const c = CLASSES[f.classe] || CLASSES.Combatente;
  const n = nexN(f.nex);
  const inc = n - 1;
  const A = f.attr;
  const nex = +f.nex || 5;
  const temTrilha = (nome, idx) =>
    f.trilha && c.trilhas[f.trilha] && nex >= TRILHA_NEX[idx] && c.trilhas[f.trilha][idx] === nome;
  let pvMax = c.pv + A.VIG + inc * (c.pvN + A.VIG) + (+f.bonusPV || 0);
  if (f.origem === "Desgarrado") pvMax += n; // Calejado
  if (temTrilha("Casca Grossa", 0)) pvMax += n; // Tropa de Choque
  let peMax = c.pe + A.PRE + inc * (c.peN + A.PRE) + (+f.bonusPE || 0);
  if (f.origem === "Universitário") {
    peMax += 1;
    for (let k = 15; k <= Math.min(95, nex); k += 10) peMax += 1;

  const limPE = n;

  const mochila = (f.itens || []).some(i => i.nome === "Mochila militar") ? 2 : 0;
  const carga =
    (temTrilha("Inventário Otimizado", 0) ? (A.FOR + A.INT) * 5 : A.FOR > 0 ? A.FOR * 5 : 2) +
    mochila +
    (+f.cargaExtra || 0);
  const usados = [...(f.armas || []), ...(f.protecoes || []), ...(f.itens || [])].reduce(
    (s, i) => s + (+i.esp || 0) * (+i.qtd || 1),

  const pat = patenteDe(f.pp);
  const usoCat = [0, 0, 0, 0, 0];
  [...(f.armas || []), ...(f.protecoes || []), ...(f.itens || [])].forEach(i => {
    const k = CAT_N[i.cat];

  if (f.classe === "Ocultista") circ = (CIRC_OCULT.find(t => nex >= t[0]) || [0, 0])[1];
  else if ((f.poderes || []).includes("Transcender") || (f.paranormais || []).includes("Aprender Ritual"))
    circ = nex >= 75 ? 3 : nex >= 45 ? 2 : 1;
  const D = {
    pvMax,
    peMax,
    sanMax,
    def,
    rd,
    limPE,
    peRod: limPE,
    dtRit,
    carga,
    mochila,
    usados,
    pat,
    usoCat,
    atq,
    perito,
    circ,
    n

}
function cur(f, k) {
  const max = derivados(f)[k + "Max"];

}
/* "NEX 35%" ou, para o Sobrevivente, "Estágio 2" */
function nivelDe(f) {

}

}
const fA = () => {

};
function avatar(f, size = 52) {

<script>
"use strict";
/* Ficha: testes de perícia, ataques e rituais. */
/* ---------- rolagens da ficha ---------- */
function testePericia(p) {
  const f = fA();
  const a = PERICIAS.find(x => x[0] === p)[1];
  let mod = modPericia(f, p);
  let extra = "";
  const pc = $("#usarPerito");
  const D = derivados(f);
  if (pc && pc.checked) {
    if (!grau(f, p)) {
      toast("Perito só funciona em perícia treinada.");
      return;
    }
    if (cur(f, "pe") < D.perito[1]) {
      toast("PE insuficiente para Perito.");
      return;
    }
    f.pe = cur(f, "pe") - D.perito[1];
    const r = rollExpr(D.perito[2]);
    mod += r.total;
    extra = ` · Perito ${r.detail} (−${D.perito[1]} PE)`;
    saveFicha(S.openFicha, true);
  }
  const pen = penalidade(f, { tipo: "pericia", attr: a, nome: p });
  mod += pen.mod;
  const r = rollTest(f.attr[a], mod, pen.dados);
  logEntry({
    quem: f.nome,
    titulo: p,
    total: r.total,
    det: `${r.dice.length}d20[${r.dice.join(",")}] fica ${r.mode} ${r.kept}${sgn(mod)}${extra}${pen.quem.length ? ` · condições: ${pen.quem.join(", ")}` : ""}`,
    flag: r.kept === 20 ? "crit" : r.kept === 1 ? "fail" : "",
    para: S.paraRolagem || ""
  });
  if (pc && pc.checked) renderPanel();
}
function atacar(i) {
  const f = fA();
  const w = f.armas[i];
  if (!w) return;
  const D = derivados(f);
  const corpo = w.pericia === "Luta";
  const attrK = corpo ? (w.agil && f.attr.AGI > f.attr.FOR ? "AGI" : "FOR") : "AGI";
  let mod = modPericia(f, w.pericia) + (+w.bonus || 0);
  let dmgB = (corpo ? f.attr[attrK === "AGI" ? "AGI" : "FOR"] : 0) + (+w.bdano || 0);
  const notes = [];
  let pen = 0;
  if (!profOK(f, w)) {
    pen += 2;
    notes.push("sem proficiência −2d20");
  }
  if (/motosserra/i.test(w.nome)) pen += 1;
  let { marg, mult } = parseCrit(w.crit);
  let extraDice = 0;
  let extraDmg = "";
  (w.mods || []).forEach(m => {
    const md = (MODIFICACOES.find(x => x[0] === m) || [])[3] || {};
    mod += md.atk || 0;
    dmgB += md.dmg || 0;
    marg -= md.marg || 0;
    mult += md.mult || 0;
    extraDice += md.dado || 0;
    if (md.extra) extraDmg = md.extra;
  });
  if (f.origem === "Lutador" && corpo) dmgB += 2;
  if (f.origem === "Militar" && /Fogo/.test(w.emp || w.nome)) dmgB += 2;
  const esp = $("#usarPoderAtk");
  const useEsp = esp && esp.checked && D.atq;
  if (useEsp) {
    if (cur(f, "pe") < D.atq[1]) {
      toast("PE insuficiente para Ataque Especial.");
      return;
    }
    f.pe = cur(f, "pe") - D.atq[1];
    const noTeste = Math.max(0, Math.min(D.atq[2], +($("#atqNoTeste") || {}).value || 0));
    mod += noTeste;
    dmgB += D.atq[2] - noTeste;
    notes.push(`Ataque Especial −${D.atq[1]} PE`);
  }
  const pc = penalidade(f, { tipo: "ataque", attr: attrK, nome: w.pericia, cac: corpo });
  mod += pc.mod;
  if (pc.quem.length) notes.push(`condições: ${pc.quem.join(", ")}`);
  const r = rollTest(f.attr[attrK], mod, pen + pc.dados);
  const crit = r.kept >= marg;
  const dano = String(w.dano).split("/")[0];
  const dm = rollExpr(dano, { critMult: crit ? mult : 1, explode6: false, extraDice });
  if (!dm) {
    toast("Dano inválido. Use algo como 2d6+2.");
    return;
  }
  let tot = dm.total + dmgB;
  let exTxt = "";
  if (extraDmg) {
    const e = rollExpr(extraDmg);
    tot += e.total;
    exTxt = " + " + e.detail;
  }
  logEntry({
    quem: f.nome,
    titulo: `${w.nome} · dano ${tot}`,
    total: r.total,
    flag: crit ? "crit" : r.kept === 1 ? "fail" : "",
    para: S.paraRolagem || "",
    det: `${w.pericia} ${r.dice.length}d20[${r.dice.join(",")}] ${r.kept}${sgn(mod)}${crit ? ` · CRÍTICO ×${mult}` : ""} → dano ${dm.detail}${sgn(dmgB)}${exTxt}${notes.length ? " · " + notes.join(", ") : ""}`
  });
  if (useEsp) {
    saveFicha(S.openFicha, true);
    renderPanel();
  }
}
function conjurar(n, k = 0) {
  const f = fA();
  const r = allRituais().find(x => x.n === n);
  if (!r) return;
  const D = derivados(f);
  const fm = r.formas[k] || r.formas[0];
  if (r.c > D.circ && !r.hb) {
    toast(`Você ainda não conjura rituais de ${r.c}º círculo.`);
    return;
  }
  if ($("#semComp") && $("#semComp").checked && r.el !== "Medo") {
    toast("Sem componentes ritualísticos não dá para conjurar este ritual.");
    return;
  }
  let custo = fm.custo;
  if ((f.cond || []).includes("Alquebrado")) custo += 1;
  if (cur(f, "pe") < custo) {
    toast("PE insuficiente para conjurar.");
    return;
  }
  f.pe = cur(f, "pe") - custo;
  let total = null,
    det = `${r.el} · ${fm.k} · −${custo} PE${fm.req ? " · requer " + fm.req : ""}`;
  if (fm.dado && parseExpr(fm.dado.replace(/^\+/, ""))) {
    const roll = rollExpr(fm.dado.replace(/^\+/, ""));
    total = roll.total;
    det = `${roll.detail} · ${det}`;
    if (r.tipo === "cura") {
      f.pv = Math.min(D.pvMax, cur(f, "pv") + total);
      det += " · cura aplicada";
    } else if (r.res) det += ` · ${r.res} DT ${D.dtRit}`;
  } else if (r.res) det += ` · ${r.res} DT ${D.dtRit}`;
  logEntry({
    quem: f.nome,
    titulo: `Ritual · ${r.n}${k ? ` (${fm.k})` : ""}`,
    total,
    det,
    para: S.paraRolagem || ""
  });
  saveFicha(S.openFicha, true);
  renderPanel();
}
</script>
<script>
"use strict";
/* Ficha: o que cada botão e campo faz. */
/* ---------- ficha: eventos ---------- */
/* Nome comprido não cabe no campo do celular: diminui a letra até caber (mínimo 15px). */
function ajustarFonteNome(el) {
  if (!el) return;
  el.style.fontSize = "";
  let fs = parseFloat(getComputedStyle(el).fontSize) || 26;
  while (el.scrollWidth > el.clientWidth + 1 && fs > 15) {
    fs -= 1;
    el.style.fontSize = fs + "px";
  }
}
/* Liga os botões da ficha aberta. As partes especiais ficam nos arquivos delas. */
function bindSheet() {
  const id = S.openFicha;
  const f = S.fichas[id];
  if (f && f.rapido)
    bindNpcRapido(id, f); // ficha rápida de NPC (ficha/npcs)
  else bindFichaCompleta();
  if (S.solo)
    $$("[data-back]").forEach(b => (b.onclick = soloFechar)); // personagem fora de mesa (mesa/personagens)
  else bindFichaAcoes(f, id); // menu Opções: duplicar, dar, retirar, virar NPC (mestre/gestao)
  bindEstagio(f, id); // classe Sobrevivente (regras/sobrevivente)
}
function bindFichaCompleta() {
  {
    const nm = $("#s_nome");
    if (nm) {
      requestAnimationFrame(() => ajustarFonteNome(nm));
      nm.addEventListener("input", () => ajustarFonteNome(nm));
    }
  }
  $$("[data-back]").forEach(
    b =>
      (b.onclick = () => {
        S.openFicha = null;
        renderPanel();
      })
  );
  $$("[data-stab]").forEach(
    b =>
      (b.onclick = () => {
        S.sheetTab = b.dataset.stab;
        renderPanel();
        $("#pbody").scrollTop = 0;
      })
  );
  const id = S.openFicha;
  const f = fA();
  if (!f) return;
  $$("[data-roll]").forEach(b => (b.onclick = () => testePericia(b.dataset.roll)));
  $$("[data-atk]").forEach(b => (b.onclick = () => atacar(+b.dataset.atk)));
  $$("[data-conj]").forEach(b => (b.onclick = () => conjurar(b.dataset.conj, +b.dataset.forma || 0)));
  $$("[data-wtog]").forEach(
    b =>
      (b.onclick = () => {
        const i = +b.dataset.wtog;
        S.openArma = S.openArma === i ? null : i;
        renderPanel();
      })
  );
  $$("[data-ritf]").forEach(
    b =>
      (b.onclick = () => {
        S.ritFiltro = b.dataset.ritf;
        renderPanel();
      })
  );
  const bc = $("#btnClaim");
  if (bc)
    bc.onclick = async () => {
      const r = await formBox(
        "Pedir a ficha " + f.nome,
        `<div class="field"><label class="label" for="clQuem">Seu nome (para o mestre saber quem é)</label><input type="text" id="clQuem" name="quem" maxlength="40" value="${esc(f.jogador || "")}" required></div>`,
        "Enviar pedido"
      );
      if (!r) return;
      try {
        await S.db.set(P() + "/pedidos/" + S.uid, {
          fichaId: id,
          nome: f.nome,
          quem: r.quem.trim(),
          ts: Date.now()
        });
        toast("Pedido enviado ao mestre.");
      } catch (e) {
        fail(e);
      }
    };
  $$("[data-aprova]").forEach(
    b =>
      (b.onclick = async () => {
        const uid = b.dataset.aprova;
        const pd = (S.pedidos || []).find(x => x.id === uid);
        if (!pd) return;
        if (
          !(await confirmBox(
            "Dar a ficha para " + (pd.quem || "este jogador") + "?",
            "A ficha passa a ser dele. Quem era o dono antes perde a edição.",
            "Dar a ficha"
          ))
        )
          return;
        try {
          f.dono = uid;
          await S.db.merge(P() + "/fichas/" + id, { dono: uid });
          await S.db.del(P() + "/pedidos/" + uid);
          (S.tokens || [])
            .filter(t => t.fichaId === id)
            .forEach(t => S.db.merge(P() + "/tokens/" + t.id, { dono: uid }).catch(() => {}));
          toast("Ficha transferida.");
        } catch (e) {
          fail(e);
        }
      })
  );
  $$("[data-recusa]").forEach(
    b => (b.onclick = () => S.db.del(P() + "/pedidos/" + b.dataset.recusa).catch(fail))
  );
  if (!canEditFicha(f)) return;
  const sv = now => {
    saveFicha(id, now);
  };
  const rr = () => {
    renderPanel();
  };
  $$("#pbody [data-f]").forEach(el => {
    const k = el.dataset.f;
    const num = el.type === "number" || k === "nex";
    if (el.tagName === "SELECT" || num)
      el.onchange = () => {
        f[k] = num ? +el.value || 0 : el.value;
        if (k === "classe") f.trilha = "";
        sv();
        rr();
        renderBoard();
      };
    else
      el.oninput = () => {
        f[k] = el.value;
        sv();
      };
  });
  $$("#pbody [data-patsel]").forEach(
    el =>

        rr();
      })

    b =>
      (b.onclick = () => {

    ];

    }

  // história

<script>
"use strict";
/* Painel Rolagens: rolar dados, teste de Ordem, chat. */
/* ===================== ROLAGENS ===================== */
function rolagensHTML() {
  const opts = Object.entries(S.fichas).filter(([id, f]) => S.isM || f.dono === S.uid);
  return `<form class="box stack" id="fRoll">
    <div class="field"><label class="label" for="rollQuem">Quem rola</label><select id="rollQuem">${S.isM ? `<option value="">Mestre</option>` : ""}${opts.map(([id, f]) => `<option value="${esc(id)}">${esc(f.nome)}</option>`).join("")}${!S.isM && !opts.length ? `<option value="">Jogador</option>` : ""}</select></div>
    <div class="row" style="flex-wrap:nowrap"><input type="text" id="rollExpr" placeholder="Ex.: 2d6+3" autocomplete="off" aria-label="Expressão de dados"><button class="btn primary">Rolar</button></div>
    <div class="dicebar">${["1d20", "1d4", "1d6", "1d8", "1d10", "1d12", "2d6", "1d100"].map(x => `<button type="button" class="btn sm" data-quick="${x}">${x}</button>`).join("")}</div>
    <div class="field"><span class="label">Teste de Ordem (Xd20, fica com o maior)</span><div class="row"><input type="number" id="testeAttr" value="2" style="width:64px" aria-label="Atributo"><span class="muted">d20 +</span><input type="number" id="testeMod" value="0" style="width:64px" aria-label="Modificador"><button type="button" class="btn" id="btnTeste">Testar</button></div></div>
   </form>
   <div class="row" style="flex-wrap:nowrap"><label class="label" for="paraSel" style="white-space:nowrap;margin:0">Para</label><select id="paraSel">${destinos()
     .map(
       ([v, n]) =>
         `<option value="${esc(v)}" ${(S.paraRolagem || "") === v ? "selected" : ""}>${esc(n)}</option>`
     )
     .join("")}</select></div>
   <form class="row" id="fChat" style="flex-wrap:nowrap"><input type="text" id="chatIn" maxlength="300" placeholder="${S.paraRolagem ? "Mensagem privada…" : "Falar na mesa…"}" aria-label="Mensagem"><button class="btn">Enviar</button></form>
   <p class="muted small" style="margin:0">O "Para" vale para o chat, para as rolagens daqui e para os testes feitos na ficha.</p>
   ${S.isM ? `<button class="btn" id="btnDoc">Enviar documento ou pista</button>` : ""}
   <div class="row between"><span class="sub">Registro da mesa</span>${S.isM ? `<button class="btn sm ghost" id="btnLimparLog">Limpar registro</button>` : ""}</div>
   <div class="log" id="log"></div>`;
}
function renderLog() {
  const el = $("#log");
  if (!el) return;
  if (!S.log.length && !(S.priv || []).length) {
    el.innerHTML = `<div class="empty">${S.loaded.log ? "Nada rolado ainda. Abra uma ficha e toque numa perícia, ou role aqui em cima." : "Carregando registro…"}</div>`;
    return;
  }
  const all = [...S.log.map(x => ({ ...x, _p: 0 })), ...(S.priv || []).map(x => ({ ...x, _p: 1 }))]
    .sort((a, b) => (b.ts || 0) - (a.ts || 0))
    .slice(0, 150);
  el.innerHTML = all.map(x => (x._p ? privRow(x) : logRow(x))).join("");
  el.querySelectorAll("[data-doc]").forEach(
    b =>
      (b.onclick = () => {
        const d = (S.priv || []).find(x => x.id === b.dataset.doc);
        if (d) abrirDoc(d);
      })
  );
}
function logRow(e) {
  const t = new Date(e.ts || 0).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
  if (e.tipo === "chat")
    return `<div class="entry chat"><span class="wh"><b>${esc(e.quem || "Jogador")}</b> · ${t}</span><span class="wt">${esc(e.titulo)}</span></div>`;
  return `<div class="entry ${esc(e.flag)}${e.secreto ? " secret" : ""}"><span class="wh"><b>${esc(e.quem || "Mestre")}</b> · ${t}</span><span class="wt">${esc(e.titulo)}${e.flag === "crit" ? " · crítico" : ""}</span><span class="det">${esc(e.det)}</span><span class="tot">${e.total ?? "✦"}</span></div>`;
}
function quemNome() {
  const id = $("#rollQuem") && $("#rollQuem").value;
  return id && S.fichas[id] ? S.fichas[id].nome : S.isM ? "Mestre" : "Jogador";
}
function bindRolagens() {
  const sec = () => false;
  const para = () => S.paraRolagem || "";
  $("#paraSel").onchange = () => {
    S.paraRolagem = $("#paraSel").value;
    const ci = $("#chatIn");
    if (ci) ci.placeholder = S.paraRolagem ? "Mensagem privada…" : "Falar na mesa…";
  };
  {
    const bd = $("#btnDoc");
    if (bd) bd.onclick = novoDocumento;
  }
  $$("[data-quick]").forEach(
    b =>
      (b.onclick = () => {
        $("#rollExpr").value = b.dataset.quick;
        $("#fRoll").requestSubmit();
      })
  );
  $("#fRoll").onsubmit = ev => {
    ev.preventDefault();
    const ex = $("#rollExpr").value.trim() || "1d20";
    const r = rollExpr(ex);
    if (!r) {
      toast("Expressão inválida. Use algo como 2d6+3.");
      return;
    }
    const n20 = /^1d20\[20\]/.test(r.detail);
    logEntry({
      quem: quemNome(),
      titulo: `Rolagem ${ex}`,
      total: r.total,
      det: r.detail,
      flag: n20 ? "crit" : "",
      para: para()
    });
  };
  $("#btnTeste").onclick = () => {
    const a = +$("#testeAttr").value || 0,
      m = +$("#testeMod").value || 0;
    const r = rollTest(a, m);
    logEntry({
      quem: quemNome(),
      titulo: `Teste (${a}d20)`,
      total: r.total,
      det: `${r.dice.length}d20[${r.dice.join(",")}] fica ${r.mode} ${r.kept}${sgn(m)}`,
      flag: r.kept === 20 ? "crit" : r.kept === 1 ? "fail" : "",
      para: para()
    });
  };
  $("#fChat").onsubmit = ev => {
    ev.preventDefault();
    const t = $("#chatIn").value.trim();
    if (!t) return;
    $("#chatIn").value = "";
    logEntry({ quem: quemNome(), titulo: t, tipo: "chat", para: para() });
  };
  const lim = $("#btnLimparLog");
  if (lim)
    lim.onclick = async () => {
      if (
        !(await confirmBox("Limpar o registro?", "Todas as rolagens e mensagens somem para todos.", "Limpar"))
      )
        return;
      for (const e of S.log) {
        try {
          await S.db.del(P() + "/log/" + e.id);
        } catch (err) {
          fail(err);
          break;
        }
      }
      toast("Registro limpo.");
    };
}
</script>
<script>
"use strict";
/* Painel Combate: iniciativa, turnos, ataques do bestiário. */
/* ===================== COMBATE ===================== */
function combateHTML() {
  const c = S.combate || { lista: [], turno: 0, rodada: 1 };
  const L = c.lista || [];
  const B = allBest();
  const rows = L.map((x, i) => {
    const f = x.fichaId && S.fichas[x.fichaId];
    const pv = f ? cur(f, "pv") : (x.pv ?? "?");
    const pvMax = f ? derivados(migrar(f)).pvMax : (x.pvMax ?? "?");
    const def = f ? derivados(f).def : (x.def ?? "?");
    const tk = tokenDeEntrada(x);
    return `<div class="cb ${x.tipo} ${i === c.turno ? "now" : ""} ${pv <= 0 ? "down" : ""}"><span class="iv">${x.ini ?? "–"}</span><div style="min-width:0"><div class="cn">${tk ? `<button class="lnk" data-foco="${esc(tk)}" title="Mostrar no mapa">${esc(f ? f.nome : x.nome)} ⌖</button>` : esc(f ? f.nome : x.nome)}${x.el ? ` <span class="tag el-${esc(x.el)}" style="border-color:var(--el);color:var(--el)">${esc(x.el)}</span>` : ""}</div><div class="cs">PV ${pv}/${pvMax} · DEF ${def}${x.vd ? ` · VD ${x.vd}` : ""}${x.atk ? ` · ${esc(x.atk[0])} ${x.atk[1]}d20+${x.atk[2]} · ${esc(x.atk[3])}` : ""}</div></div>
     <div class="act">${f && f.npc && S.isM ? `<button class="btn sm" data-cfic="${esc(x.fichaId)}">Ficha</button><button class="btn sm" data-cfd="${esc(x.fichaId)}" data-d="-5" aria-label="Tirar 5 PV">−5</button><button class="btn sm" data-cfd="${esc(x.fichaId)}" data-d="5" aria-label="Dar 5 PV">+5</button>` : ""}${x.tipo === "npc" && S.isM ? `<button class="rollbtn" data-npcatk="${i}" ${x.atk ? "" : "disabled"}>Atacar</button><button class="btn sm" data-npcdmg="${i}" data-d="-1" aria-label="Tirar 5 PV">−5</button><button class="btn sm" data-npcdmg="${i}" data-d="1" aria-label="Dar 5 PV">+5</button>` : ""}${S.isM ? `<button class="btn sm ghost" data-rm="${i}" aria-label="Tirar do combate">✕</button>` : ""}</div></div>`;
  }).join("");
  return `<div class="row between"><h3>Rodada ${c.rodada || 1}</h3>${S.isM ? `<div class="row"><button class="btn sm" id="btnIni">Rolar iniciativa</button><button class="btn sm primary" id="btnProx" ${L.length ? "" : "disabled"}>Próximo turno</button></div>` : ""}</div>
   ${L.length ? `<div class="cards">${rows}</div>` : `<div class="empty">${S.isM ? "Ninguém em combate. Adicione os agentes e os inimigos abaixo, depois toque em <b>Rolar iniciativa</b>." : "Nenhum combate agora."}</div>`}
   ${
     S.isM
       ? `<button class="btn sm" id="btnTokCena" ${S.viewSid ? "" : "disabled"}>Adicionar os tokens da cena</button>
   <div class="sub">Agentes</div><div class="row">${
     Object.entries(S.fichas)
       .sort(
         (a, b) =>
           !!a[1].npc - !!b[1].npc ||
           String(a[1].nome).localeCompare(String(b[1].nome), "pt-BR", { numeric: true })
       )
       .map(
         ([id, f]) =>
           `<button class="btn sm${f.npc ? " ghost" : ""}" data-addpc="${esc(id)}">${esc(f.nome)}</button>`
       )
       .join("") || '<span class="muted small">Crie fichas primeiro.</span>'
   }</div>
   <div class="sub">Bestiário</div><div class="row" style="flex-wrap:nowrap"><select id="bestSel">${B.map((b, i) => `<option value="${i}">${esc(b.n)}${b.el ? " · " + esc(b.el) : ""} · VD ${b.vd}${b.hb ? " (homebrew)" : ""}</option>`).join("")}</select><button class="btn" id="btnAddBest">Adicionar</button></div>
   <div class="muted small" id="bestInfo"></div>
   <button class="btn sm ghost" id="btnFim">Encerrar combate</button>`
       : ""
   }
   <p class="muted small" style="margin:0">Rodada: sua ação → aliados → inimigo. Inimigos rolam os d20 do ataque (fica o maior) + bônus contra a Defesa; 20 natural é crítico e dobra os dados de dano.</p>`;
}
function saveCombate(c) {
  S.combate = c;
  queueSet(P() + "/estado/combate", JSON.parse(JSON.stringify(c)));
  renderPanel();
}
const combBase = () => JSON.parse(JSON.stringify(S.combate || { lista: [], turno: 0, rodada: 1 }));
function bindCombate() {
  $$("[data-foco]").forEach(
    b =>
      (b.onclick = () => {
        if (window.innerWidth <= 760) openTool(null);
        centrarNo(b.dataset.foco);
      })
  );
  // criaturas no combate: abrir a ficha e mudar PV direto (ficha/criaturas)
  $$("[data-cfic]").forEach(
    b =>
      (b.onclick = () => {
        S.openFicha = b.dataset.cfic;
        S.sheetTab = "principal";
        openTool("agentes");
      })
  );
  $$("[data-cfd]").forEach(
    b =>
      (b.onclick = () => {
        const f = S.fichas[b.dataset.cfd];
        if (!f) return;
        const max = derivados(migrar(f)).pvMax;
        f.pv = Math.max(-max, Math.min(max, cur(f, "pv") + +b.dataset.d));
        saveFicha(b.dataset.cfd, true);
        renderPanel();
        renderBoard();
      })
  );
  if (!S.isM) return;
  const B = allBest();
  {
    const tc = $("#btnTokCena");
    if (tc) tc.onclick = addTokensAoCombate;
  }
  const show = () => {
    const b = B[+$("#bestSel").value];
    if (b)
      $("#bestInfo").textContent =
        `${b.el || "Realidade"} · VD ${b.vd} · DEF ${b.def} · PV ${b.pv}${b.atk ? ` · ${b.atk[0]} ${b.atk[1]}d20+${b.atk[2]} (${b.atk[3]})` : ""}${b.pres ? " · Presença perturbadora " + b.pres : ""} · AGI ${b.at[0]} FOR ${b.at[1]} INT ${b.at[2]} PRE ${b.at[3]} VIG ${b.at[4]}`;
  };
  $("#bestSel").onchange = show;
  show();
  $("#btnAddBest").onclick = () => {
    const b = B[+$("#bestSel").value];
    const c = combBase();
    const n = c.lista.filter(x => x.base === b.n).length;
    c.lista.push({
      id: rid(5),
      tipo: "npc",
      base: b.n,
      nome: b.n + (n ? " " + (n + 1) : ""),
      pv: b.pv,
      pvMax: b.pv,
      def: b.def,
      atk: b.atk,
      el: b.el,
      vd: b.vd,
      agi: b.at[0],
      ini: null
    });
    saveCombate(c);
  };
  $$("[data-addpc]").forEach(
    btn =>
      (btn.onclick = () => {
        const id = btn.dataset.addpc;
        const c = combBase();
        if (c.lista.some(x => x.fichaId === id)) {
          toast("Esse agente já está no combate.");
          return;
        }
        c.lista.push({ id: rid(5), tipo: "pc", fichaId: id, nome: S.fichas[id].nome, ini: null });
        saveCombate(c);
      })
  );
  $("#btnIni").onclick = () => {
    const c = combBase();
    const det = [];
    c.lista.forEach(x => {
      if (x.fichaId) {
        const f = S.fichas[x.fichaId];
        if (!f) return;
        migrar(f);
        const r = rollTest(f.attr.AGI, modPericia(f, "Iniciativa"));
        x.ini = r.total;
        x.nome = f.nome;
        det.push(`${f.nome} ${r.total}`);
      } else {
        const r = rollTest(Math.max(1, x.agi || 1), Math.round((x.vd || 20) / 10));
        x.ini = r.total;
        det.push(`${x.nome} ${x.ini}`);
      }
    });
    c.lista.sort((a, b) => (b.ini ?? -99) - (a.ini ?? -99));
    c.turno = 0;
    c.rodada = 1;
    saveCombate(c);
    logEntry({ quem: "Mestre", titulo: "Iniciativa", total: null, det: det.join(" · ") });
  };
  $("#btnProx").onclick = () => {
    const c = combBase();
    if (!c.lista.length) return;
    c.turno = (c.turno || 0) + 1;
    if (c.turno >= c.lista.length) {
      c.turno = 0;
      c.rodada = (c.rodada || 1) + 1;
    }
    saveCombate(c);
    const x = c.lista[c.turno];
    const f = x.fichaId && S.fichas[x.fichaId];
    logEntry({ quem: "Mestre", titulo: `Vez de ${f ? f.nome : x.nome}`, tipo: "chat" });
  };
  $$("[data-rm]").forEach(
    b =>
      (b.onclick = () => {
        const c = combBase();
        c.lista.splice(+b.dataset.rm, 1);
        if (c.turno >= c.lista.length) c.turno = 0;
        saveCombate(c);
      })
  );
  $$("[data-npcdmg]").forEach(
    b =>
      (b.onclick = () => {
        const c = combBase();
        const x = c.lista[+b.dataset.npcdmg];
        x.pv = Math.max(0, Math.min(x.pvMax, x.pv + +b.dataset.d * 5));
        saveCombate(c);
      })
  );
  $$("[data-npcatk]").forEach(
    b =>
      (b.onclick = () => {
        const x = (S.combate.lista || [])[+b.dataset.npcatk];
        if (!x.atk) {
          toast("Essa ameaça não tem ataque simples: use as habilidades do livro.");
          return;
        }
        const r = rollTest(x.atk[1], x.atk[2]);
        const crit = r.kept === 20;
        const dm = rollExpr(x.atk[3], { critMult: crit ? 2 : 1 });
        logEntry({
          quem: x.nome,
          titulo: `${x.atk[0]} · dano ${dm ? dm.total : "?"}`,
          total: r.total,
          flag: crit ? "crit" : r.kept === 1 ? "fail" : "",
          det: `${r.dice.length}d20[${r.dice.join(",")}] ${r.kept} +${x.atk[2]}${crit ? " · crítico" : ""} → dano ${dm ? dm.detail : x.atk[3]}`
        });
      })
  );
  $("#btnFim").onclick = () => saveCombate({ lista: [], turno: 0, rodada: 1 });
}
</script>
<script>
"use strict";
/* Escudo do mestre: capa, acesso, anotações, tabelas rápidas. */
/* ===================== ESCUDO DO MESTRE ===================== */
function escudoHTML() {
  if (!S.isM) return `<div class="empty">Só o mestre abre o escudo.</div>`;
  const ids = Object.keys(S.fichas).sort((a, b) => (S.fichas[a].criada || 0) - (S.fichas[b].criada || 0));
  const sb = (f, id, k, lab, max) => {
    const v = cur(f, k);
    return `<div class="label" style="text-align:center;margin-top:2px">${lab}</div><div class="sbar ${k}"><button data-sb="${esc(id)}" data-k="${k}" data-d="-1" aria-label="Diminuir ${lab}">‹</button><div class="t"><i style="width:${Math.max(0, Math.min(100, (v / max) * 100))}%"></i><span>${v} / ${max}</span></div><button data-sb="${esc(id)}" data-k="${k}" data-d="1" aria-label="Aumentar ${lab}">›</button></div>`;
  };
  const cards = ids
    .map(id => {
      const f = migrar(S.fichas[id]);
      const D = derivados(f);
      return `<div class="scard"><div class="top">${avatar(f)}<div style="min-width:0"><div class="nm">${esc(f.nome)}</div><div class="muted small">${esc(f.classe)} · ${esc(f.origem)} · NEX ${f.nex}%</div></div></div>
    <div class="mini">${ATTRS.map(k => `<div><b>${f.attr[k]}</b><span>${k}</span></div>`).join("")}</div>
    <div>${sb(f, id, "pv", "Vida", D.pvMax)}${sb(f, id, "san", "Sanidade", D.sanMax)}${sb(f, id, "pe", "Esforço", D.peMax)}</div>
    <div class="muted small" style="font-family:var(--f-mono)">DEF ${D.def} · RD ${D.rd} · PE/turno ${D.limPE} · DESL ${esc(f.desl || "9m")} · DT ritual ${D.dtRit} · ${esc(D.pat[1])}</div>
    ${[...condAuto(f), ...(f.cond || [])].length ? `<div class="conds">${[...condAuto(f), ...(f.cond || [])].map(c => `<span class="tag red" title="${esc(CONDICOES_LIVRO[c] || "")}">${esc(c)}</span>`).join("")}</div>` : ""}
    <div class="row"><button class="btn sm" data-sopen="${esc(id)}">Abrir ficha</button><button class="btn sm" data-svont="${esc(id)}">Vontade</button><button class="btn sm" data-sperc="${esc(id)}">Percepção</button></div></div>`;
    })
    .join("");
  const peds = (S.pedidos || []).filter(x => S.fichas[x.fichaId]);
  const pedHTML = peds.length
    ? `<div class="banner" style="border-color:var(--purple);color:var(--fg);background:var(--purple-soft)"><b>Pedidos de ficha:</b> ${peds.map(x => `${esc(x.quem || "Jogador")} pede <b>${esc(S.fichas[x.fichaId].nome)}</b> <button class="btn sm" data-sopen="${esc(x.fichaId)}">Ver</button>`).join(" · ")}</div>`
    : "";
  const backup = `<details class="box"><summary style="cursor:pointer"><b>Backup da mesa</b></summary><div class="stack" style="margin-top:10px"><p class="muted small" style="margin:0">Baixa um arquivo com tudo: fichas, NPCs, cenas, tokens, névoa, desenhos, homebrew, anotações e trilhas. Para restaurar, use "Restaurar mesa de um backup" na página inicial.</p><button class="btn" id="btnBkp">Baixar backup da mesa</button></div></details>`;
  // capa da mesa (mesa/capa) em cima; apagar mesa (mestre/gestao) embaixo
  return (
    escudoCapaHTML() +
    acessoHTML() +
    pedHTML +
    `<div class="shield">${cards || `<div class="empty">Nenhum agente na mesa ainda.</div>`}</div>
   <div class="sgrid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))">
    <div class="box stack"><h3>Anotações do mestre</h3><p class="muted small" style="margin:0">Só você vê. Ganchos, segredos, próximos passos.</p><textarea id="notasM" style="min-height:180px" aria-label="Anotações do mestre">${esc(S.notas)}</textarea><span class="muted small" id="notasSt"></span></div>
    <div class="box stack"><h3>Referência rápida</h3>
     <table class="t dtref"><thead><tr><th>Dificuldade</th><th>DT</th></tr></thead><tbody>${DT_REF.map(([n, v]) => `<tr><td style="font-family:var(--f-body)">${n}</td><td>${v}</td></tr>`).join("")}</tbody></table>
     <p class="muted small" style="margin:0">Presença perturbadora: teste de Vontade contra a DT da criatura; falhar causa o dano mental indicado. Agentes com NEX igual ou acima do indicado são imunes. Fraquezas: Sangue teme Morte, Morte teme Energia, Energia teme Conhecimento, Conhecimento teme Sangue.</p></div>
    <div class="box stack"><h3>Rolagens secretas</h3>
     <div class="row" style="flex-wrap:nowrap"><input type="text" id="secExpr" placeholder="1d20+5" aria-label="Rolagem secreta"><button class="btn primary" id="secRoll">Rolar escondido</button></div>
     <div class="log">${S.secret.length ? S.secret.map(logRow).join("") : `<div class="empty">Rolagens que os jogadores não veem aparecem aqui (somem ao fechar a página).</div>`}</div></div>
   </div>
   ${backup}` +
    escudoApagarHTML()
  );
}
let notasT = null;
function bindEscudo() {
  bindEscudoCapa(); // mesa/capa
  bindEscudoApagar(); // mestre/gestao
  if (!S.isM) return;
  $$("[data-sb]").forEach(
    b =>
      (b.onclick = () => {
        const id = b.dataset.sb,
          k = b.dataset.k;
        const f = S.fichas[id];
        const max = derivados(f)[k + "Max"];
        f[k] = Math.max(k === "pv" ? -max : 0, Math.min(max, cur(f, k) + +b.dataset.d));
        saveFicha(id);
        renderPanel();
        renderBoard();
      })
  );
  $$("[data-sopen]").forEach(
    b =>
      (b.onclick = () => {
        S.openFicha = b.dataset.sopen;
        openTool("agentes");
      })
  );
  const quick = (id, p) => {
    const f = migrar(S.fichas[id]);
    const a = PERICIAS.find(x => x[0] === p)[1];
    const m = modPericia(f, p);
    const r = rollTest(f.attr[a], m);
    logEntry({
      quem: f.nome,
      titulo: `${p} (pedido do mestre)`,
      total: r.total,
      det: `${r.dice.length}d20[${r.dice.join(",")}] fica ${r.mode} ${r.kept}${sgn(m)}`,
      flag: r.kept === 20 ? "crit" : r.kept === 1 ? "fail" : "",
      secreto: true
    });
  };
  $$("[data-svont]").forEach(b => (b.onclick = () => quick(b.dataset.svont, "Vontade")));
  $$("[data-sperc]").forEach(b => (b.onclick = () => quick(b.dataset.sperc, "Percepção")));
  bindAcesso();
  {
    const bk = $("#btnBkp");
    if (bk) bk.onclick = exportarMesa;
  }
  const ta = $("#notasM");
  ta.oninput = () => {
    S.notas = ta.value;
    $("#notasSt").textContent = "Salvando…";
    clearTimeout(notasT);
    notasT = setTimeout(async () => {
      try {
        await S.db.set(P() + "/mestre/notas", { texto: S.notas });
        $("#notasSt") && ($("#notasSt").textContent = "Salvo");
      } catch (e) {
        fail(e);
      }
    }, 800);
  };
  $("#secRoll").onclick = () => {
    const ex = $("#secExpr").value.trim() || "1d20";
    const r = rollExpr(ex);
    if (!r) {
      toast("Expressão inválida.");
      return;
    }
    logEntry({ quem: "Mestre", titulo: `Secreta ${ex}`, total: r.total, det: r.detail, secreto: true });
  };
}
</script>

<script>
"use strict";
/* Condições nas rolagens (a mais severa vale) e o aviso de Morrendo. */
/* ===================== CONDIÇÕES NAS ROLAGENS =====================
   Regra do livro: condições com o mesmo efeito não se acumulam; vale a mais severa. */
const PEN_COND = {
  // [d20 a tirar, alcance] alcance: tudo | pericia | ataque | ataque-cac | AGI/FOR/VIG… | nome da perícia
  Abalado: [1, "tudo"],
  Apavorado: [2, "pericia"],
  Agarrado: [1, "ataque"],
  Cego: [2, "AGI FOR"],
  Debilitado: [2, "AGI FOR VIG"],
  Fraco: [1, "AGI FOR VIG"],
  Esmorecido: [2, "INT PRE"],
  Frustrado: [1, "INT PRE"],
  Enredado: [1, "ataque"],
  Ofuscado: [1, "ataque Percepção"],
  Fascinado: [2, "Percepção"],
  Surdo: [2, "Iniciativa"],
  Caído: [2, "ataque-cac"],
  Desprevenido: [1, "Reflexos"]
};
const DEF_COND = {
  Desprevenido: 5,
  Vulnerável: 5,
  Indefeso: 10,
  Agarrado: 5,
  Atordoado: 5,
  Cego: 5,
  Surpreendido: 5,
  Exausto: 5,
  Fatigado: 5,
  Enredado: 5,
  Paralisado: 10,
  Inconsciente: 10
};
function condsAtivas(f) {
  return [...new Set([...condAuto(f), ...(f.cond || [])])];
}
// tipo: "pericia" ou "ataque"; attr: atributo usado; nome: perícia; cac: ataque corpo a corpo
function penalidade(f, { tipo, attr, nome, cac }) {
  let max = 0;
  const quem = [];
  for (const c of condsAtivas(f)) {
    const p = PEN_COND[c];
    if (!p) continue;
    const [d, al] = p;
    const alc = al.split(" ");
    const vale =
      alc.includes("tudo") ||
      (tipo === "pericia" && alc.includes("pericia")) ||
      (tipo === "ataque" && alc.includes("ataque")) ||
      (tipo === "ataque" && cac && alc.includes("ataque-cac")) ||
      alc.includes(attr) ||
      alc.includes(nome);
    if (vale) {
      quem.push(c);
      max = Math.max(max, d);
    }
  }
  // proteção sem proficiência: −2d20 em testes de FOR e AGI
  const c0 = CLASSES[f.classe] || {};
  const semProf = (f.protecoes || []).some(
    p =>
      p.usando !== false &&
      (/pesada|Escudo/i.test(p.nome)
        ? !(f.poderes || []).includes("Proteção Pesada")
        : !(c0.prof || []).includes("leves"))
  );
  if (semProf && (attr === "FOR" || attr === "AGI")) {
    max = Math.max(max, 2);
    quem.push("proteção sem proficiência");
  }
  let mod = 0;
  const D = derivados(f);
  if (
    D.usados > D.carga &&
    tipo === "pericia" &&
    /carga/.test((PERICIAS.find(x => x[0] === nome) || [])[2] || "")
  ) {
    mod -= 5;
    quem.push("sobrecarregado −5");
  }
  return { dados: max, mod, quem };
}

/* ===================== MORRENDO ===================== */
function morrendoHTML(f) {
  const pv = cur(f, "pv");
  if (pv > 0) return "";
  const n = +f.morrendo || 0;
  return `<div class="banner" style="border-color:var(--red);color:var(--fg);background:var(--red-soft)"><b>Morrendo.</b> Rodadas morrendo nesta cena: <b style="font-family:var(--f-mono)">${n}/3</b>${n > 3 ? " · <b>o agente morreu</b>" : ""}
   <div class="row" style="margin-top:6px"><button type="button" class="btn sm" id="mrMais">+1 rodada</button><button type="button" class="btn sm ghost" id="mrZera">Zerar</button></div>
   <div class="muted small" style="margin-top:4px">Mais de 3 rodadas morrendo na mesma cena, sem voltar a ter 1 PV, e o agente morre.</div></div>`;
}
</script>

<script>
"use strict";
/* Backup: baixar e restaurar fichas e mesas inteiras (.json). */
/* ===================== BACKUP ===================== */
function baixar(nome, obj) {
  const blob = new Blob([JSON.stringify(obj)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = nome;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => {
    URL.revokeObjectURL(a.href);
    a.remove();
  }, 2000);
}
function slug(s) {
  return (
    String(s || "x")
      .normalize("NFD")
      .replace(/[̀-ͯ]/g, "")
      .replace(/[^a-z0-9]+/gi, "-")
      .replace(/^-|-$/g, "")
      .toLowerCase()
      .slice(0, 40) || "x"
  );
}
function pickFile(accept) {
  return new Promise(res => {
    const inp = document.createElement("input");
    inp.type = "file";
    inp.accept = accept;
    inp.onchange = () => res(inp.files[0] || null);
    inp.click();
  });
}
async function lerJSON(accept = ".json,application/json") {
  const f = await pickFile(accept);
  if (!f) return null;
  try {
    return JSON.parse(await f.text());
  } catch (e) {
    toast("Esse arquivo não é um backup do Simula Ordem.");
    return null;
  }
}
function exportarFicha(id) {
  const f = S.fichas[id];
  if (!f) return;
  const rest = limparPersonagem(f);
  baixar(`ficha-${slug(f.nome)}.json`, {
    tipo: "simula-ordem-ficha",
    v: 1,
    exportada: Date.now(),
    ficha: rest
  });

}
async function importarFicha() {

    toast("Esse arquivo não é uma ficha do Simula Ordem.");

async function importarMesa() {

<script>
"use strict";
/* NPCs do mestre: receber do banco e onde cada ficha é salva. */
/* ===================== NPCs DO MESTRE ===================== */
function syncNpcs() {
  const modo = S.isM ? "all" : "vis";
  if (S.npcMode === modo) return;
  if (S.npcUnsub) S.npcUnsub();
  S.npcMode = modo;
  const on = list => {
    const next = {};
    Object.entries(S.fichas).forEach(([k, f]) => {
      if (!f.npc) next[k] = f;
    });
    list.forEach(x => {
      const { id, ...r } = x;
      const old = S.fichas[id];
      if (old && S.dirty[id]) next[id] = old;
      else if (old && old.npc) {
        for (const k of Object.keys(old)) if (!(k in r) && k !== "npc") delete old[k];
        Object.assign(old, r, { npc: true });
        next[id] = old;
      } else next[id] = { ...r, npc: true };
    });
    S.fichas = next;
    renderBoard();
    if (["agentes", "escudo", "combate", "tokens", "rolagens"].includes(S.tool) && !isEditing())
      renderPanel();
  };
  S.npcUnsub = S.db.listenCol(P() + "/npcs", S.isM ? null : { where: ["visivel", true] }, on, () => {});
}
function fichaPath(id) {
  const f = S.fichas[id];
  if (f && f.solo) return "usuarios/" + S.uid + "/personagens/" + id; // personagem fora de mesa (mesa/personagens)
  return P() + (f && f.npc ? "/npcs/" : "/fichas/") + id;
}

/* Combate no mapa: de quem é a vez, centrar no token, pôr tokens no combate. */
/* ===================== COMBATE NO MAPA ===================== */
function vezAtual() {
  const c = S.combate;
  if (!c || !(c.lista || []).length) return null;
  return c.lista[c.turno || 0] || null;
}
function tokenDaVez(t) {
  const x = vezAtual();
  if (!x) return false;
  return (x.fichaId && t.fichaId === x.fichaId) || (x.id && t.combId === x.id);
}
function centrarNo(tid) {
  const p = S.pos[tid];
  if (!p) return;

  V.x = r.width / 2 - p.x * V.z;
  V.y = r.height / 2 - p.y * V.z;

}
function tokenDeEntrada(x) {

    const t = S.tokens.find(y => y.id === tid);
    if (t && ((x.fichaId && t.fichaId === x.fichaId) || (t.combId && t.combId === x.id))) return tid;
  }
  return null;
}
function addTokensAoCombate() {
  const c = combBase();
  let n = 0;
  for (const tid of Object.keys(S.pos)) {
    const t = S.tokens.find(y => y.id === tid);
    if (!t) continue;
    if (t.fichaId && S.fichas[t.fichaId]) {
      if (!c.lista.some(x => x.fichaId === t.fichaId)) {

          nome: S.fichas[t.fichaId].nome,
          ini: null
        });
        n++;
      }
    } else if (t.combId && c.lista.some(x => x.id === t.combId)) {
    } else if (t.ameaca) {
      const b = allBest().find(y => y.n === t.ameaca);
      if (!b) continue;

        nome: t.nome,

        def: b.def,

        el: b.el,
        vd: b.vd,

        ini: null
      });
      t.combId = cid;

  if (!n) {

<script>
"use strict";
/* Trilha sonora: YouTube, arquivos e músicas livres sincronizadas para todos. */
/* ===================== TRILHA SONORA ===================== */
const MZ = { el: null, yt: null, ytReady: false, cur: null, unlocked: false, vol: +lsGet("ms_mvol", 0.6) };
function ytId(u) {
  const m = String(u).match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);
  return m ? m[1] : null;
}
function subscribeTrilha() {
  subscribeMapDocs(); // documentos no mapa (documentos/no-mapa)
  if (S.trilhaUnsub) return;
  S.trilhaUnsub = S.db.listenDoc(
    P() + "/estado/trilhas",
    d => {
      S.trilha = d || { lista: [], tocando: null };
      aplicarTrilha();
      if (S.tool === "trilha") renderPanel();
      renderBoardTop();
    },
    () => {}
  );
}
function posAlvo(t) {
  return (t.pos || 0) + (t.play ? Math.max(0, (Date.now() - (t.at || Date.now())) / 1000) : 0);
}
function pararLocal() {
  if (MZ.el) {
    MZ.el.pause();
    MZ.el.removeAttribute("src");
    MZ.el.load();
  }
  if (MZ.yt && MZ.ytReady) {
    try {
      MZ.yt.stopVideo();
    } catch (e) {}
  }
  MZ.cur = null;
}
function aplicarTrilha() {
  const t = S.trilha && S.trilha.tocando;
  if (!t || !t.src) {
    pararLocal();
    return;
  }
  const vid = ytId(t.src);
  const vol = Math.max(0, Math.min(1, MZ.vol * (t.vol ?? 1)));
  if (vid) {
    if (MZ.el) MZ.el.pause();
    carregarYT(() => {
      if (MZ.cur !== t.src) {
        MZ.cur = t.src;
        MZ.yt.loadVideoById({ videoId: vid, startSeconds: posAlvo(t) });
        if (!t.play) setTimeout(() => MZ.yt.pauseVideo(), 400);
      }
      MZ.yt.setVolume(Math.round(vol * 100));
      const ct = MZ.yt.getCurrentTime ? MZ.yt.getCurrentTime() : 0;
      if (Math.abs(ct - posAlvo(t)) > 3) MZ.yt.seekTo(posAlvo(t), true);
      if (t.play) MZ.yt.playVideo();
      else MZ.yt.pauseVideo();
    });
    return;
  }
  if (MZ.yt && MZ.ytReady) {
    try {
      MZ.yt.stopVideo();
    } catch (e) {}
  }
  if (!MZ.el) {
    MZ.el = new Audio();
    MZ.el.preload = "auto";
    MZ.el.onerror = () => {
      if (S.isM)
        toast("Não consegui tocar essa música. Use um link direto de MP3/OGG ou de vídeo do YouTube.");
    };
  }
  MZ.el.loop = !!t.loop;
  MZ.el.volume = vol;
  const go = () => {
    if (Math.abs(MZ.el.currentTime - posAlvo(t)) > 2) {
      try {
        MZ.el.currentTime = t.loop && MZ.el.duration ? posAlvo(t) % MZ.el.duration : posAlvo(t);
      } catch (e) {}
    }
    if (t.play)
      MZ.el
        .play()
        .then(() => {
          MZ.unlocked = true;
          renderBoardTop();
        })
        .catch(() => {
          MZ.bloqueado = true;
          renderBoardTop();
        });
    else MZ.el.pause();
  };
  if (MZ.cur !== t.src) {
    MZ.cur = t.src;
    MZ.el.src = t.src;
    MZ.el.addEventListener("loadedmetadata", go, { once: true });
    MZ.el.load();
  } else go();
}
function carregarYT(cb) {
  if (MZ.ytReady) return cb();
  (MZ.ytQ = MZ.ytQ || []).push(cb);
  if (MZ.ytLoading) return;
  MZ.ytLoading = true;
  let div = $("#ytBox");
  if (!div) {
    div = document.createElement("div");
    div.id = "ytBox";
    div.style.cssText =
      "position:fixed;width:1px;height:1px;left:-10px;bottom:0;opacity:0;pointer-events:none";
    div.innerHTML = '<div id="ytP"></div>';
    document.body.appendChild(div);

<script>

/* =====================================================================

const MA_INK = "#09080b";

    a = (a + 0x6d2b79f5) | 0;

  h = Math.imul(h ^ (h >>> 13), 1274126177);

}
function maRGB(c) {
  if (c.startsWith("rgb")) {
    const m = c.match(/[\d.]+/g).map(Number);
    return [m[0], m[1], m[2]];
  }
  c = c.replace("#", "");
  if (c.length === 3)
    c = c
      .split("")
      .map(x => x + x)
      .join("");

          g.fillRect(x + i * t + gw / 2, y + j * t + gw / 2, t - gw, (t - gw) * 0.3);
        }
      }
    maGrime(g, x, y, s, s, R, 0.12);
  };
}
function fpNoise(base, cols, { n = 40, r0 = 0.004, r1 = 0.02, grime = 0.16, crack = 0 } = {}) {
  return (g, x, y, s, R) => {
    g.fillStyle = base;
    g.fillRect(x, y, s, s);
    maSpeck(g, x, y, s, s, R, n, cols, s * r0, s * r1);
    maGrime(g, x, y, s, s, R, grime);
    if (crack && R() < crack) {
      let px = x + R() * s,
        py = y + R() * s;
      g.beginPath();
      g.moveTo(px, py);
      for (let i = 0; i < 4; i++) {
        px += (R() - 0.5) * s * 0.5;
        py += (R() - 0.5) * s * 0.5;
        g.lineTo(px, py);
      }
      g.strokeStyle = "rgba(0,0,0,.5)";
      g.lineWidth = Math.max(1, s * 0.012);
      g.stroke();
    }
  };
}
function fpGrass(base, cols, { n = 70, len = 0.13 } = {}) {
  return (g, x, y, s, R) => {
    g.fillStyle = base;
    g.fillRect(x, y, s, s);
    maGrime(g, x, y, s, s, R, 0.2);
    for (let i = 0; i < n; i++) {
      const px = x + R() * s,
        py = y + R() * s,
        a = -Math.PI / 2 + (R() - 0.5) * 1.2,
        l = s * len * (0.5 + R());
      g.strokeStyle = maPick(cols, R);
      g.lineWidth = Math.max(1, s * 0.014);
      g.beginPath();
      g.moveTo(px, py);
      g.lineTo(px + Math.cos(a) * l, py + Math.sin(a) * l);
      g.stroke();
    }
  };
}
function fpStones(cols, grout, { n = 2, round = 0.18 } = {}) {
  return (g, x, y, s, R, cx, cy) => {
    g.fillStyle = grout;
    g.fillRect(x, y, s, s);
    const t = s / n;
    for (let j = 0; j < n; j++) {
      const off = (((cy * n + j) % 2) * t) / 2;
      for (let i = -1; i <= n; i++) {
        const px = x + i * t + off,
          py = y + j * t;
        const c = cols[maH(cx * n + i, cy * n + j, 5) % cols.length];
        g.save();
        g.beginPath();
        g.rect(x, y, s, s);
        g.clip();
        maRR(g, px + s * 0.02, py + s * 0.02, t - s * 0.04, t - s * 0.04, t * round);
        g.fillStyle = maGrad(g, px, py, t, t, c, 0.1);
        g.fill();
        g.restore();
      }
    }
    maGrime(g, x, y, s, s, R, 0.15);
  };
}
function fpWater(c1, c2, { deep = false } = {}) {
  return (g, x, y, s, R) => {
    const gr = g.createLinearGradient(x, y, x + s, y + s);
    gr.addColorStop(0, c1);
    gr.addColorStop(1, c2);
    g.fillStyle = gr;
    g.fillRect(x, y, s, s);
    g.strokeStyle = deep ? "rgba(160,200,230,.10)" : "rgba(190,230,240,.16)";
    g.lineWidth = Math.max(1, s * 0.015);
    for (let i = 0; i < 3; i++) {
      const px = x + R() * s,
        py = y + R() * s,
        w = s * (0.15 + R() * 0.25);
      g.beginPath();
      g.moveTo(px, py);
      g.quadraticCurveTo(px + w / 2, py - s * 0.04, px + w, py);
      g.stroke();
    }
  };
}
function fpLeaves(base, cols) {
  return (g, x, y, s, R) => {
    g.fillStyle = base;
    g.fillRect(x, y, s, s);
    maGrime(g, x, y, s, s, R, 0.25);
    for (let i = 0; i < 26; i++) {
      g.save();
      g.translate(x + R() * s, y + R() * s);
      g.rotate(R() * 7);
      g.fillStyle = maPick(cols, R);
      g.beginPath();
      g.ellipse(0, 0, s * 0.05, s * 0.022, 0, 0, 7);
      g.fill();
      g.restore();
    }
  };
}
function fpFlesh(g, x, y, s, R) {
  g.fillStyle = "#4a0f17";
  g.fillRect(x, y, s, s);
  maGrime(g, x, y, s, s, R, 0.3);
  for (let i = 0; i < 3; i++) {
    g.beginPath();
    let px = x + R() * s,
      py = y + R() * s;
    g.moveTo(px, py);
    for (let k = 0; k < 3; k++) {
      const nx = px + (R() - 0.5) * s * 0.7,
        ny = py + (R() - 0.5) * s * 0.7;
      g.quadraticCurveTo((px + nx) / 2 + (R() - 0.5) * s * 0.3, (py + ny) / 2, nx, ny);
      px = nx;
      py = ny;
    }
    g.strokeStyle = "rgba(20,0,4,.7)";
    g.lineWidth = Math.max(1, s * 0.025);
    g.stroke();
    g.strokeStyle = "rgba(200,40,60,.35)";
    g.lineWidth = Math.max(1, s * 0.01);
    g.stroke();
  }
  for (let i = 0; i < 4; i++) {
    g.fillStyle = "rgba(255,120,130,.12)";
    g.beginPath();
    g.ellipse(x + R() * s, y + R() * s, s * 0.06, s * 0.03, R() * 3, 0, 7);
    g.fill();
  }
}
function fpHex(c1, c2, grout) {
  return (g, x, y, s, R, cx, cy) => {
    g.fillStyle = grout;
    g.fillRect(x, y, s, s);
    const r = s / 6;
    g.save();
    g.beginPath();
    g.rect(x, y, s, s);
    g.clip();
    for (let j = -1; j < 5; j++)
      for (let i = -1; i < 5; i++) {
        const px = x + i * r * 1.75 + (j % 2) * r * 0.87,
          py = y + j * r * 1.5;
        g.beginPath();
        for (let k = 0; k < 6; k++) {
          const a = Math.PI / 6 + (k * Math.PI) / 3;
          g.lineTo(px + Math.cos(a) * r * 0.86, py + Math.sin(a) * r * 0.86);
        }
        g.closePath();
        g.fillStyle = maH(cx * 9 + i, cy * 9 + j, 2) % 4 ? c1 : c2;
        g.fill();
      }
    g.restore();
    maGrime(g, x, y, s, s, R, 0.15);
  };
}
function fpCarpet(base, { pat = 0, c2 } = {}) {
  return (g, x, y, s, R, cx, cy) => {
    g.fillStyle = base;
    g.fillRect(x, y, s, s);
    maSpeck(g, x, y, s, s, R, 60, [maTone(base, 0.08), maTone(base, -0.1)], s * 0.004, s * 0.01);
    if (pat === 1) {
      g.strokeStyle = maA(c2, 0.35);
      g.lineWidth = Math.max(1, s * 0.02);
      g.beginPath();
      g.moveTo(x + s / 2, y);
      g.lineTo(x + s, y + s / 2);
      g.lineTo(x + s / 2, y + s);
      g.lineTo(x, y + s / 2);
      g.closePath();
      g.stroke();
    }
    if (pat === 2) {
      g.fillStyle = maA(c2, 0.28);
      for (let i = 0; i < 4; i++) {
        g.beginPath();
        g.arc(x + (((i % 2) + 0.5) * s) / 2, y + ((Math.floor(i / 2) + 0.5) * s) / 2, s * 0.07, 0, 7);
        g.fill();
      }
    }
    maGrime(g, x, y, s, s, R, 0.12);
  };
}
function fpGrate(g, x, y, s, R) {
  g.fillStyle = "#1d1f22";
  g.fillRect(x, y, s, s);
  g.strokeStyle = "#3a3e44";
  g.lineWidth = Math.max(1, s * 0.03);
  const n = 5;
  for (let i = 0; i <= n; i++) {
    g.beginPath();
    g.moveTo(x + (i * s) / n, y);
    g.lineTo(x, y + (i * s) / n);
    g.stroke();
    g.beginPath();
    g.moveTo(x + s - (i * s) / n, y + s);
    g.lineTo(x + s, y + s - (i * s) / n);
    g.stroke();
  }
  g.fillStyle = "rgba(0,0,0,.3)";
  g.fillRect(x, y, s, s * 0.03);
  maGrime(g, x, y, s, s, R, 0.2);
}
function fpMarble(base, vein) {
  return (g, x, y, s, R) => {
    g.fillStyle = base;
    g.fillRect(x, y, s, s);
    g.strokeStyle = vein;
    g.lineWidth = Math.max(1, s * 0.01);
    for (let i = 0; i < 3; i++) {
      g.beginPath();
      g.moveTo(x + R() * s, y);
      g.bezierCurveTo(x + R() * s, y + s * 0.3, x + R() * s, y + s * 0.7, x + R() * s, y + s);
      g.stroke();
    }
    g.strokeStyle = "rgba(0,0,0,.25)";
    g.strokeRect(x, y, s, s);
    maGrime(g, x, y, s, s, R, 0.08);
  };
}
function fpParquet(c1, c2) {
  return (g, x, y, s, R, cx, cy) => {
    const h = s / 2;
    for (let i = 0; i < 2; i++)
      for (let j = 0; j < 2; j++) {
        const px = x + i * h,
          py = y + j * h,
          vert = (i + j + cx + cy) % 2;
        for (let k = 0; k < 3; k++) {
          g.fillStyle = maTone(k % 2 ? c1 : c2, (R() - 0.5) * 0.12);
          const w = h / 3;
          if (vert) g.fillRect(px + k * w, py, w, h);
          else g.fillRect(px, py + k * w, h, w);
          g.fillStyle = "rgba(0,0,0,.45)";
          if (vert) g.fillRect(px + k * w, py, 1, h);
          else g.fillRect(px, py + k * w, h, 1);
        }
      }
    maGrime(g, x, y, s, s, R, 0.12);
  };
}

          g.lineWidth = Math.max(1, s * 0.025);

            for (let i = 1; i <= 4; i++) g.lineTo(px + (i * s) / 4, yy + (R() - 0.5) * s * 0.05);

          s * 0.06,
          "butt"
        );
        for (let k = 1; k < 4; k++) {
          const px = ax + ((bx - ax) * k) / 4,
            py = ay + ((by - ay) * k) / 4;
          maCirc(g, px, py, s * 0.04, "#3a3d44");
        }
        maBox(g, ax - s * 0.06, ay - s * 0.06, s * 0.12, s * 0.12, 0, "#25272b");
      }
    }
    const ex = r.x1 * s,
      ey = r.y1 * s;
    if (P.cerca === "madeira")
      maBox(g, ex - s * 0.06, ey - s * 0.06, s * 0.12, s * 0.12, s * 0.02, "#4a3220");
    if (P.cerca === "arame") maCirc(g, ex, ey, s * 0.05, "#6a6f74");
    if (P.cerca === "grade") maBox(g, ex - s * 0.06, ey - s * 0.06, s * 0.12, s * 0.12, 0, "#25272b");
  });
  // portas e janelas
  A.forEach(a => {

      y0 = a.y * s,
      x1 = hz ? x0 + s : x0,

    g.translate(x0, y0);
    if (!hz) {
      g.rotate(Math.PI / 2);

    const L = s,

    const jamb = () => {
      maBox(g, -post * 0.25, -t / 2 - 1, post * 0.5 + 1, t + 2, 0, "#121214", { k: 0.05 });
      maBox(g, L - post * 0.25 - 1, -t / 2 - 1, post * 0.5 + 1, t + 2, 0, "#121214", { k: 0.05 });
    };
    if (tipo === "secreta") {
      g.strokeStyle = MA_INK;
      g.lineWidth = t + maLW(2.2);
      g.beginPath();
      g.moveTo(0, 0);
      g.lineTo(L, 0);
      g.stroke();
      g.strokeStyle = "#0f0f12";
      g.lineWidth = t;
      g.stroke();
      g.strokeStyle = "rgba(120,90,200,.08)";
      g.lineWidth = 1;
      g.beginPath();
      g.moveTo(L * 0.5, -t / 2);
      g.lineTo(L * 0.5, t / 2);
      g.stroke();
    } else if (tipo === "janela" || tipo === "janelaq") {
      g.strokeStyle = MA_INK;
      g.lineWidth = t + maLW(2.2);
      g.beginPath();
      g.moveTo(0, 0);
      g.lineTo(L, 0);
      g.stroke();
      g.strokeStyle = P.cerca ? "#222" : P.id === "ordem" ? "#151518" : P.cor;
      g.lineWidth = t;
      g.stroke();
      maBox(g, L * 0.12, -t * 0.22, L * 0.76, t * 0.44, 1, "#9ccbe0", { k: 0.2 });
      if (tipo === "janelaq") {
        maLine(
          g,
          [
            [L * 0.3, -t * 0.2],
            [L * 0.45, 0],
            [L * 0.38, t * 0.2]
          ],
          MA_INK,
          maLW()
        );
        maLine(
          g,
          [
            [L * 0.6, -t * 0.2],
            [L * 0.55, t * 0.1]
          ],
          MA_INK,
          maLW()
        );
        const R = maRng(a.x * 7 + a.y);
        maSpeck(

          L * 0.1,
          t * 0.4,
          L * 0.8,
          s * 0.25,

          10,
          ["rgba(200,230,245,.7)"],
          s * 0.008,
          s * 0.018
        );
      } else {

        g.fillRect(L * 0.15, -t * 0.15, L * 0.7, t * 0.08);
      }
    } else if (tipo === "portao") {
      jamb();
      for (let i = 0; i < 8; i++)
        maLine(
          g,
          [
            [L * 0.1 + (i * L * 0.8) / 7, -t * 0.25],
            [L * 0.1 + (i * L * 0.8) / 7, t * 0.25]
          ],
          "#33363c",
          Math.max(1, s * 0.03)
        );
      maLine(
        g,
        [
          [L * 0.08, 0],
          [L * 0.92, 0]
        ],
        "#2a2c30",
        Math.max(1, s * 0.035)
      );
    } else if (tipo === "cortina") {
      jamb();
      for (let i = 0; i < 6; i++) {
        maEll(g, L * 0.15 + i * L * 0.14, 0, L * 0.08, t * 0.35, maTone("#5a1c25", i % 2 ? 0.05 : -0.05), {
          k: 0.2
        });
      }
    } else {
      jamb();
      const dbl = tipo === "portad";
      const col = MA_ABERT[tipo].cor;
      const leaf = (px, len, ang, flip) => {
        g.save();
        g.translate(px, 0);
        g.rotate(ang);
        maBox(g, flip ? -len : 0, -t * 0.18, len, t * 0.36, 1, col, { k: 0.15 });
        if (tipo === "portaf") {
          for (let k = 1; k < 4; k++)
            maLine(
              g,
              [
                [(flip ? -len : 0) + (len * k) / 4, -t * 0.15],
                [(flip ? -len : 0) + (len * k) / 4, t * 0.15]
              ],
              "#55595f",
              Math.max(1, s * 0.02)
            );
        }
        g.restore();
      };
      // arco de abertura tracejado
      g.setLineDash([s * 0.04, s * 0.05]);
      g.strokeStyle = "rgba(255,255,255,.12)";
      g.lineWidth = Math.max(1, s * 0.015);
      g.beginPath();
      if (dbl) {
        g.arc(post * 0.25, 0, L / 2 - post * 0.3, 0, Math.PI / 2);
        g.moveTo(L - post * 0.25, L / 2 - post * 0.3);
        g.arc(L - post * 0.25, 0, L / 2 - post * 0.3, Math.PI / 2, Math.PI);
      } else g.arc(post * 0.25, 0, L - post * 0.5, 0, Math.PI / 2);
      g.stroke();
      g.setLineDash([]);
      if (tipo === "portaq") {
        leaf(post * 0.25, (L - post * 0.5) * 0.55, 1.2);
        maSpeck(
          g,
          L * 0.4,
          0,
          L * 0.5,
          s * 0.4,
          maRng(a.x + a.y * 3),
          9,
          ["#5a3c26", "#3c2a1c"],
          s * 0.01,
          s * 0.03
        );
      } else if (dbl) {
        leaf(post * 0.25, L / 2 - post * 0.3, 0.55);
        leaf(L - post * 0.25, L / 2 - post * 0.3, -0.55, true);
      } else leaf(post * 0.25, L - post * 0.5, 0.5);
      if (tipo === "portat") maCirc(g, L / 2, 0, Math.max(2, s * 0.09), "#d9a441", { k: 0.25 });
    }
    g.restore();
  });
  g.restore();
}

<script>
"use strict";
/* Criador de mapas: todos os objetos (móveis, carros, árvores...). */
/* =====================================================================
   CRIADOR DE MAPAS — OBJETOS (vista de cima, arte original)
   w,h em quadrados; z: 0 = no chão (tapetes, manchas), 1 = móveis, 2 = alto (copas, lustres)
   cores: variações que o mestre escolhe; luz: {r em quadrados, c cor}
   ===================================================================== */
const MC = {
  // paleta
  mad: ["#6a4630", "#3e2b1f", "#8a6440", "#2d211a"],
  tec: ["#5e1f2a", "#3f2b5c", "#4a4a52", "#2f4a3a", "#7a6a52", "#23324a"],
  met: ["#4a5058", "#2e3238", "#6b7078", "#8a2a2a"],
  car: ["#1d1e23", "#8d9098", "#6e1c22", "#d2d2d2", "#1f3550", "#3a4a2a"],
  pla: ["#d8d4ca", "#2b2b30", "#5a6a5a", "#8a2a2a"]
};
function mChair(g, x, y, sz, c, rot = 0) {
  g.save();
  g.translate(x, y);
  g.rotate(rot);
  maBox(g, -sz / 2, -sz / 2, sz, sz, sz * 0.18, c);
  maBox(g, -sz / 2, -sz / 2 - sz * 0.22, sz, sz * 0.28, sz * 0.1, maTone(c, -0.15));
  g.restore();
}
function mCushion(g, x, y, w, h, c) {
  maBox(g, x, y, w, h, Math.min(w, h) * 0.25, c, { k: 0.2 });
}
function mPaper(g, x, y, sz, R) {
  g.save();
  g.translate(x, y);
  g.rotate((R() - 0.5) * 1.2);
  maBox(g, -sz / 2, -sz * 0.65, sz, sz * 1.3, 0, "#d9d3c4", { lw: 0.6, k: 0.05 });
  g.fillStyle = "rgba(40,40,40,.45)";
  for (let i = 0; i < 4; i++)
    g.fillRect(-sz * 0.35, -sz * 0.45 + i * sz * 0.25, sz * 0.7 * (0.5 + R() * 0.5), Math.max(1, sz * 0.06));
  g.restore();
}
function mLeaf(g, x, y, r, R, c) {
  for (let i = 0; i < 7; i++) {
    const a = R() * 7,
      d = r * 0.45 * R();
    maBlob(
      g,
      x + Math.cos(a) * d,
      y + Math.sin(a) * d,
      r * (0.35 + R() * 0.25),
      R,
      maTone(c, (R() - 0.5) * 0.25),
      { ink: i === 0, n: 8 }
    );
  }
}
function mTree(g, W, H, R, c, { dead = false, pine = false } = {}) {
  const cx = W / 2,
    cy = H / 2,
    r = Math.min(W, H) * 0.47;
  if (dead) {
    maCirc(g, cx, cy, r * 0.18, "#3a2c22");
    for (let i = 0; i < 7; i++) {
      const a = (i / 7) * 6.28 + R() * 0.4,
        l = r * (0.6 + R() * 0.4);
      maLine(
        g,
        [
          [cx, cy],
          [cx + Math.cos(a) * l * 0.55, cy + Math.sin(a) * l * 0.55],
          [cx + Math.cos(a + 0.3) * l, cy + Math.sin(a + 0.3) * l]
        ],
        MA_INK,
        maLW(2.4)
      );
      maLine(
        g,
        [
          [cx, cy],
          [cx + Math.cos(a) * l * 0.55, cy + Math.sin(a) * l * 0.55],
          [cx + Math.cos(a + 0.3) * l, cy + Math.sin(a + 0.3) * l]
        ],
        "#4a382a",
        maLW(1.2)
      );
    }
    return;
  }
  if (pine) {
    for (let k = 0; k < 4; k++) {
      const rr = r * (1 - k * 0.22);
      g.beginPath();
      for (let i = 0; i <= 16; i++) {
        const a = (i / 16) * 6.28,
          q = i % 2 ? rr * 0.72 : rr;
        g.lineTo(cx + Math.cos(a) * q, cy + Math.sin(a) * q);
      }
      g.closePath();
      g.fillStyle = maTone(c, -0.15 + k * 0.08);
      g.fill();
      g.lineWidth = maLW();
      g.strokeStyle = MA_INK;
      g.stroke();
    }
    return;
  }
  maBlob(g, cx + r * 0.06, cy + r * 0.08, r, R, maTone(c, -0.35), { ink: true, n: 14, j: 0.22 });
  for (let i = 0; i < 6; i++) {
    const a = R() * 7,
      d = r * 0.45 * R();
    maBlob(
      g,
      cx + Math.cos(a) * d,
      cy + Math.sin(a) * d,
      r * (0.35 + R() * 0.25),
      R,
      maTone(c, (R() - 0.6) * 0.25),
      { ink: false, n: 10 }
    );
  }
  maBlob(g, cx - r * 0.25, cy - r * 0.25, r * 0.3, R, maTone(c, 0.12), { ink: false });
}
function mCar(g, W, H, c, { pol = false, van = false } = {}) {
  const w = W * 0.86,
    h = H * 0.92,
    x = (W - w) / 2,
    y = (H - h) / 2;
  [
    [0.08, 0.18],
    [0.92, 0.18],
    [0.08, 0.8],
    [0.92, 0.8]
  ].forEach(([a, b]) => maBox(g, x + w * a - w * 0.1, y + h * b - h * 0.07, w * 0.2, h * 0.14, 2, "#111"));
  maBox(g, x, y, w, h, w * 0.28, c, { k: 0.22 });
  if (!van) {
    maBox(g, x + w * 0.12, y + h * 0.2, w * 0.76, h * 0.17, w * 0.12, "#1d2b36", { k: 0.3 });
    maBox(g, x + w * 0.16, y + h * 0.38, w * 0.68, h * 0.3, w * 0.1, maTone(c, 0.08), { k: 0.18 });
    maBox(g, x + w * 0.14, y + h * 0.69, w * 0.72, h * 0.1, w * 0.08, "#1d2b36", { k: 0.3 });
  } else {
    maBox(g, x + w * 0.12, y + h * 0.12, w * 0.76, h * 0.12, w * 0.1, "#1d2b36", { k: 0.3 });
    maBox(g, x + w * 0.1, y + h * 0.27, w * 0.8, h * 0.65, w * 0.06, maTone(c, 0.06), { k: 0.12 });
  }
  g.fillStyle = "#f6e9a8";
  g.fillRect(x + w * 0.12, y + 1, w * 0.18, h * 0.03);
  g.fillRect(x + w * 0.7, y + 1, w * 0.18, h * 0.03);
  g.fillStyle = "#b3222c";
  g.fillRect(x + w * 0.1, y + h - 3, w * 0.2, h * 0.025);
  g.fillRect(x + w * 0.7, y + h - 3, w * 0.2, h * 0.025);
  if (pol) {
    maBox(g, x + w * 0.2, y + h * 0.47, w * 0.6, h * 0.06, 2, "#222");
    g.fillStyle = "#e0303f";
    g.fillRect(x + w * 0.22, y + h * 0.48, w * 0.27, h * 0.04);
    g.fillStyle = "#2f6be0";
    g.fillRect(x + w * 0.51, y + h * 0.48, w * 0.27, h * 0.04);
  }
}
function mCircle(g, W, H, R, col, kind) {
  const cx = W / 2,
    cy = H / 2,
    r = Math.min(W, H) * 0.46;
  g.save();
  g.shadowColor = col;
  g.shadowBlur = r * 0.25;
  g.strokeStyle = col;
  g.lineWidth = Math.max(1.5, r * 0.035);
  g.beginPath();
  g.arc(cx, cy, r, 0, 7);
  g.stroke();
  g.beginPath();
  g.arc(cx, cy, r * 0.82, 0, 7);
  g.stroke();
  g.lineWidth = Math.max(1, r * 0.02);
  g.beginPath();
  g.arc(cx, cy, r * 0.36, 0, 7);
  g.stroke();
  for (let i = 0; i < 20; i++) {
    const a = (i / 20) * 6.28,
      x = cx + Math.cos(a) * r * 0.91,
      y = cy + Math.sin(a) * r * 0.91;
    g.save();
    g.translate(x, y);
    g.rotate(a + R());
    g.beginPath();
    const q = r * 0.05;
    g.moveTo(-q, -q);
    g.lineTo(q * (R() - 0.5) * 2, q);
    g.lineTo(q, -q * R());
    g.stroke();
    g.restore();
  }
  g.lineWidth = Math.max(1.5, r * 0.03);
  g.beginPath();
  if (kind === "sangue") {
    for (let i = 0; i < 3; i++) {
      const a = -Math.PI / 2 + i * 2.094;
      g.lineTo(cx + Math.cos(a) * r * 0.8, cy + Math.sin(a) * r * 0.8);
    }
    g.closePath();
    g.moveTo(cx, cy - r * 0.36);
    g.lineTo(cx, cy + r * 0.5);
  }
  if (kind === "morte") {
    for (let t = 0; t < 16; t += 0.2) {
      const rr = r * 0.05 * t * 0.5;
      g.lineTo(cx + Math.cos(t) * rr, cy + Math.sin(t) * rr);
    }
  }
  if (kind === "conhecimento") {
    g.moveTo(cx - r * 0.7, cy);
    g.quadraticCurveTo(cx, cy - r * 0.55, cx + r * 0.7, cy);
    g.quadraticCurveTo(cx, cy + r * 0.55, cx - r * 0.7, cy);
    g.moveTo(cx + r * 0.16, cy);
    g.arc(cx, cy, r * 0.16, 0, 7);
  }
  if (kind === "energia") {
    for (let i = 0; i <= 10; i++) {
      const a = -Math.PI / 2 + i * 0.628,
        q = i % 2 ? r * 0.3 : r * 0.8;
      g.lineTo(cx + Math.cos(a) * q, cy + Math.sin(a) * q);
    }
  }
  if (kind === "medo") {
    g.moveTo(cx - r * 0.8, cy);
    g.lineTo(cx + r * 0.8, cy);
    g.moveTo(cx, cy - r * 0.8);
    g.lineTo(cx, cy + r * 0.8);
    g.moveTo(cx + r * 0.55, cy);
    g.arc(cx, cy, r * 0.55, 0, 7);
  }
  g.stroke();
  g.restore();
}
function mSplat(g, W, H, R, c, { n = 12, big = 0.32 } = {}) {
  const cx = W / 2,
    cy = H / 2,
    r = Math.min(W, H) * big;
  maBlob(g, cx, cy, r, R, c, { ink: false, n: 12, j: 0.45, k: 0.08 });
  for (let i = 0; i < n; i++) {
    const a = R() * 7,
      d = r * (1 + R() * 0.9);
    g.fillStyle = maTone(c, (R() - 0.5) * 0.2);
    g.beginPath();
    g.arc(cx + Math.cos(a) * d, cy + Math.sin(a) * d, r * (0.05 + R() * 0.12), 0, 7);
    g.fill();
  }
  g.fillStyle = "rgba(255,200,200,.12)";
  g.beginPath();
  g.ellipse(cx - r * 0.3, cy - r * 0.3, r * 0.25, r * 0.1, -0.6, 0, 7);
  g.fill();
}
function mCandle(g, x, y, r) {
  maCirc(g, x, y, r, "#d8cfb8", { k: 0.25 });

  g.beginPath();

}
function mBottles(g, x, y, w, h, R, n = 6) {
  for (let i = 0; i < n; i++)

      x + R() * w,

    );
}
