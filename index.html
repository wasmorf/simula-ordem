    <style>
/* Cores, fontes, botões, campos e caixas usados no site todo. */
/* Simula Ordem — sigilo roxo, sangue vermelho. Layout: trilho de ferramentas à esquerda, tabuleiro no centro, painel à direita; no celular, barra de baixo e painéis em tela cheia. */
:root {
  --bg: #0b090f;
  --board: #08070b;
  --panel: #141019;
  --panel2: #1c1724;
  --line: #2e2540;
  --fg: #ede7f3;
  --muted: #9b91aa;
  --purple: #8b3ff0;
  --purple-hi: #b47dff;
  --purple-soft: #24163a;
  --red: #d3283b;
  --red-hi: #ff4d5e;
  --red-soft: #3a1019;
  --ok: #5fae70;
  --warn: #e0a03c;
  --sangue: #e0303f;
  --morte: #8f8b94;
  --energia: #a35ce0;
  --conhecimento: #d6ad45;
  --f-display: "IM Fell English SC", "Times New Roman", serif;
  --f-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --rail: 64px;
  --navh: 64px;
  color-scheme: dark;
}
* {
  box-sizing: border-box;
}
html,
body {
  height: 100%;
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  /* sem o "elástico" do celular ao puxar além do fim da página (e sem recarregar sem querer) */
  overscroll-behavior: none;
}
body {
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
[hidden] {
  display: none !important;
}
button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}
button {
  cursor: pointer;
}
:focus-visible {
  outline: 2px solid var(--purple-hi);
  outline-offset: 2px;
}
img {
  max-width: 100%;
}
h1,
h2,
h3 {
  font-family: var(--f-display);
  font-weight: 400;
  margin: 0;
  text-wrap: balance;
}
h2 {
  font-size: 24px;
}
h3 {
  font-size: 18px;
  color: var(--purple-hi);
}
.label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--muted);
  font-weight: 600;
}
.muted {
  color: var(--muted);
}
.small {
  font-size: 13px;
}
.stack {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
}
.between {
  justify-content: space-between;
}
.btn {
  background: var(--panel2);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 8px 12px;
  font-weight: 600;
  line-height: 1.2;
}
.btn:hover {
  border-color: var(--purple);
}
.btn.primary {
  background: var(--purple);
  border-color: var(--purple);
  color: #fff;
}
.btn.primary:hover {
  background: #9a52ff;
}
.btn.danger {
  background: var(--red-soft);
  border-color: var(--red);
  color: #ffd9dd;
}
.btn.ghost {
  background: none;
}
.btn.sm {
  padding: 4px 8px;
  font-size: 13px;
}
.btn.block {
  width: 100%;
}
.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}
/* Menu suspenso "Opções ▾" / "Mais ▾" (menuHTML em nucleo/utilitarios.js) */
.menu {
  position: relative;
  display: inline-block;
}
.menu > summary {
  list-style: none;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  user-select: none;
}
.menu > summary::-webkit-details-marker {
  display: none;
}
.menu[open] > summary {
  border-color: var(--purple);
  background: var(--purple-soft);
}
.menu-lista {
  position: absolute;
  right: 0;
  top: calc(100% + 4px);
  z-index: 30;
  min-width: 190px;
  display: flex;
  flex-direction: column;
  padding: 4px;
  background: var(--panel2);
  border: 1px solid var(--line);
  border-radius: 8px;
  box-shadow: 0 10px 28px rgba(0, 0, 0, 0.55);
}
.menu-lista button {
  background: none;
  border: 0;
  border-radius: 5px;
  padding: 9px 10px;
  text-align: left;
  font-size: 14px;
  font-weight: 500;
}
.menu-lista button:hover,
.menu-lista button:focus-visible {
  background: var(--purple-soft);
}
.menu-lista button.perigo {
  color: var(--red-hi);
}
.menu-lista button.perigo:hover {
  background: var(--red-soft);
}
input[type="text"],
input[type="url"],
input[type="password"],
input[type="number"],
input[type="search"],
select,
textarea {
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 7px 9px;
  min-width: 0;
  width: 100%;
}
input[type="range"],
input[type="checkbox"] {
  accent-color: var(--purple);
}
input[type="number"] {
  font-family: var(--f-mono);
}
textarea {
  min-height: 90px;
  resize: vertical;
}
.field {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
}
.fields {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 10px;
}
.box {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 12px;
  min-width: 0;
}
.empty {
  border: 1px dashed var(--line);
  border-radius: 8px;
  padding: 18px;
  text-align: center;
  color: var(--muted);
  font-size: 14px;
}
.tag {
  display: inline-block;
  font-size: 11px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 2px 6px;
  border-radius: 4px;
  border: 1px solid var(--line);
  color: var(--muted);
  white-space: nowrap;
}
.tag.on {
  border-color: var(--purple);
  color: var(--purple-hi);
}
.tag.red {
  border-color: var(--red);
  color: var(--red-hi);
}
.scroll-x {
  overflow-x: auto;
}
.check {
  display: flex;
  gap: 6px;
  align-items: center;
  font-size: 14px;
}
/* Tela inicial. */
/* ---------- lobby ---------- */
#lobby {
  min-height: 100%;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background:
    radial-gradient(900px 500px at 85% -10%, var(--purple-soft), transparent 70%),
    radial-gradient(700px 400px at -10% 110%, var(--red-soft), transparent 70%), var(--bg);
}
.lwrap {
  max-width: 1100px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 22px 60px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: var(--f-display);
  font-size: 22px;
  line-height: 1;
}
.brand small {
  display: block;
  font-family: var(--f-body);
  font-size: 10px;
  letter-spacing: 0.22em;
  color: var(--muted);
  text-transform: uppercase;
  margin-top: 3px;
}
.hero {
  display: grid;
  gap: 22px;
  grid-template-columns: 1fr;
  margin-top: 34px;
}
@media (min-width: 820px) {
  .hero {
    grid-template-columns: 1.25fr 1fr;
    align-items: start;
  }
}
.hero h1 {
  font-size: clamp(38px, 7vw, 64px);
  line-height: 0.98;
}
.hero h1 em {
  font-style: normal;
  color: var(--red-hi);
}
.hero h1 b {
  font-weight: 400;
  color: var(--purple-hi);
}
.hero p {
  max-width: 58ch;
  color: var(--muted);
  font-size: 16px;
}
.feats {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.mesas {
  display: grid;
  gap: 10px;
  grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
}
.mesa-card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 14px;
  text-align: left;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.mesa-card:hover {
  border-color: var(--purple);
}
.mesa-card b {
  font-family: var(--f-display);
  font-size: 21px;
  font-weight: 400;
}
.who {
  display: flex;
  gap: 8px;
  align-items: center;
  font-size: 13px;
  color: var(--muted);
}
/* Mesa virtual: trilho, tabuleiro, painel lateral e barra de baixo no celular. */
/* ---------- mesa virtual ---------- */
#vtt {
  position: fixed;
  inset: 0;
  display: grid;
  grid-template-columns: var(--rail) minmax(0, 1fr) auto;
  background: var(--board);
}
.rail {
  background: var(--panel);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding-top: calc(10px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  padding-left: env(safe-area-inset-left, 0px);
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-width: none;
}
.rail::-webkit-scrollbar {
  display: none;
}
.rail .logo {
  margin-bottom: 10px;
}
.tool {
  width: 48px;
  height: 48px;
  border-radius: 10px;
  border: 1px solid transparent;
  background: none;
  display: grid;
  place-items: center;
  color: var(--muted);
  position: relative;
}
.tool:hover {
  color: var(--fg);
  background: var(--panel2);
}
.tool[aria-pressed="true"] {
  color: #fff;
  background: var(--purple-soft);
  border-color: var(--purple);
}
.tool svg {
  width: 24px;
  height: 24px;
}
.tool .tip {
  position: absolute;
  left: 56px;
  top: 50%;
  transform: translateY(-50%);
  background: var(--panel2);
  border: 1px solid var(--line);
  border-radius: 5px;
  padding: 3px 8px;
  font-size: 12px;
  white-space: nowrap;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.12s;
  z-index: 30;
}
.tool:hover .tip {
  opacity: 1;
}
.rail .sep {
  width: 30px;
  height: 1px;
  background: var(--line);
  margin: 6px 0;
}
.rail .grow {
  flex: 1;
}

.board {
  position: relative;
  overflow: hidden;
  touch-action: none;
  background: radial-gradient(circle at 50% 50%, #120e18 0, #08070b 70%);
}
.viewport {
  position: absolute;
  left: 0;
  top: 0;
  transform-origin: 0 0;
  will-change: transform;
}
.viewport > img.map {
  display: block;
  max-width: none;
  user-select: none;
  -webkit-user-drag: none;
  pointer-events: none;
  box-shadow:
    0 0 0 1px var(--line),
    0 20px 60px rgba(0, 0, 0, 0.6);
}
.grid-ov {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background-image:
    linear-gradient(to right, rgba(180, 125, 255, 0.18) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(180, 125, 255, 0.18) 1px, transparent 1px);
}
.tok {
  position: absolute;
  transform: translate(-50%, -50%);
  touch-action: none;
  cursor: grab;
  display: flex;
  flex-direction: column;
  align-items: center;
  user-select: none;
}
.tok img {
  display: block;
  max-width: none;
  pointer-events: none;
  filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.6));
}
.tok .tn {
  margin-top: 2px;
  font-size: 12px;
  font-weight: 700;
  background: rgba(10, 8, 14, 0.85);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 0 6px;
  white-space: nowrap;
  opacity: 0;
  transition: opacity 0.12s;
}
.tok:hover .tn,
.tok.sel .tn {
  opacity: 1;
}
.tok.sel img {
  filter: drop-shadow(0 0 3px var(--purple-hi)) drop-shadow(0 0 10px var(--purple));
}
.tok.locked {
  cursor: default;
}
.tok .hp {
  width: 56px;
  height: 5px;
  background: rgba(0, 0, 0, 0.6);
  border-radius: 3px;
  overflow: hidden;
  margin-top: 2px;
}
.tok .hp i {
  display: block;
  height: 100%;
  background: var(--red);
}
.board-top {
  position: absolute;
  top: calc(10px + env(safe-area-inset-top, 0px));
  left: 12px;
  right: 12px;
  display: flex;
  gap: 8px;
  align-items: center;
  pointer-events: none;
  z-index: 4;
}
.board-top > * {
  pointer-events: auto;
}
.chip {
  background: rgba(20, 16, 25, 0.9);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 5px 12px;
  font-size: 13px;
  display: flex;
  gap: 8px;
  align-items: center;
}
.chip .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--purple-hi);
}
.chip.hidden-scene .dot {
  background: var(--warn);
}
.zoom {
  position: absolute;
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
  z-index: 4;
}
.zoom button {
  width: 40px;
  height: 38px;
  border: 0;
  background: var(--purple);
  color: #fff;
  font-size: 20px;
  line-height: 1;
}
.zoom span {
  min-width: 64px;
  text-align: center;
  font-family: var(--f-mono);
  font-size: 14px;
}
.zoom .fit {
  background: var(--panel2);
  color: var(--fg);
  font-size: 12px;
  width: auto;
  padding: 0 10px;
  font-family: var(--f-body);
  font-weight: 600;
}
.board-empty {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  padding: 24px;
  text-align: center;
  color: var(--muted);
}
.board-empty .in {
  max-width: 420px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  align-items: center;
}
.board-empty svg {
  opacity: 0.5;
}
.tokbar {
  position: absolute;
  right: 12px;
  bottom: calc(64px + env(safe-area-inset-bottom, 0px));
  z-index: 4;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-width: 230px;
}

.panel {
  background: var(--panel);
  border-left: 1px solid var(--line);
  width: 400px;
  display: flex;
  flex-direction: column;
  min-height: 0;
  height: 100%;
  padding-top: env(safe-area-inset-top, 0px);
  padding-right: env(safe-area-inset-right, 0px);
}
.panel.wide {
  width: min(860px, 62vw);
}
.phead {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 16px;
  border-bottom: 1px solid var(--line);
}
.phead h2 {
  font-size: 20px;
  flex: 1;
  min-width: 0;
}
.pbody {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden; /* arrastar no celular não desloca o painel para os lados */
  overscroll-behavior: contain;
  padding: 14px 16px calc(24px + env(safe-area-inset-bottom, 0px));
  display: flex;
  flex-direction: column;
  gap: 14px;
  min-height: 0;
}
/* nada dentro do painel é espremido: se não couber, o painel rola */
.pbody > * {
  flex-shrink: 0;
}
.x {
  background: none;
  border: 0;
  color: var(--muted);
  font-size: 22px;
  line-height: 1;
  padding: 4px 8px;
}
.x:hover {
  color: var(--fg);
}

.bottomnav {
  display: none;
}
@media (max-width: 760px) {
  #vtt {
    grid-template-columns: 1fr;
    grid-template-rows: minmax(0, 1fr) calc(var(--navh) + env(safe-area-inset-bottom, 0px));
  }
  .rail {
    display: none;
  }
  .panel,
  .panel.wide {
    position: fixed;
    left: 0;
    right: 0;
    top: 0;
    bottom: calc(var(--navh) + env(safe-area-inset-bottom, 0px));
    /* sem isso o height: 100% de fora vence o "bottom" e o fim do painel fica escondido atrás da barra */
    height: auto;
    width: auto;
    z-index: 20;
    border-left: 0;
    padding-left: env(safe-area-inset-left, 0px);
  }
  .bottomnav {
    display: flex;
    background: var(--panel);
    border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-left: env(safe-area-inset-left, 0px);
    padding-right: env(safe-area-inset-right, 0px);
    /* rola só para os lados: arrastar para cima/baixo não pode deslocar os ícones */
    overflow-x: auto;
    overflow-y: hidden;
    overscroll-behavior: contain;
    touch-action: pan-x;
    scrollbar-width: none;
    z-index: 21;
  }
  .bottomnav::-webkit-scrollbar {
    display: none;
  }
  /* sombra na borda direita avisa que dá para arrastar e ver mais ferramentas */
  .bottomnav::after {
    content: "";
    position: sticky;
    right: 0;
    flex: 0 0 40px;
    margin-left: -40px;
    background: linear-gradient(to right, transparent, var(--panel) 85%);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .bottomnav.mais::after {
    opacity: 1;
  }
  .bottomnav button {
    flex: 1 0 64px;
    background: none;
    border: 0;
    color: var(--muted);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    font-size: 11px;
    font-weight: 600;
    height: var(--navh);
  }
  .bottomnav button[aria-pressed="true"] {
    color: #fff;
    box-shadow: inset 0 2px 0 var(--purple);
  }
  .bottomnav svg {
    width: 24px;
    height: 24px;
  }
  .zoom {
    bottom: 12px;
  }
  .tokbar {
    bottom: 62px;
  }
}
/* Listas e cards do painel. */
/* ---------- listas do painel ---------- */
.cards {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.scene {
  display: grid;
  grid-template-columns: 96px minmax(0, 1fr);
  gap: 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel2);
  padding: 8px;
  align-items: center;
}
.scene.live {
  border-color: var(--purple);
  box-shadow: 0 0 0 1px var(--purple) inset;
}
.scene .th {
  width: 96px;
  height: 64px;
  border-radius: 5px;
  object-fit: cover;
  background: var(--bg);
  display: block;
}
.scene .st {
  font-size: 11px;
  color: var(--muted);
}
.scene.live .st {
  color: var(--purple-hi);
}
.scene .nm {
  font-family: var(--f-display);
  font-size: 18px;
  line-height: 1.1;
}
.tokrow {
  display: grid;
  grid-template-columns: 52px minmax(0, 1fr) auto;
  gap: 10px;
  align-items: center;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel2);
  padding: 6px 8px;
}
.tokrow img,
.avatar {
  width: 52px;
  height: 52px;
  object-fit: contain;
  border-radius: 6px;
  background: var(--bg);
  display: block;
}
.avatar.ph {
  display: grid;
  place-items: center;
  font-family: var(--f-display);
  font-size: 22px;
  color: var(--purple-hi);
}
.sub {
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 600;
  margin-top: 4px;
}
.tabs2 {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
}
.tabs2 button {
  background: none;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 4px 10px;
  font-size: 12px;
  color: var(--muted);
  font-weight: 600;
}
.tabs2 button[aria-pressed="true"] {
  border-color: var(--purple);
  color: var(--purple-hi);
  background: var(--purple-soft);
}
/* Ficha do agente. */
/* ---------- fichas ---------- */
.fcard {
  background: var(--panel2);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px;
  display: grid;
  grid-template-columns: 52px minmax(0, 1fr);
  gap: 10px;
  text-align: left;
  width: 100%;
}
.fcard:hover {
  border-color: var(--purple);
}
.fcard .nm {
  font-family: var(--f-display);
  font-size: 19px;
  line-height: 1.1;
}
.bars {
  display: grid;
  gap: 4px;
  grid-column: 1 / -1;
}
.bar {
  display: grid;
  grid-template-columns: 34px 1fr 64px;
  gap: 8px;
  align-items: center;
  font-size: 12px;
}
.bar .t {
  height: 8px;
  background: var(--bg);
  border-radius: 4px;
  overflow: hidden;
  border: 1px solid var(--line);
}
.bar .t i {
  display: block;
  height: 100%;
}
.bar .v {
  font-family: var(--f-mono);
  text-align: right;
}
.bar.pv i {
  background: var(--red);
}
.bar.san i {
  background: var(--purple);
}
.bar.pe i {
  background: var(--warn);
}
.sheet-top {
  display: grid;
  grid-template-columns: 120px minmax(0, 1fr);
  gap: 14px;
  align-items: start;
}
.photo {
  width: 120px;
  height: 160px;
  border-radius: 10px;
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
  border: 1px solid var(--line);
  background: var(--bg);
  overflow: hidden;
  position: relative;
  display: grid;
  place-items: center;
  padding: 0;
}
.photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: 50% 15%;
}
.photo span {
  font-size: 11px;
  color: var(--muted);
  padding: 6px;
  text-align: center;
}
.nmin {
  font-family: var(--f-display);
  font-size: 26px;
  background: none !important;
  border: 0 !important;
  border-bottom: 1px solid var(--line) !important;
  border-radius: 0 !important;
  padding: 2px 0 !important;
}
.sgrid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 14px;
}
.panel.wide .sgrid {
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
}
.attrs {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 6px;
}
.attr {
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 50% 50% 8px 8px;
  padding: 8px 2px 6px;
  text-align: center;
  display: flex;
  flex-direction: column;
  gap: 2px;
  align-items: center;
}
.attr .k {
  font-family: var(--f-display);
  font-size: 15px;
  color: var(--purple-hi);
}
.attr .n {
  font-family: var(--f-mono);
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
}
.attr .pm {
  display: flex;
  gap: 3px;
}
.attr .pm button {
  width: 24px;
  height: 22px;
  border-radius: 4px;
  border: 1px solid var(--line);
  background: var(--panel2);
  padding: 0;
  line-height: 1;
}
.res {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}
.resbox {
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 8px 10px;
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.resbox .big {
  font-family: var(--f-mono);
  font-size: 21px;
  font-weight: 700;
}
.resbox .big small {
  font-size: 13px;
  color: var(--muted);
  font-weight: 400;
}
.resbox .pm {
  display: flex;
  gap: 3px;
}
.resbox .pm button {
  flex: 1;
  padding: 3px 0;
  border: 1px solid var(--line);
  background: var(--panel2);
  border-radius: 4px;
  font-family: var(--f-mono);
  font-size: 12px;
}
.resbox.pv {
  border-top: 3px solid var(--red);
}
.resbox.san {
  border-top: 3px solid var(--purple);
}
.resbox.pe {
  border-top: 3px solid var(--warn);
}
.resbox.def {
  border-top: 3px solid var(--muted);
}
.per {
  display: grid;
  grid-template-columns: 20px minmax(0, 1fr) 30px 46px 58px;
  gap: 6px;
  align-items: center;
  padding: 3px 0;
  border-bottom: 1px solid var(--line);
  font-size: 14px;
}
.per .a {
  font-family: var(--f-mono);
  font-size: 11px;
  color: var(--muted);
}
.per input[type="number"] {
  padding: 3px 4px;
  font-size: 12px;
  text-align: center;
}
.per .only {
  font-size: 10px;
  color: var(--muted);
}
.per.tr .pn {
  font-weight: 600;
  color: var(--purple-hi);
}
.per:not(.tr) .pn {
  color: var(--muted);
}
.rollbtn {
  background: var(--red-soft);
  border: 1px solid var(--red);
  color: var(--fg);
  border-radius: 5px;
  padding: 3px 6px;
  font-family: var(--f-mono);
  font-size: 12px;
  white-space: nowrap;
}
.rollbtn:hover {
  background: var(--red);
}
.rollbtn:disabled {
  opacity: 0.4;
}
table.t {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
table.t th {
  text-align: left;
  font-size: 11px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 600;
  padding: 4px;
}
table.t td {
  padding: 4px;
  border-top: 1px solid var(--line);
  vertical-align: middle;
}
table.t input,
table.t select {
  padding: 4px 6px;
  font-size: 13px;
}
.ritual {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  gap: 10px;
  align-items: center;
  border: 1px solid var(--line);
  border-left: 4px solid var(--el, var(--muted));
  border-radius: 6px;
  padding: 8px 10px;
  background: var(--bg);
}
.ritual .rn {
  font-weight: 600;
}
.ritual .rd {
  font-size: 12px;
  color: var(--muted);
}
.el-Sangue {
  --el: var(--sangue);
}
.el-Morte {
  --el: var(--morte);
}
.el-Energia {
  --el: var(--energia);
}
.el-Conhecimento {
  --el: var(--conhecimento);
}
.el-Medo {
  --el: #e9e9f0;
}
.conds {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.cond {
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 3px 10px;
  font-size: 13px;
  background: var(--bg);
  color: var(--muted);
}
.cond[aria-pressed="true"] {
  border-color: var(--red);
  color: var(--red-hi);
  background: var(--red-soft);
}
/* Rolagens, registro e popup de dado. */
/* ---------- rolagens ---------- */
.log {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.entry {
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 8px 10px;
  background: var(--panel2);
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 3px 10px;
}
.entry .wh {
  font-size: 12px;
  color: var(--muted);
}
.entry .wh b {
  color: var(--purple-hi);
  font-weight: 600;
}
.entry .wt {
  font-weight: 600;
}
.entry .tot {
  grid-row: 1 / span 3;
  grid-column: 2;
  font-family: var(--f-mono);
  font-size: 24px;
  font-weight: 700;
  align-self: center;
  text-align: right;
  min-width: 40px;
}
.entry .det {
  font-family: var(--f-mono);
  font-size: 12px;
  color: var(--muted);
  word-break: break-word;
}
.entry.crit {
  border-color: var(--purple);
}
.entry.crit .tot {
  color: var(--purple-hi);
}
.entry.fail .tot {
  color: var(--red-hi);
}
.entry.chat {
  grid-template-columns: 1fr;
}
.entry.chat .wt {
  font-weight: 400;
}
.entry.secret {
  border-style: dashed;
}
.dicebar {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
}
.dicebar button {
  font-family: var(--f-mono);
  font-size: 13px;
}

/* popup de dado (para todos) */
#dicePops {
  position: fixed;
  bottom: calc(72px + env(safe-area-inset-bottom, 0px));
  left: calc(var(--rail) + 12px + env(safe-area-inset-left, 0px));
  z-index: 40;
  display: flex;
  flex-direction: column-reverse;
  gap: 8px;
  pointer-events: none;
  width: min(320px, calc(100vw - 24px));
}
.dpop {
  pointer-events: auto;
  background: rgba(20, 16, 25, 0.97);
  border: 1px solid var(--purple);
  border-radius: 8px;
  padding: 10px 12px;
  display: grid;
  grid-template-columns: 28px minmax(0, 1fr) auto;
  gap: 10px;
  align-items: center;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
}
.dpop.crit {
  border-color: var(--purple-hi);
  box-shadow:
    0 0 0 1px var(--purple-hi),
    0 10px 30px rgba(139, 63, 240, 0.35);
}
.dpop.fail {
  border-color: var(--red);
}
.dpop .t {
  font-weight: 700;
  font-size: 14px;
}
.dpop .s {
  font-family: var(--f-mono);
  font-size: 11px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.dpop .n {
  font-family: var(--f-mono);
  font-size: 28px;
  font-weight: 700;
}
@media (prefers-reduced-motion: no-preference) {
  .dpop {
    animation: pop 0.3s ease-out;
  }
  @keyframes pop {
    from {
      transform: translateX(16px);
      opacity: 0;
    }
    to {
      transform: none;
      opacity: 1;
    }
  }
}
/* Combate, escudo do mestre e homebrew. */
/* ---------- combate / escudo ---------- */
.cb {
  display: grid;
  grid-template-columns: 40px minmax(0, 1fr) auto;
  gap: 8px;
  align-items: center;
  background: var(--panel2);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 8px;
}
.cb.now {
  border-color: var(--red);
  box-shadow: inset 3px 0 0 var(--red);
}
.cb .iv {
  font-family: var(--f-mono);
  font-size: 19px;
  font-weight: 700;
  text-align: center;
}
.cb .cn {
  font-weight: 600;
}
.cb .cs {
  font-size: 12px;
  color: var(--muted);
  font-family: var(--f-mono);
}
.cb .act {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  justify-content: flex-end;
}
.cb.down {
  opacity: 0.5;
}
.cb.npc .cn {
  color: var(--red-hi);
}
.shield {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 10px;
}
.scard {
  background: var(--panel2);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.scard .top {
  display: grid;
  grid-template-columns: 52px minmax(0, 1fr);
  gap: 10px;
  align-items: center;
}
.scard .nm {
  font-family: var(--f-display);
  font-size: 18px;
  line-height: 1.1;
}
.mini {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 4px;
  text-align: center;
}
.mini div {
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 5px;
  padding: 3px 0;
}
.mini b {
  display: block;
  font-family: var(--f-mono);
  font-size: 15px;
}
.mini span {
  font-size: 10px;
  color: var(--muted);
}
.sbar {
  display: grid;
  grid-template-columns: 30px 1fr 30px;
  gap: 4px;
  align-items: center;
}
.sbar button {
  padding: 2px 0;
  border: 1px solid var(--line);
  background: var(--bg);
  border-radius: 4px;
  font-family: var(--f-mono);
  font-size: 12px;
}
.sbar .t {
  position: relative;
  height: 20px;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 4px;
  overflow: hidden;
}
.sbar .t i {
  position: absolute;
  inset: 0 auto 0 0;
}
.sbar .t span {
  position: relative;
  display: block;
  text-align: center;
  font-family: var(--f-mono);
  font-size: 12px;
  line-height: 18px;
}
.sbar.pv i {
  background: var(--red);
}
.sbar.san i {
  background: var(--purple);
}
.sbar.pe i {
  background: #a06a1c;
}
.dtref td {
  font-family: var(--f-mono);
}

/* ---------- homebrew ---------- */
.hb {
  border: 1px solid var(--line);
  border-left: 4px solid var(--el, var(--purple));
  border-radius: 8px;
  padding: 8px 10px;
  background: var(--panel2);
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.hb .hn {
  font-weight: 700;
}
/* Janelas (modal), avisos (toast) e chamadas. */
/* ---------- modal / toast ---------- */
.modal-back {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.65);
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.modal {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 16px;
  max-width: 440px;
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 12px;
  max-height: 90vh;
  overflow-y: auto;
}
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(84px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  background: var(--panel2);
  border: 1px solid var(--purple);
  padding: 10px 16px;
  border-radius: 8px;
  z-index: 60;
  max-width: calc(100% - 32px);
  font-size: 14px;
}
.banner {
  border: 1px solid var(--warn);
  color: var(--warn);
  background: #291e0e;
  padding: 10px 12px;
  border-radius: 8px;
  font-size: 14px;
}

/* ---------- call ---------- */
.cavs {
  display: flex;
}
.cavs .cav {
  margin-left: -6px;
}
.cavs .cav:first-child {
  margin-left: 0;
}
.cav {
  position: relative;
  border-radius: 50%;
  background: var(--purple-soft);
  border: 2px solid var(--panel);
  display: grid;
  place-items: center;
  overflow: visible;
  flex: none;
  transition: box-shadow 0.12s;
}
.cav img {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
}
.cav b {
  font-family: var(--f-display);
  font-weight: 400;
  color: var(--purple-hi);
  font-size: 14px;
}
.cav.speak {
  box-shadow:
    0 0 0 2px var(--purple-hi),
    0 0 12px var(--purple);
}
.cav .mut {
  position: absolute;
  right: -4px;
  bottom: -4px;
  width: 15px;
  height: 15px;
  border-radius: 50%;
  background: var(--red);
  color: #fff;
  display: grid;
  place-items: center;
}
.cav .mut svg {
  width: 10px;
  height: 10px;
}
.cav .st {
  position: absolute;
  left: -2px;
  top: -2px;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--warn);
  border: 1px solid var(--panel);
}
.cbtn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--panel2);
  display: grid;
  place-items: center;
  color: var(--fg);
}
.cbtn svg {
  width: 19px;
  height: 19px;
}
.cbtn.off {
  background: var(--red-soft);
  border-color: var(--red);
  color: var(--red-hi);
}
.cbtn.live {
  background: var(--purple);
  border-color: var(--purple);
}
.cbtn.hang {
  background: var(--red);
  border-color: var(--red);
  color: #fff;
}
.scr {
  background: #000;
  border: 1px solid var(--purple);
  border-radius: 8px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.scr .sh {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  padding: 4px 6px 4px 10px;
  background: var(--panel);
  font-size: 13px;
  font-weight: 600;
}
.scr video {
  width: 100%;
  display: block;
  background: #000;
  aspect-ratio: 16/9;
  object-fit: contain;
}
/* Ficha: barras de vida, cards de arma e ritual. */
/* ---------- ficha: barras, cards de arma e ritual ---------- */
.rbar {
  display: flex;
  gap: 10px;
  align-items: center;
}
.ric {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  flex: none;
  border: 2px solid rgba(255, 255, 255, 0.25);
  color: #fff;
}
.ric svg {
  width: 22px;
  height: 22px;
}
.rbar.pv .ric {
  background: radial-gradient(circle at 35% 30%, #ff5a68, #8d1220);
}
.rbar.san .ric {
  background: radial-gradient(circle at 35% 30%, #b47dff, #4a1c8a);
}
.rbar.pe .ric {
  background: radial-gradient(circle at 35% 30%, #f1b54a, #8a5a10);
}
.rtr {
  position: relative;
  display: flex;
  align-items: center;
  height: 30px;
  border-radius: 5px;
  overflow: hidden;
  background: var(--bg);
  border: 1px solid var(--line);
  margin-top: 3px;
}
.rtr i {
  position: absolute;
  inset: 0 auto 0 0;
  transition: width 0.25s;
}
.rbar.pv .rtr i {
  background: linear-gradient(90deg, #8d1220, var(--red));
}
.rbar.san .rtr i {
  background: linear-gradient(90deg, #4a1c8a, var(--purple));
}
.rbar.pe .rtr i {
  background: linear-gradient(90deg, #8a5a10, #d39a2e);
}
.rtr span {
  position: relative;
  flex: 1;
  text-align: center;
  font-family: var(--f-mono);
  font-weight: 700;
  font-size: 14px;
  text-shadow: 0 1px 2px #000;
}
.rtr button {
  position: relative;
  background: none;
  border: 0;
  color: #fff;
  width: 28px;
  height: 100%;
  font-size: 17px;
  line-height: 1;
  text-shadow: 0 1px 2px #000;
}
.rtr button:hover {
  background: rgba(255, 255, 255, 0.12);
}
.stats {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 6px;
}
.stats div {
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 6px;
  text-align: center;
}
.stats b {
  display: block;
  font-family: var(--f-mono);
  font-size: 18px;
}
.stats span {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
}
details.more summary {
  cursor: pointer;
  font-size: 13px;
  color: var(--purple-hi);
}
.condrow {
  display: grid;
  grid-template-columns: 24px minmax(0, 1fr) auto;
  gap: 8px;
  align-items: center;
  background: var(--bg);
  border: 1px solid var(--line);
  border-left: 3px solid var(--red);
  border-radius: 6px;
  padding: 6px 6px 6px 10px;
}
.wcard {
  background: linear-gradient(180deg, #19151f, #120f16);
  border: 1px solid var(--line);
  border-radius: 8px;

}
.wcard.open {

}
.wcard .wh {

  grid-template-columns: 48px minmax(0, 1fr) auto auto;

}
.wcard .wi {
  color: #d8d2e0;
  width: 48px;
  height: 20px;
}
.wcard .wi svg {
  width: 48px;
  height: 20px;
}
.wcard .wn {
  background: none;

.wcard .chev {
  background: none;

.wst {

  flex-wrap: wrap;

}
.wst b {

.rcard {

  --g2: #3a2a08;
}
.rcard.el-Medo {
  --g1: #d9d9e6;
  --g2: #7b7b92;
  color: #121016;

.rcard .rh {
  display: flex;

  align-items: flex-start;
}
.rsig {
  width: 46px;
  height: 46px;

  opacity: 0.95;
}
.rsig svg {
  width: 46px;
  height: 46px;
}
.rcard .rt {
  font-family: var(--f-display);
  font-size: 19px;
  line-height: 1.1;
}
.rcard .rc {

.rcard .rdsc {

.rforms {

.rform {
  background: rgba(0, 0, 0, 0.38);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 6px;
  padding: 7px 9px;
  text-align: left;
  color: #fff;
}
.rform:hover {
  background: rgba(0, 0, 0, 0.55);
  border-color: rgba(255, 255, 255, 0.35);
}
.rform b {
  display: block;
  font-family: var(--f-mono);
  font-size: 17px;
}
.rform span {
  font-size: 10px;

.board-top .chip {

@media (min-width: 761px) {

.per2 {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 30px 108px 46px 58px;
  gap: 6px;
  align-items: center;
  padding: 3px 0;
  border-bottom: 1px solid var(--line);

/* Criador de mapas. */
/* ===== criador de mapas ===== */
body.me-open {
  overflow: hidden;
}
.mapEd {
  position: fixed;
  inset: 0;
  z-index: 45;
  background: #020203;
  display: flex;
  flex-direction: column;
  color: var(--fg);
}
.me-top {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  border-bottom: 1px solid var(--line);
  background: var(--panel);
  flex-wrap: wrap;
}
.me-top #meNome {
  max-width: 260px;
  font-family: var(--f-display);
  font-size: 18px;
  background: transparent;
  border: 1px solid transparent;
}
.me-top #meNome:hover,
.me-top #meNome:focus {
  border-color: var(--line);
  background: var(--bg);
}
.me-top select {
  width: auto;
  max-width: 210px;
}
.me-gap {
  flex: 1;
}
.me-main {
  flex: 1;
  display: grid;
  grid-template-columns: 60px minmax(0, 1fr) 330px;
  min-height: 0;
}
.mapEd.noside .me-main {
  grid-template-columns: 60px minmax(0, 1fr) 0;
}
.mapEd.noside .me-side {
  display: none;
}
.me-tools {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 8px 6px;
  border-right: 1px solid var(--line);
  background: var(--panel);
  overflow-y: auto;
}
.me-tools .tool {
  width: 46px;
  height: 46px;
}
.me-stage {
  position: relative;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  touch-action: none;
}
.me-stage canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  cursor: crosshair;
}
.me-hint {
  position: absolute;
  left: 12px;
  top: 10px;
  right: 12px;
  pointer-events: none;
  font-size: 13px;
  color: #cfc8dc;
  text-shadow: 0 1px 3px #000;
}
.me-zoom {
  position: absolute;
  right: 12px;
  bottom: 12px;
  display: flex;
  gap: 6px;
}
.me-side {
  border-left: 1px solid var(--line);
  background: var(--panel);
  overflow-y: auto;
  padding: 12px;
}
.me-side .sub {
  margin: 4px 0 0;
}
.me-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 6px;
}
.me-grid.o {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}
.me-sw {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 5px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel2);
  color: var(--fg);
  font-size: 11px;
  line-height: 1.15;
  text-align: center;
  cursor: pointer;
  min-width: 0;
}
.me-sw img {
  width: 100%;
  aspect-ratio: 1;
  object-fit: contain;
  border-radius: 5px;
  background: #5b5e5d;
}
.me-grid.o .me-sw img {
  background: #47494b;
}
.me-grid.w .me-sw img {
  aspect-ratio: auto;
  height: 40px;
  object-fit: cover;
}
.me-sw span {
  overflow: hidden;
  text-overflow: ellipsis;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  width: 100%;
}
.me-sw:hover {
  border-color: var(--purple);
}
.me-sw.on {
  border-color: var(--purple-hi);
  box-shadow: 0 0 0 2px var(--purple) inset;
  background: var(--purple-soft);
}
.me-cats {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}
.me-cats .chip {
  font-size: 12px;
  padding: 4px 10px;
  cursor: pointer;
  color: var(--fg);
}
.me-cats .chip.on {
  border-color: var(--purple);
  background: var(--purple-soft);
}
.me-cur {
  display: grid;
  grid-template-columns: 64px minmax(0, 1fr);
  gap: 10px;
  align-items: center;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 8px;
  background: var(--panel2);
}
.me-cur img {
  width: 64px;
  height: 64px;
  border-radius: 6px;
  background: #47494b;
}
.me-cor {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: 2px solid var(--line);
  cursor: pointer;
}
.me-cor.on {
  border-color: #fff;
  box-shadow: 0 0 0 2px var(--purple);
}
.me-acts {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 6px;
}
.modal.wide {
  max-width: 980px;
}
.me-models {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 10px;
}
.me-model {
  display: flex;
  flex-direction: column;
  gap: 5px;
  text-align: left;
  padding: 8px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--panel2);
  color: var(--fg);
  cursor: pointer;
}
.me-model:hover {
  border-color: var(--purple);
}
.me-model canvas {
  width: 100%;
  height: auto;
  border-radius: 6px;
  background: #040405;
}
@media (max-width: 760px) {
  .me-main {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr) 42%;
  }
  .mapEd.noside .me-main {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr) 0;
  }
  .me-tools {
    flex-direction: row;
    border-right: 0;

  .me-tools .tool .tip {

  .me-side {
    border-left: 0;

    grid-template-columns: repeat(4, minmax(0, 1fr));

  .me-hint {

  }

/* Ajustes de toque e de celular, capa, aviso de versão nova e documentos no mapa. */
/* sem zoom de toque duplo e sem seleção azul ao clicar 2x na interface */
html,
body {
  touch-action: manipulation;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}
button,
.btn,
.rail,
.tok,
.board,
.viewport,
.me-stage,
.tabs,
.chip,
label,
summary,
.mesa-card,
.label,
.avatar,
img {
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
input,
textarea,
[contenteditable="true"],
.log,
.doc-body,
.sheet p {
  -webkit-user-select: text;
  user-select: text;
}
/* celular: campos com 16px para o navegador não dar zoom ao tocar neles */
@media (pointer: coarse) {
  input,
  select,
  textarea,
  table.t select,
  input[type="number"] {
    font-size: 16px !important;
  }
}

<script>
"use strict";
/* Rolagem de dados (1d20, 2d6+3, testes de atributo). */
/* ===================== DADOS ===================== */
function d(n) {
  const a = new Uint32Array(1);
  crypto.getRandomValues(a);
  return 1 + (a[0] % n);
}
function rollN(n, f) {
  const r = [];
  for (let i = 0; i < n; i++) r.push(d(f));
  return r;
}
function parseExpr(s) {
  s = String(s || "")
    .replace(/\s+/g, "")
    .toLowerCase();
  if (!s) return null;
  const re = /([+-]?)(\d*d\d+|\d+)/g;
  let m,
    pos = 0;
  const terms = [];
  while ((m = re.exec(s))) {
    if (m.index !== pos) return null;
    pos = re.lastIndex;
    const sign = m[1] === "-" ? -1 : 1;
    const t = m[2];
    if (t.includes("d")) {
      let [n, f] = t.split("d");
      n = n === "" ? 1 : +n;
      f = +f;
      if (n < 1 || n > 60 || f < 2 || f > 1000) return null;
      terms.push({ sign, n, f });
    } else terms.push({ sign, c: +t });
  }
  if (pos !== s.length || !terms.length) return null;
  return terms;
}
function rollExpr(expr, { critMult = 1, explode6 = false, extraDice = 0 } = {}) {
  const terms = parseExpr(expr);
  if (!terms) return null;
  let total = 0;
  const parts = [];
  let first = true;
  for (const t of terms) {
    if (t.c !== undefined) {
      total += t.sign * t.c;
      parts.push((t.sign < 0 ? "−" : "+") + t.c);
      continue;
    }
    let n = t.n;
    if (t.sign > 0) {
      if (first) {
        n += extraDice;
        first = false;
      }
      n *= critMult;
    }
    let r = rollN(n, t.f);
    if (explode6) {
      let ex = r.filter(x => x === 6).length;
      while (ex > 0) {
        const nr = rollN(ex, t.f);
        r = r.concat(nr);
        ex = nr.filter(x => x === 6).length;
      }
    }
    const sum = r.reduce((a, b) => a + b, 0);
    total += t.sign * sum;
    parts.push((t.sign < 0 ? "−" : "+") + r.length + "d" + t.f + "[" + r.join(",") + "]");
  }
  return { total, detail: parts.join(" ").replace(/^\+/, "") };
}
// Teste de Ordem: 1d20 por ponto de atributo, fica com o maior. ≤0: 2d20 (+1 por ponto abaixo de 0), fica com o menor.
function rollTest(attr, mod, penDice = 0) {
  const n = attr - penDice;
  let dice, kept, mode;
  if (n >= 1) {
    dice = rollN(n, 20);
    kept = Math.max(...dice);
    mode = "maior";
  } else {
    dice = rollN(2 + -n, 20);
    kept = Math.min(...dice);
    mode = "menor";
  }
  return { dice, kept, mode, total: kept + mod };
}
const sgn = m => (m ? ` ${m > 0 ? "+" : "−"}${Math.abs(m)}` : "");

"use strict";
/* Banco de dados: Firebase de verdade ou banco de teste no navegador (#teste). */
/* ===================== BANCO: Firebase ou modo de teste ===================== */
const DEL = { __del: true };
function firebaseDB() {
  const fs = firebase.firestore();
  try {
    fs.settings({ ignoreUndefinedProperties: true, merge: true });
  } catch (e) {}
  const toList = s => s.docs.map(x => ({ id: x.id, ...x.data() }));
  return {
    mode: "firebase",
    listenCol(path, o, cb, err) {
      let q = fs.collection(path);
      if (o && o.where) q = q.where(o.where[0], "==", o.where[1]);
      if (o && o.orderBy) q = q.orderBy(o.orderBy, o.dir || "asc");
      if (o && o.limit) q = q.limit(o.limit);
      return q.onSnapshot(
        s => cb(toList(s), { fromCache: s.metadata.fromCache }),
        e => err && err(e)
      );
    },
    listenDoc(path, cb, err) {
      return fs.doc(path).onSnapshot(
        s => cb(s.exists ? s.data() : null),
        e => err && err(e)
      );
    },
    async get(path) {
      const s = await fs.doc(path).get();
      return s.exists ? s.data() : null;
    },
    async getCol(path) {
      const s = await fs.collection(path).get();
      return s.docs.map(x => ({ id: x.id, ...x.data() }));
    },
    set(path, data) {
      return fs.doc(path).set(data);
    },
    merge(path, data) {
      return fs.doc(path).set(data, { merge: true });
    },
    setKey(path, key, sub, val, extra) {
      // grava/remove data[key][sub] sem tocar no resto
      if (val === DEL)
        return fs
          .doc(path)
          .update({ [key + "." + sub]: firebase.firestore.FieldValue.delete(), ...(extra || {}) })
          .catch(e => {
            if (e.code !== "not-found") throw e;
          });
      return fs.doc(path).set({ [key]: { [sub]: val }, ...(extra || {}) }, { merge: true });
    },
    async add(col, data) {
      const r = await fs.collection(col).add(data);
      return r.id;
    },
    del(path) {
      return fs.doc(path).delete();
    }
  };
}
function localDB() {
  // tudo em memória, só neste navegador; abas abertas ao mesmo tempo se sincronizam (para testar antes de configurar o Firebase)
  const docs = new Map();
  const ls = new Set();
  const clone = o => (o == null ? o : JSON.parse(JSON.stringify(o)));
  const parent = p => p.slice(0, p.lastIndexOf("/"));
  let bc = null;
  try {
    bc = new BroadcastChannel("simula-ordem-teste");
  } catch (e) {}
  function notify(changed) {
    setTimeout(() => ls.forEach(l => l.fire()), 0);
    if (bc && changed)
      changed.forEach(path => {
        try {
          bc.postMessage({ t: "put", path, data: docs.has(path) ? docs.get(path) : null });
        } catch (e) {}
      });
  }
  if (bc) {
    bc.onmessage = ev => {
      const m = ev.data;
      if (m.t === "put") {
        if (m.data == null) docs.delete(m.path);
        else docs.set(m.path, m.data);
        setTimeout(() => ls.forEach(l => l.fire()), 0);
      } else if (m.t === "hello") bc.postMessage({ t: "dump", entries: [...docs.entries()] });
      else if (m.t === "dump" && !docs.size) {
        m.entries.forEach(([k, v]) => docs.set(k, v));
        setTimeout(() => ls.forEach(l => l.fire()), 0);
      }
    };
    bc.postMessage({ t: "hello" });
  }
  function deepMerge(a, b) {
    for (const k in b) {
      const v = b[k];
      if (v === DEL) {
        delete a[k];
        continue;
      }
      if (
        v &&
        typeof v === "object" &&
        !Array.isArray(v) &&
        a[k] &&
        typeof a[k] === "object" &&
        !Array.isArray(a[k])
      )
        deepMerge(a[k], v);
      else a[k] = clone(v);
    }
    return a;
  }
  return {
    mode: "local",
    listenCol(path, o, cb) {
      const l = {
        fire() {
          let list = [];
          docs.forEach((v, k) => {
            if (parent(k) === path && (!o || !o.where || v[o.where[0]] === o.where[1]))
              list.push({ id: k.slice(path.length + 1), ...clone(v) });
          });
          if (o && o.orderBy) {
            const f = o.orderBy,
              s = o.dir === "desc" ? -1 : 1;
            list.sort((a, b) => ((a[f] ?? 0) > (b[f] ?? 0) ? 1 : (a[f] ?? 0) < (b[f] ?? 0) ? -1 : 0) * s);
          } else list.sort((a, b) => (a.id < b.id ? -1 : 1));
          if (o && o.limit) list = list.slice(0, o.limit);
          cb(list, { fromCache: false });
        }
      };
      ls.add(l);
      setTimeout(() => l.fire(), 0);
      return () => ls.delete(l);
    },
    listenDoc(path, cb) {
      const l = {
        fire() {
          cb(clone(docs.get(path) ?? null));
        }
      };
      ls.add(l);
      setTimeout(() => l.fire(), 0);
      return () => ls.delete(l);
    },
    async get(path) {
      return clone(docs.get(path) ?? null);
    },
    async getCol(path) {
      const out = [];
      docs.forEach((v, k) => {
        if (parent(k) === path) out.push({ id: k.slice(path.length + 1), ...clone(v) });
      });
      return out;
    },
    async set(path, data) {
      docs.set(path, clone(data));
      notify([path]);
    },
    async merge(path, data) {
      docs.set(path, deepMerge(docs.get(path) || {}, data));
      notify([path]);
    },
    async setKey(path, key, sub, val, extra) {
      const o = docs.get(path) || {};
      Object.assign(o, extra || {});
      o[key] = o[key] || {};
      if (val === DEL) delete o[key][sub];
      else o[key][sub] = clone(val);
      docs.set(path, o);
      notify([path]);
    },
    async add(col, data) {
      const id = rid(16);
      docs.set(col + "/" + id, clone(data));
      notify([col + "/" + id]);
      return id;
    },
    async del(path) {
      docs.delete(path);
      notify([path]);
    }
  };
}
</script>
<script>
"use strict";
/* Imagens: carregar e comprimir no navegador antes de salvar. */
/* ===================== IMAGENS (comprimidas no navegador) ===================== */
function pickImage() {
  return new Promise(res => {
    const inp = $("#fileIn");
    inp.value = "";
    inp.onchange = () => res(inp.files[0] || null);
    inp.click();
  });
}
function loadImg(file) {
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(file);
    const im = new Image();
    im.onload = () => {
      res(im);
      setTimeout(() => URL.revokeObjectURL(u), 1000);
    };
    im.onerror = () => rej(new Error("imagem"));
    im.src = u;
  });
}
function drawTo(im, w, h, sx = 0, sy = 0, sw = im.naturalWidth, sh = im.naturalHeight) {
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(w));
  c.height = Math.max(1, Math.round(h));
  const g = c.getContext("2d");
  g.imageSmoothingQuality = "high";
  g.drawImage(im, sx, sy, sw, sh, 0, 0, c.width, c.height);
  return c;
}
async function compressScene(file) {
  // mapa/cenário: cabe num documento do Firestore (< 1 MB)
  const im = await loadImg(file);
  let max = 2000;
  const LIMIT = 880000;
  for (let tries = 0; tries < 8; tries++) {
    const k = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight));
    const c = drawTo(im, im.naturalWidth * k, im.naturalHeight * k);
    for (const q of [0.82, 0.7, 0.58, 0.48]) {
      const url = c.toDataURL("image/jpeg", q);
      if (url.length <= LIMIT) return { url, w: c.width, h: c.height };
    }
    max = Math.round(max * 0.8);
  }
  throw new Error("grande");
}
function thumbOf(url, w = 192) {
  return new Promise(res => {
    const im = new Image();
    im.onload = () => {
      const k = w / im.naturalWidth;
      res(drawTo(im, w, im.naturalHeight * k).toDataURL("image/jpeg", 0.6));
    };
    im.onerror = () => res("");
    im.src = url;
  });
}
async function compressToken(file) {
  // token: mantém transparência
  const im = await loadImg(file);
  const k = Math.min(1, 260 / Math.max(im.naturalWidth, im.naturalHeight));
  const c = drawTo(im, im.naturalWidth * k, im.naturalHeight * k);
  let url = c.toDataURL("image/webp", 0.85);
  if (!url.startsWith("data:image/webp")) url = c.toDataURL("image/png");
  return { url, w: c.width, h: c.height };
}
</script>
<script>
"use strict";
/* Funções pequenas usadas no site todo: $, esc, toast, caixas de confirmação, menus. */
/* ===================== UTILITÁRIOS ===================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s =>
  String(s ?? "").replace(
    /[&<>"']/g,
    c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]
  );
function rid(n = 6) {
  const a = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let s = "";
  for (let i = 0; i < n; i++) s += a[d(a.length) - 1];
  return s;
}
/* Toque duplo: devolve true se a mesma ação já rodou há menos de ms milissegundos.
   Uso no começo de uma função: if (toqueDuplo("nome")) return; */
function toqueDuplo(chave, ms = 1200) {
  const agora = Date.now();
  if (agora - (toqueDuplo.ultimo[chave] || 0) < ms) return true;
  toqueDuplo.ultimo[chave] = agora;
  return false;
}
toqueDuplo.ultimo = {};
// fecha o menu "Opções" ao escolher um item ou clicar fora dele
document.addEventListener("click", e => {
  $$("details.menu[open]").forEach(m => {
    if (!m.contains(e.target) || e.target.closest(".menu-lista button")) m.open = false;
  });
});
/* Menu suspenso "Opções ▾" (some sozinho se não tiver itens). itens = lista de HTML de botões. */
function menuHTML(id, rotulo, itens) {
  if (!itens.length) return "";
  return `<details class="menu" id="${id}"><summary class="btn sm ghost">${rotulo} <span aria-hidden="true">▾</span></summary><div class="menu-lista" role="menu">${itens.join("")}</div></details>`;
}
function toast(msg) {
  const h = $("#toastHost");
  h.innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`;
  clearTimeout(toast.t);
  toast.t = setTimeout(() => (h.innerHTML = ""), 3200);
}
function lsGet(k, def) {
  try {
    const v = localStorage.getItem(k);
    return v == null ? def : JSON.parse(v);
  } catch (e) {
    return def;
  }
}
function lsSet(k, v) {
  try {
    localStorage.setItem(k, JSON.stringify(v));
  } catch (e) {}
}
function confirmBox(title, text, okLabel = "Apagar") {
  return new Promise(res => {
    const h = $("#modalHost");
    h.innerHTML = `<div class="modal-back"><div class="modal" role="dialog" aria-label="${esc(title)}"><h3>${esc(title)}</h3><p class="muted" style="margin:0">${esc(text)}</p><div class="row" style="justify-content:flex-end"><button class="btn" id="mNo">Cancelar</button><button class="btn danger" id="mYes">${esc(okLabel)}</button></div></div></div>`;
    $("#mNo").onclick = () => {
      h.innerHTML = "";
      res(false);
    };
    $("#mYes").onclick = () => {
      h.innerHTML = "";
      res(true);
    };
  });
}
function formBox(title, inner, okLabel = "Salvar") {
  return new Promise(res => {
    const h = $("#modalHost");
    h.innerHTML = `<div class="modal-back"><form class="modal" id="mForm"><h3>${esc(title)}</h3>${inner}<div class="row" style="justify-content:flex-end"><button type="button" class="btn" id="mNo">Cancelar</button><button class="btn primary">${esc(okLabel)}</button></div></form></div>`;
    $("#mNo").onclick = () => {
      h.innerHTML = "";
      res(null);
    };
    $("#mForm").onsubmit = e => {
      e.preventDefault();
      const out = {};
      $$("#mForm [name]").forEach(el => {
        if (el.type === "radio") {
          if (el.checked) out[el.name] = el.value;
        } else out[el.name] = el.type === "checkbox" ? el.checked : el.value;
      });
      h.innerHTML = "";
      res(out);
    };
    setTimeout(() => {
      const f = $("#mForm input,#mForm select");
      f && f.focus();
    }, 30);
  });
}
/* Nome de quem está jogando: "Mestre", o nome do agente ou o da conta. */
function myName() {
  const f = Object.values(S.fichas).find(x => x.dono === S.uid && !x.npc);
  return S.isM ? "Mestre" : f ? f.nome : (S.authUser && S.authUser.displayName) || "Agente";
}
</script>
<script>
"use strict";
/* Erros: o site guarda os últimos erros desta visita. Em Como usar → "Algo deu errado?"
   dá para copiar um relatório e mandar para quem for consertar. */
const ERROS = [];
function registrarErro(msg, onde = "") {
  ERROS.push({
    quando: new Date().toLocaleTimeString("pt-BR"),
    msg: String(msg || "erro").slice(0, 300),
    onde
  });
  if (ERROS.length > 20) ERROS.shift();
}
window.addEventListener("error", e => registrarErro(e.message, "linha " + e.lineno));
window.addEventListener("unhandledrejection", e => {
  const r = e.reason;
  registrarErro((r && (r.code || r.message)) || r, "promessa");
});
function relatorioErros() {
  return [
    "Simula Ordem · versão " + VERSAO_SITE,
    "Aparelho: " + navigator.userAgent,
    "Tela: " + innerWidth + "×" + innerHeight,
    "Mesa: " +
      (S.mesaId || "nenhuma") +
      " · " +
      (S.isM ? "mestre" : "jogador") +
      (S.testMode ? " · teste" : ""),
    "Painel aberto: " + (S.tool || "nenhum"),
    "",
    ...(ERROS.length
      ? ERROS.map(e => `[${e.quando}] ${e.msg}${e.onde ? " (" + e.onde + ")" : ""}`)
      : ["Nenhum erro registrado nesta visita."])
  ].join("\n");
}
/* Caixa "Algo deu errado?" no fim do Como usar. */
function relatorioHTML() {
  return `<details class="box aj" id="relErros"><summary><b>Algo deu errado?</b>${ERROS.length ? ` <span class="tag red">${ERROS.length} erro${ERROS.length > 1 ? "s" : ""}</span>` : ""}</summary>
   <p>Copie este relatório e mande para quem cuida do site, junto com o que você estava fazendo. Ele não tem senha nem nada pessoal.</p>
   <textarea id="relTexto" readonly rows="6" style="font-family:var(--f-mono);font-size:12px">${esc(relatorioErros())}</textarea>
   <button type="button" class="btn sm" id="relCopiar">Copiar relatório</button></details>`;
}
function bindRelatorio() {
  const b = $("#relCopiar");
  if (!b) return;
  b.onclick = async () => {
    const ta = $("#relTexto");
    try {
      await navigator.clipboard.writeText(ta.value);
      toast("Relatório copiado.");
    } catch (e) {
      ta.select(); // sem permissão de copiar: deixa selecionado para a pessoa copiar
      toast("Selecionei o texto. Copie com Ctrl+C (ou segure e copie no celular).");
    }
  };
}
</script>

<script>
"use strict";
/* Estado do site (objeto S) e início: login, modo de teste, abrir a mesa do link. */
/* ===================== ESTADO ===================== */
const S = {
  db: null,
  uid: null,
  authUser: null,
  mesaId: null,
  mesa: null,
  isM: false,
  mesas: [],
  fichas: {},
  log: [],
  combate: null,
  cenas: [],
  tokens: [],
  pos: {},
  homebrew: [],
  notas: "",
  secret: [],
  viewSid: null,
  sceneImg: {},
  tool: null,
  openFicha: null,
  dirty: {},
  unsub: [],
  posUnsub: null,
  sel: null,
  seenLog: new Set(),
  logPrimed: false,
  loaded: {},
  lobbyUnsub: null,
  ruleTab: "testes",
  tokTab: "todos"
};
const P = () => "mesas/" + S.mesaId;

/* gravação em fila por documento (uma de cada vez) */
const writeQ = {};
function queueSet(path, data) {
  const q = writeQ[path] || (writeQ[path] = { run: false, next: null });
  q.next = data;
  if (q.run) return;
  (async () => {
    q.run = true;
    while (q.next) {
      const b = q.next;
      q.next = null;
      try {
        await S.db.set(path, b);
      } catch (e) {
        fail(e);
      }
    }
    q.run = false;
  })();
}
function fail(e) {
  console.error(e);
  registrarErro((e && (e.code || e.message)) || e, "fail"); // vai para o relatório (nucleo/erros.js)
  const c = e && e.code;
  if (c === "permission-denied")
    toast(
      "O banco recusou. Só o mestre (ou o dono da ficha) pode fazer isso, ou as regras do Firestore não foram publicadas."
    );
  else if (c === "resource-exhausted")
    toast("O limite grátis do dia do Firebase acabou. Amanhã volta ao normal.");
  else if (c === "invalid-argument" && /longer than|exceeds/i.test(e.message || ""))
    toast("Essa imagem ficou grande demais. Tente uma menor.");
  else toast("Não deu para salvar agora. Confira a internet e tente de novo.");
}

/* ===================== INÍCIO ===================== */
async function boot() {
  const configured =
    window.firebase && FIREBASE_CONFIG.projectId && FIREBASE_CONFIG.projectId !== "COLE_AQUI";
  if (!configured) {
    if (location.hash === "#teste" || lsGet("ms_teste", false)) {
      lsSet("ms_teste", true);
      if (location.hash === "#teste") history.replaceState(null, "", location.pathname);
      S.db = localDB();
      S.uid = (() => {
        try {
          let u = sessionStorage.getItem("ms_uid");
          if (!u) {
            u = "local-" + rid(6);
            sessionStorage.setItem("ms_uid", u);
          }
          return u;
        } catch (e) {
          return "local-" + rid(6);
        }
      })();
      S.testMode = true;
      return start();
    }
    return renderSetup();
  }
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    S.db = firebaseDB();
    await new Promise(res => {
      const off = firebase.auth().onAuthStateChanged(u => {
        off();
        res(u);
      });
    });
    let u = firebase.auth().currentUser;
    if (!u) u = (await firebase.auth().signInAnonymously()).user;
    S.uid = u.uid;
    S.authUser = u;
  } catch (e) {
    console.error(e);
    return renderNoDb(e);
  }
  start();
}
function start() {
  subscribeLobby();
  route();
  window.addEventListener("hashchange", route);
  window.addEventListener("resize", () => {
    if (S.mesaId && !S.userMoved) fitView();
  });
}
function route() {
  const m = location.hash.match(/^#mesa-([A-Z0-9]{4,10})$/);
  if (!m) S.gate = null;
  if (m && m[1] !== S.mesaId) enterMesa(m[1]);
  else if (!m && S.mesaId) leaveMesa(true);
  else if (!m) showLobby();
}
function renderSetup() {
  $("#lobby").hidden = false;
  $("#vtt").hidden = true;
  $("#lobby").innerHTML =
    `<div class="lwrap"><div class="brand">${I.logo()}<div>Simula Ordem<small>Ordo Realitas · sistema de Ordem</small></div></div>
  <div class="stack" style="max-width:640px;margin-top:40px"><h2>Falta ligar o banco</h2>
  <p class="muted">Abra o <b>index.html</b> e cole a configuração do seu projeto Firebase no bloco <code>FIREBASE_CONFIG</code>. Sem isso, a mesa não sincroniza entre os jogadores.</p>
  <p class="muted">Quer ver como funciona antes? O modo de teste guarda tudo só neste navegador (abas abertas juntas conversam entre si) e apaga quando você fecha.</p>
  <div><button class="btn primary" id="btnTeste">Abrir modo de teste</button></div></div></div>`;
  $("#btnTeste").onclick = () => {
    location.hash = "teste";
    location.reload();
  };
}
function renderNoDb(e) {
  $("#lobby").hidden = false;
  const why =
    e && e.code === "auth/operation-not-allowed"
      ? "O login anônimo está desligado. No Firebase, vá em Authentication → Sign-in method e ative Anônimo."
      : e && /unauthorized-domain/.test(e.code || "")
        ? "Este endereço não está autorizado. No Firebase, vá em Authentication → Settings → Domínios autorizados e adicione o domínio do seu site."
        : "Não consegui conectar ao Firebase. Confira a configuração colada no index.html e a internet.";
  $("#lobby").innerHTML =
    `<div class="lwrap"><div class="brand">${I.logo()}<div>Simula Ordem</div></div><div class="stack" style="max-width:620px;margin-top:40px"><h2>Não deu para abrir a mesa</h2><p class="muted">${esc(why)}</p></div></div>`;
}
</script>
<script>
"use strict";
/* Tela inicial: criar mesa, entrar com código, Meus personagens, mesas públicas. */
/* ===================== LOBBY ===================== */
/* Índice pessoal: usuarios/<uid>/fichas guarda um resumo de cada ficha da pessoa, em todas as mesas */
function subscribeMeus() {
  subscribeSolos(); // Meus personagens sem mesa (mesa/personagens)
  if (S.meusUnsub || !S.uid) return;
  S.meus = [];
  subscribeMinhas();
  S.meusUnsub = S.db.listenCol(
    "usuarios/" + S.uid + "/fichas",
    null,
    list => {
      S.meus = list;
      S.loaded.meus = true;
      if (!S.mesaId) showLobby();
    },
    () => {
      S.loaded.meus = true;
    }
  );
}
function syncIndice() {
  // atualiza o índice das minhas fichas desta mesa (só quando algo muda)
  if (!S.mesaId || !S.uid) return;
  const mesaNome = (S.mesa && S.mesa.nome) || "";
  for (const [fid, f] of Object.entries(S.fichas)) {
    if (f.dono !== S.uid || f.npc) continue;
    const r = {
      mesaId: S.mesaId,
      fichaId: fid,
      mesaNome,
      nome: f.nome || "",
      classe: f.classe || "",
      trilha: f.trilha || "",
      origem: f.origem || "",
      nex: +f.nex || 5,
      foto: f.foto || "",
      ts: Date.now()
    };
    const key = S.mesaId + "_" + fid;
    const old = (S.meus || []).find(x => x.id === key);
    if (old && ["mesaNome", "nome", "classe", "trilha", "origem", "nex", "foto"].every(k => old[k] === r[k]))
      continue;
    S.db.set("usuarios/" + S.uid + "/fichas/" + key, r).catch(() => {});
  }
  // fichas que deixaram de ser minhas nesta mesa
  (S.meus || [])
    .filter(
      x =>
        x.mesaId === S.mesaId &&
        S.loaded.fichas &&
        !(S.fichas[x.fichaId] && S.fichas[x.fichaId].dono === S.uid && !S.fichas[x.fichaId].npc)
    )
    .forEach(x => S.db.del("usuarios/" + S.uid + "/fichas/" + x.id).catch(() => {}));
}
function subscribeMinhas() {
  if (S.minhasUnsub || !S.uid) return;
  S.minhas = [];
  S.minhasUnsub = S.db.listenCol(
    "usuarios/" + S.uid + "/mesas",
    null,
    list => {
      S.minhas = list;
      if (!S.mesaId) showLobby();
    },
    () => {}
  );
}
function subscribeLobby() {
  subscribeMeus();
  subscribeMinhas();
  if (S.lobbyUnsub) return;
  // só as mesas marcadas como públicas aparecem na lista; as outras só entram pelo link ou código
  S.lobbyUnsub = S.db.listenCol(
    "portas",
    { where: ["listada", true], limit: 100 },
    list => {
      S.loaded.lobby = true;
      S.mesas = list.sort((a, b) => (b.criada || 0) - (a.criada || 0));
      if (!S.mesaId) showLobby();
    },
    e => {
      S.loaded.lobby = true;
      S.lobbyErr = true;
      if (!S.mesaId) showLobby();
    }
  );
}
function showLobby() {
  if (S.gate || S.mesaId) return; // portão de entrada aberto: não atropelar
  $("#vtt").hidden = true;
  const L = $("#lobby");
  L.hidden = false;
  document.title = "Simula Ordem";
  // "Suas mesas" e "Mesas em que você joga" vêm da conta (valem em qualquer aparelho); o histórico local completa
  const idx = S.minhas || [];
  const seen = new Set();
  const fromIdx = papel =>

      p + "/membros/" + S.uid,
      d => {
        if (d) fuiMembro = true;
        else if (fuiMembro && !S.isM) semAcesso();
      },
      () => {}
    )
  );
  u.push(
    S.db.listenCol(
      p + "/fichas",
      null,
      list => {
        S.loaded.fichas = true;
        const next = {};
        list.forEach(x => {
          const { id: fid, ...rest } = x;
          const old = S.fichas[fid];
          if (old && S.dirty[fid]) next[fid] = old;
          else if (old) {
            for (const k of Object.keys(old)) if (!(k in rest)) delete old[k];
            Object.assign(old, rest);
            next[fid] = old;
          } // mantém o mesmo objeto (a ficha aberta continua ligada)
          else next[fid] = rest;
        });
        Object.entries(S.fichas).forEach(([k, f]) => {
          if (f.npc) next[k] = f;
        });
        S.fichas = next;
        clearTimeout(S.idxT);
        S.idxT = setTimeout(syncIndice, 1500);
        if (S.abrirFicha && S.fichas[S.abrirFicha]) {

  );

    S.db.listenCol(
      p + "/log",

      },
      fail
    )
  );
  u.push(
    S.db.listenDoc(
      p + "/estado/combate",

        S.combate = c;

        if (!S.dragging) renderBoard();
      },
      () => {}
    )
  );
  u.push(
    S.db.listenCol(
      p + "/tokens",
      { orderBy: "criada", dir: "asc" },
      list => {
        S.loaded.tokens = true;
        S.tokens = list;
        renderBoard();
        if (S.tool === "tokens") renderPanel();
      },
      fail
    )
  );
  u.push(
    S.db.listenCol(
      p + "/homebrew",
      { orderBy: "criada", dir: "asc" },
      list => {
        S.homebrew = list;
        if (S.tool === "homebrew") renderPanel();
      },
      () => {}
    )
  );
  ajudaPrimeiraVez();
  subscribeArteBest();
  subscribeMembros();
  subscribePrivado();
  subscribeTrilha();
  if (known) setMesa(known);
  renderRail();
  renderBoard();
  renderBoardTop();
  u.push(
    S.db.listenCol(
      p + "/pedidos",
      null,
      list => {
        S.pedidos = list;
        if (S.tool === "escudo" || S.tool === "agentes") renderPanel();

    )
  );

}
function leaveMesa(show) {

  if (S.gateUnsub) {
    try {
      S.gateUnsub();
    } catch (e) {}

  }

  });

  [

    "memUnsub",
    "privUnsub",
    "trilhaUnsub",
    "npcUnsub",
    "docsUnsub",
    "arteUnsub",
    "notasUnsub", // anotações do mestre (escudo)
    "notasDocUnsub", // anotações do jogador nos documentos (documentos/mural-notas)
    "muralUnsub"
  ].forEach(k => {

      try {
        S[k]();
      } catch (e) {}

  });
  S.npcMode = null;

  S.privA = [];
  S.privB = [];
  S.trilha = null;
  S.docs = [];

  }

/* O mestre vê a lista de cenas; os jogadores só recebem a cena exibida (as ocultas ficam em segredo). */
function syncCenasSub(prevActive, wasM) {
  const onList = list => {
    S.loaded.cenas = true;
    S.cenaVer = S.cenaVer || {};
    list.forEach(c => {
      const v = c.ver || 0;
      if (S.cenaVer[c.id] !== undefined && S.cenaVer[c.id] !== v && S.sceneImg[c.id]) {
        delete S.sceneImg[c.id];
        S.db
          .get(P() + "/cenaImg/" + c.id)
          .then(im => {
            if (im && im.url) {
              S.sceneImg[c.id] = im.url;
              renderBoard();
              renderMapTools();
            }
          })
          .catch(() => {});
      }
      S.cenaVer[c.id] = v;
    });
    S.cenas = list;
    renderBoardTop();
    if (S.tool === "cenas") renderPanel();
    renderBoard();
  };
  if (S.isM) {
    if (S.cenasMode === "all") return;
    if (S.cenasUnsub) S.cenasUnsub();
    S.cenasMode = "all";
    S.cenasUnsub = S.db.listenCol(P() + "/cenas", { orderBy: "criada", dir: "asc" }, onList, fail);
    return;
  }
  const a = S.mesa.cenaAtiva || null;
  if (S.cenasMode === "one:" + a) return;
  if (S.cenasUnsub) S.cenasUnsub();
  S.cenasMode = "one:" + a;
  S.cenas = [];
  if (!a) {
    S.cenasUnsub = null;
    onList([]);
    return;
  }
  S.cenasUnsub = S.db.listenDoc(
    P() + "/cenas/" + a,
    c => onList(c ? [{ id: a, ...c }] : []),
    () => {}
  );
}
/* Anotações do mestre (aba Escudo), salvas em mestre/notas. */
function subscribeNotas() {
  if (S.notasUnsub || !S.isM) return;
  S.notasUnsub = S.db.listenDoc(
    P() + "/mestre/notas",
    n => {
      S.notas = (n && n.texto) || "";
      const ta = $("#notasM");
      if (ta && document.activeElement !== ta) ta.value = S.notas;
    },
    () => {}
  );
}

<script>

/* Resultado de dado que aparece na tela de todos e registro da mesa. */
/* ===================== POPUP DE DADOS ===================== */
function dicePop(e) {
  if (e.tipo === "chat") {
    if (e.autor !== S.uid) toast(`${e.quem || "Alguém"}: ${e.titulo}`);
    return;
  }
  const h = $("#dicePops");

  el.innerHTML = `<span style="color:var(--purple-hi)">${I.dado}</span><div style="min-width:0"><div class="t">${esc(e.quem || "Mestre")} · ${esc(e.titulo)}</div><div class="s">${esc(e.det)}</div></div><div class="n">${e.total ?? "✦"}</div>`;
  h.prepend(el);
  while (h.children.length > 3) h.lastChild.remove();
  el.onclick = () => el.remove();
  setTimeout(() => el.remove(), 6500);
}
async function logEntry(e) {

    // personagem fora de mesa (mesa/personagens): sem registro, só mostra o dado na tela
    if (e.tipo !== "chat")
      dicePop({
        ts: Date.now(),
        quem: e.quem,
        titulo: e.titulo,
        total: e.total ?? null,
        det: e.det || "",
        flag: e.flag || "",
        tipo: e.tipo || "roll"
      });
    return;
  }
  if (!S.mesaId) return;
  const body = {
    ts: Date.now(),
    autor: S.uid,
    quem: String(e.quem || "").slice(0, 60),
    titulo: String(e.titulo || "").slice(0, 300),
    total: e.total ?? null,
    det: String(e.det || "").slice(0, 600),
    tipo: e.tipo || "roll",
    flag: e.flag || ""
  };
  if (e.para && e.para !== "__eu") {
    return enviarPrivado({ ...e, tipo: e.tipo || "roll" });
  }
  if (e.para === "__eu") e.secreto = true;
  if (e.secreto) {
    S.secret.unshift({ ...body, id: "s" + rid(6) });
    S.secret = S.secret.slice(0, 40);
    dicePop(body);
    if (S.tool === "escudo") renderPanel();

<script>
"use strict";
/* Recortar imagem (foto da ficha e tokens). */
/* ===================== RECORTE DE IMAGEM (foto da ficha e tokens) ===================== */
function cropImage(
  file,
  { size = 240, round = false, type = "image/jpeg", title = "Ajustar imagem", ratio = 1, radius = 0 } = {}
) {
  return new Promise(async res => {
    let im;
    try {
      im = await loadImg(file);
    } catch (e) {
      toast("Não consegui abrir essa imagem.");
      return res(null);
    }
    const V0 = 280,
      VH = Math.round(V0 * ratio);
    const base = Math.max(V0 / im.naturalWidth, VH / im.naturalHeight);
    let z = 1,
      ox = 0,
      oy = 0;
    const h = $("#modalHost");
    h.innerHTML = `<div class="modal-back"><div class="modal" role="dialog" aria-label="${esc(title)}"><h3>${esc(title)}</h3>
      <div class="crop ${round ? "round" : ""}" style="${ratio !== 1 ? `aspect-ratio:1/${ratio};` : ""}${radius ? `border-radius:${radius * 100}%;` : ""}"><canvas id="cropC" width="${V0}" height="${VH}"></canvas></div>
      <div class="row" style="flex-wrap:nowrap"><span class="muted small">Zoom</span><input type="range" id="cropZ" min="1" max="4" step="0.01" value="1" style="flex:1" aria-label="Zoom"></div>
      <p class="muted small" style="margin:0">Arraste a imagem para posicionar.</p>
      <div class="row" style="justify-content:flex-end"><button class="btn" id="cNo">Cancelar</button><button class="btn primary" id="cOk">Usar imagem</button></div></div></div>`;
    const c = $("#cropC"),
      g = c.getContext("2d");
    const clamp = () => {
      const s = base * z;
      const w = im.naturalWidth * s,
        hh = im.naturalHeight * s;
      ox = Math.min(0, Math.max(V0 - w, ox));
      oy = Math.min(0, Math.max(VH - hh, oy));
    };
    const center = () => {
      const s = base * z;
      ox = (V0 - im.naturalWidth * s) / 2;
      oy = (VH - im.naturalHeight * s) / 2.6;
      clamp();
    };
    const draw = () => {
      const s = base * z;
      g.clearRect(0, 0, V0, VH);
      g.drawImage(im, ox, oy, im.naturalWidth * s, im.naturalHeight * s);
    };
    center();
    draw();
    $("#cropZ").oninput = e => {
      const cx = V0 / 2,
        cy = VH / 2;
      const s0 = base * z;
      z = +e.target.value;
      const s1 = base * z;
      ox = cx - ((cx - ox) * s1) / s0;
      oy = cy - ((cy - oy) * s1) / s0;
      clamp();
      draw();
    };
    let drag = null;
    c.onpointerdown = e => {
      drag = { x: e.clientX, y: e.clientY, ox, oy };
      try {
        c.setPointerCapture(e.pointerId);
      } catch (_) {}
    };
    c.onpointermove = e => {
      if (!drag) return;
      ox = drag.ox + e.clientX - drag.x;
      oy = drag.oy + e.clientY - drag.y;
      clamp();
      draw();
    };
    c.onpointerup = c.onpointercancel = () => (drag = null);
    c.onwheel = e => {
      e.preventDefault();
      const r = $("#cropZ");
      r.value = Math.max(1, Math.min(4, z * (e.deltaY < 0 ? 1.08 : 1 / 1.08)));
      r.oninput({ target: r });
    };
    $("#cNo").onclick = () => {
      h.innerHTML = "";
      res(null);
    };
    $("#cOk").onclick = () => {
      const s = base * z;
      const out = document.createElement("canvas");
      out.width = size;
      out.height = Math.round(size * ratio);
      const o = out.getContext("2d");
      o.imageSmoothingQuality = "high";
      if (round) {
        o.beginPath();
        o.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2);
        o.clip();
      }
      const k = size / V0;
      o.drawImage(im, ox * k, oy * k, im.naturalWidth * s * k, im.naturalHeight * s * k);
      let url = out.toDataURL(type, 0.85);
      if (type === "image/webp" && !url.startsWith("data:image/webp")) url = out.toDataURL("image/png");
      h.innerHTML = "";
      res(url);
    };
  });
}
</script>

   ${r0.forma !== "livre" ? `<div class="field"><span class="label">Cor da moldura</span><div class="swatches">${COR_TOKEN.map(c => `<label><input type="radio" name="cor" value="${c}" ${c === corDe(S.uid) ? "checked" : ""}><span style="background:${c}"></span></label>`).join("")}</div></div>` : ""}
   ${S.viewSid ? `<label class="check"><input type="checkbox" name="cena" checked> Colocar na cena agora</label>` : ""}`,

function fitView() {

  if (!r.width) return;

  V.z = Math.max(0.05, Math.min(4, z));
  V.x = (r.width - V.w * V.z) / 2;

  V.y = cy - (cy - V.y) * (nz / V.z);

$("#zIn").onclick = () => {

};
$("#zOut").onclick = () => {
  const r = board.getBoundingClientRect();

};
$("#zFit").onclick = () => {

board.addEventListener(
  "wheel",
  e => {

board.addEventListener("contextmenu", e => {

function mapPt(e) {

const ptr = new Map();
let pan = null,
  pinch = null,
  act = null;
board.addEventListener("pointerdown", e => {
  if (
    e.target.closest(
      ".tok,.mdoc,.porta,.passagem,.zoom,.board-top,.tokbar,.board-empty button,.callbar,.screens,.maptools"
    )
  )
    return;
  if (e.isPrimary) {
    ptr.clear();
    pinch = null;
    pan = null;
  } // dedo novo começa um gesto do zero (evita dedo "fantasma" que travava o arrastar)
  ptr.set(e.pointerId, { x: e.clientX, y: e.clientY });

    board.setPointerCapture(e.pointerId);
  } catch (_) {}
  if (ptr.size === 2) {
    const [a, b] = [...ptr.values()];
    pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), z: V.z };
    pan = null;
    if (act) {
      act = null;
      S.live = null;
      renderOverlay();

    return;
  }

  if (tool !== "mover" && e.button === 0 && V.w) {
    act = toolDown(tool, mapPt(e), e);
    if (act) return;

board.addEventListener("pointermove", e => {

    const [a, b] = [...ptr.values()];
    const r = board.getBoundingClientRect();
    const dd = Math.hypot(a.x - b.x, a.y - b.y);
    zoomAt((pinch.z * dd) / pinch.d / V.z, (a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top);
    return;
  }
  if (act) {
    act.move(mapPt(e));
    return;

    V.y = pan.vy + e.clientY - pan.y;

document.addEventListener("keydown", e => {

/* ---------- névoa de guerra ---------- */

  if (!fogOn()) return false;
  let hid = true;
  for (const o of S.fog.ops || []) {

/* ---------- desenhos ---------- */
function drawPath(pts) {
  if (!pts || pts.length < 2) return "";
  let d = `M${pts[0]} ${pts[1]}`;
  for (let i = 2; i < pts.length; i += 2) d += ` L${pts[i]} ${pts[i + 1]}`;
  return d;
}
function renderDraws() {
  const s = $("#drawL");
  if (!s) return;
  s.innerHTML = (S.draws || [])
    .slice()
    .sort((a, b) => (a.ts || 0) - (b.ts || 0))
    .map(d =>
      d.pts && d.pts.length === 2
        ? `<circle cx="${d.pts[0]}" cy="${d.pts[1]}" r="${(d.w || 4) / 1.5}" fill="${esc(d.cor)}"/>`
        : `<path d="${drawPath(d.pts)}" fill="none" stroke="${esc(d.cor)}" stroke-width="${d.w || 4}" stroke-linecap="round" stroke-linejoin="round"/>`
    )
    .join("");
}
function simplificar(pts, tol) {
  // reduz pontos de um traço (Ramer–Douglas–Peucker)
  const P2 = [];
  for (let i = 0; i < pts.length; i += 2) P2.push([pts[i], pts[i + 1]]);
  const keep = new Array(P2.length).fill(false);
  keep[0] = keep[P2.length - 1] = true;
  const st = [[0, P2.length - 1]];
  while (st.length) {
    const [a, b] = st.pop();
    let md = 0,
      mi = -1;
    const [x1, y1] = P2[a],
      [x2, y2] = P2[b];
    const L = Math.hypot(x2 - x1, y2 - y1) || 1;
    for (let i = a + 1; i < b; i++) {
      const [x, y] = P2[i];
      const dd = Math.abs((y2 - y1) * x - (x2 - x1) * y + x2 * y1 - y2 * x1) / L;
      if (dd > md) {
        md = dd;
        mi = i;
      }
    }
    if (md > tol && mi > 0) {
      keep[mi] = true;
      st.push([a, mi], [mi, b]);
    }
  }
  const out = [];
  P2.forEach((p, i) => {
    if (keep[i]) out.push(Math.round(p[0]), Math.round(p[1]));
  });
  return out;
}

/* ---------- ping e régua ---------- */
function showPing(p) {
  const s = $("#ovL");
  if (!s) return;
  const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
  g.setAttribute("class", "ping");
  g.innerHTML = `<circle cx="${p.x}" cy="${p.y}" r="10" fill="${esc(p.cor)}"/><circle class="pr" cx="${p.x}" cy="${p.y}" r="10" fill="none" stroke="${esc(p.cor)}"/><circle class="pr d2" cx="${p.x}" cy="${p.y}" r="10" fill="none" stroke="${esc(p.cor)}"/><text x="${p.x}" y="${p.y}" dy="-26" text-anchor="middle">${esc(p.quem || "")}</text>`;
  s.appendChild(g);
  setTimeout(() => g.remove(), 2600);
}
function metros(px) {
  const b = tokenBase();
  const cas = px / b;
  return { cas, m: Math.round(cas * 1.5 * 2) / 2 };
}
function renderOverlay() {
  const s = $("#ovL");
